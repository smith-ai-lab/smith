name: fetch-smith
description: >
  Downloads the newest published smith release (#2746), checks its SHA-256 and puts its `bin/` first on PATH, so
  `smith build` can build this tree. It asks `releases/latest/download/<name>` (the URL `smith build stage0` uses,
  #2719; no feed, no API, no login, #829) and reads the tag from that URL's redirect. If the newest release has no
  tarball for this platform yet it fails; it never falls back to an older release. The lag rule
  (knowledge/smith-bootstrap.md) lets a release newer than the checkout build it.

runs:
  using: composite
  steps:
    - name: Download the newest release
      shell: bash
      run: |
        set -eu
        os=$(uname -s | tr A-Z a-z)
        arch=$(uname -m)
        name="smith-$os-$arch.tar.xz"
        base=https://github.com/smith-ai-lab/smith/releases/latest/download
        mkdir -p .smith/stage0
        # a download from GitHub gets a 504 now and then: retry for about 2 minutes (8 tries, 5 s apart; #2792)
        # The first redirect of releases/latest/download/<name> names the tag of the newest published release.
        url=$(curl -sS --retry 8 --retry-delay 5 --retry-all-errors -o /dev/null -w '%{redirect_url}' "$base/$name")
        tag=$(echo "$url" | sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p')
        if [ -z "$tag" ]; then
          echo "fetch-smith: the newest release has no $name yet (published about an hour after its commit); not using an older one" >&2
          exit 1
        fi
        curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors -o ".smith/stage0/$name" "$base/$name"
        curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors -o ".smith/stage0/$name.sha256" "$base/$name.sha256"
        want=$(cut -d' ' -f1 ".smith/stage0/$name.sha256")
        if command -v sha256sum >/dev/null; then got=$(sha256sum ".smith/stage0/$name" | cut -d' ' -f1)
        else got=$(shasum -a 256 ".smith/stage0/$name" | cut -d' ' -f1); fi
        [ "$want" = "$got" ] || { echo "fetch-smith: checksum of $tag/$name differs" >&2; exit 1; }
        tar -xJf ".smith/stage0/$name" -C .smith/stage0
        echo "fetch-smith: using $tag" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "$PWD/.smith/stage0/bin" >>"$GITHUB_PATH"
