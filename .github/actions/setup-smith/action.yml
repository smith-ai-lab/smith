name: setup-smith
description: >
  Builds smith on a hosted runner (#798): the newest release (fetch-smith downloads it), the LLVM pack of this configuration (restored from the cache, else `smith build llvm`
  downloads it from its release instead of building it, #797), then smith itself, and with `tests: true` the tests
  too (the runner and every test program, so that a job that only runs tests has nothing to compile). Compiles come
  from the step cache (`~/.cache/smith/steps`, restored from the newest entry main saved). Sets SMITH to the built
  smith's path. The caller has checked out the whole history (fetch-depth: 0); releases are fetched over
  plain HTTPS.

inputs:
  tests:
    description: build the tests too ("true" or "false")
    default: "false"

  test-flags:
    description: >
      the options of the `smith test` that will run in this job (`--macos-only --shard 1/1 --costs <file>`), so the
      step builds only the tests that run (#2242); the same options must be given to the run, or the runner is rebuilt.
      Empty: every test
    default: ""

  artifact:
    description: >
      the name of an artifact holding `build/` and `.smith/` of this run's `build-linux` job (#1758): restore it and
      set SMITH instead of fetching the previous smith and building (empty: build here)
    default: ""

outputs:
  llvm-key:
    description: the cache key of the LLVM pack
    value: ${{ steps.llvm.outputs.key }}

runs:
  using: composite
  steps:
    - name: Free disk on a hosted Linux runner
      # the image's toolchains this repository never uses take about 30 GB of the 14 free; removing them in the
      # background while the caches restore costs no time, and the last step waits for 40 GB free or its end (#2242: `release-linux` and a
      # test part died with "No space left on device")
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost \
          /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift >"$RUNNER_TEMP/free-disk.log" 2>&1 &
        echo $! >"$RUNNER_TEMP/free-disk.pid"
        df -h / | tail -n 1 | sed 's/^/disk before: /'

    - name: Cache keys
      id: llvm
      shell: bash
      run: |
        # the pack of an LLVM configuration never changes: one key for as long as the name does
        name=$(sed -n 's/.*"SMITH_LLVM_NAME", "\([^"]*\)".*/\1/p' build.c | head -1)
        echo "key=smith-llvm-$RUNNER_OS-$RUNNER_ARCH-$name" >>"$GITHUB_OUTPUT"

    - name: Restore the LLVM pack
      # restores everywhere and saves when the key was missing (the first run of a configuration; main's copy is the
      # one every pull request restores)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/smith/llvm
          ~/.cache/smith/enzyme
        key: ${{ steps.llvm.outputs.key }}

    - name: Restore the step cache
      # a job that takes the build of `build-linux` compiles nothing: no step cache to carry (1 GB of disk and time)
      id: steps
      if: inputs.artifact == ''
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/smith/steps
          ~/.cache/smith/packages
          ~/.cache/smith/tools
        key: smith-steps-${{ runner.os }}-${{ github.sha }}
        restore-keys: smith-steps-${{ runner.os }}-

    - name: Fetch the previous smith
      if: inputs.artifact == ''
      uses: ./.github/actions/fetch-smith

    - name: Fetch the LLVM pack
      if: inputs.artifact == ''
      shell: bash
      run: |
        start=$(date +%s)
        # the release's `smith build llvm` takes the pack of the
        # identity this tree wants from the cache above or downloads it (a hosted runner has no LLVM, and building it
        # takes hours)
        smith build llvm
        echo "fetch: $(( $(date +%s) - start )) s (step cache: ${{ steps.steps.outputs.cache-matched-key || 'none' }})" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Build smith
      if: inputs.artifact == ''
      shell: bash
      env:
        # the cache is saved whole, so it is kept small: the least recently used results go past this
        SMITH_CACHE_MAX: 1G
      run: |
        start=$(date +%s)
        smith build
        smith=$(ls "$PWD"/build/*/smith | head -n 1)
        echo "SMITH=$smith" >>"$GITHUB_ENV"
        echo "build: $(( $(date +%s) - start )) s ($smith)" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Build the tests
      if: inputs.artifact == '' && inputs.tests == 'true'
      shell: bash
      env:
        SMITH_CACHE_MAX: 1G
      run: |
        start=$(date +%s)
        # `--list` builds the runner and every test program (of the given `test-flags` part) and runs none of them. The compiler's errors go to stdout
        # (stderr only says `build stopped`), so the output is kept in a file, not dropped with the list (#1115, #1118):
        # a failure prints the end of smith's own output, then its error lines last, also in the job summary
        if ! SMITH_OUTPUT=full "$SMITH" test --list ${{ inputs.test-flags }} >"$RUNNER_TEMP/list.out" 2>&1; then
          tail -n 300 "$RUNNER_TEMP/list.out"
          for runner in build/*/front-project/build/tests; do
            [ -x "$runner" ] && { echo "::group::$runner --list"; "$runner" --list 2>&1 | tail -n 100; echo "::endgroup::"; }
          done
          # the compiler's `file:line:col: error:` lines with their source lines, and the command that failed (the
          # nested build's full output is also in `.smith/log/.smith_task_*.log`, a hidden file a `*` glob misses)
          cat .smith/log/.smith_task_*.log "$RUNNER_TEMP/list.out" 2>/dev/null |
            grep -hE -A3 '^[^ :]+:[0-9]+:[0-9]+: (fatal )?error|^FAILED:|^smith: build stopped' | grep -vE '^--$' | awk '!seen[$0]++' |
            tail -n 60 >"$RUNNER_TEMP/build-failed.txt" || true
          [ -s "$RUNNER_TEMP/build-failed.txt" ] || tail -n 60 "$RUNNER_TEMP/list.out" >"$RUNNER_TEMP/build-failed.txt"
          { echo '### The tests did not build'; echo '```'; cat "$RUNNER_TEMP/build-failed.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          echo "THE TESTS DID NOT BUILD:"
          cat "$RUNNER_TEMP/build-failed.txt"
          exit 1
        fi
        echo "tests built: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Download the build of this run
      if: inputs.artifact != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/smith-build

    - name: Restore the build of this run
      if: inputs.artifact != ''
      shell: bash
      run: |
        start=$(date +%s)
        # same checkout path in every job, so the absolute paths inside build/ still hold. The files get the time of
        # now, newer than the checkout's sources, so nothing looks out of date and is rebuilt
        tar -x --zstd -f "$RUNNER_TEMP/smith-build/build.tar.zst"
        find build .smith -exec touch -h {} +
        smith=$(ls "$PWD"/build/*/smith | head -n 1)
        echo "SMITH=$smith" >>"$GITHUB_ENV"
        # the pack, when the cache above missed it (the first run of a configuration)
        "$smith" build llvm
        echo "restore: $(( $(date +%s) - start )) s ($smith)" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Disk left
      if: always() && runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        # the background removal of the first step must have freed enough before the job fills the disk: wait for
        # 40 GB free on `/`, or for the removal to end, whichever comes first (#2255; waiting for the whole removal cost
        # about 127 s per job, when 108 GB were free at the end)
        pid=$(cat "$RUNNER_TEMP/free-disk.pid" 2>/dev/null || true)
        start=$(date +%s)
        free() { df --output=avail -BG / | tail -n 1 | tr -dc '0-9'; }
        while [ "$(free)" -lt 40 ] && [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; do sleep 1; done
        echo "disk wait: $(( $(date +%s) - start )) s, $(free) GB free" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "disk: $(df -h / | tail -n 1)" | tee -a "$GITHUB_STEP_SUMMARY"
