name: setup-smith
description: >
  Builds smith on a hosted runner (#798): the newest release (fetch-smith downloads it), the LLVM pack of this configuration (restored from the cache, else `smith build llvm`
  downloads it from its release instead of building it, #797), then smith itself, and with `tests: true` the tests
  too (the runner and every test program, so that a job that only runs tests has nothing to compile). Compiles come
  from the step cache (`~/.cache/smith/steps`, restored from the newest entry main saved). Sets SMITH to the built
  smith's path. The caller has checked out the whole history (fetch-depth: 0); releases are fetched over
  plain HTTPS.

inputs:
  tests:
    description: build the tests too ("true" or "false")
    default: "false"

  test-flags:
    description: >
      the options of the `smith test` that will run in this job (`--macos-only --shard 1/1 --costs <file>`), so the
      step builds only the tests that run (#2242); the same options must be given to the run, or the runner is rebuilt.
      Empty: every test
    default: ""

  artifact:
    description: >
      the name of an artifact holding `build/` and `.smith/` of this run's `build-linux` job (#1758): restore it and
      set SMITH instead of fetching the previous smith and building (empty: build here)
    default: ""

  profile:
    description: >
      the build profile of `smith build` (#2684): `dev` (-O0, the default) or `release` (-O2). The front-end coverage
      shards measure a release smith, so the count is not slowed by the dev profile
    default: dev

  step-cache-max:
    description: >
      the size the step cache is kept within (SMITH_CACHE_MAX): the least recently used results go past it, with their
      manifests, at the start of a build. The one place the cap is written (#2833): `warm` saves the folder whole, so
      it is what every job restores. One warm build leaves 650 to 670 MB on the Mac and about 1.4 GB on Linux since it
      builds the release profile too (#3052: 1,397 MB, 2,332 results), so a cap under that prunes the whole of what
      `warm` saved (#3045: at 300M every build missed all 329 steps, 28 s became 67 to 108 s; #3052: at 1G every Linux
      build failed on "dropped every result"). 2G keeps the newest Linux build with room for the next one's new results
    default: 2G

  stage0:
    description: >
      the release to build with instead of the newest (`stage0-<commit>`), waited for and never replaced; main's `warm` names its
      own commit's, the one every job after it fetches (#2833). Empty: the newest
    default: ""

outputs:
  llvm-key:
    description: the cache key of the LLVM pack
    value: ${{ steps.llvm.outputs.key }}

runs:
  using: composite
  steps:
    - name: Free disk on a hosted Linux runner
      # the image's toolchains this repository never uses take about 30 GB of the 14 free; removing them in the
      # background while the caches restore costs no time, and the last step waits for 40 GB free or its end (#2242: `release-linux` and a
      # test part died with "No space left on device")
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost \
          /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift >"$RUNNER_TEMP/free-disk.log" 2>&1 &
        echo $! >"$RUNNER_TEMP/free-disk.pid"
        df -h / | tail -n 1 | sed 's/^/disk before: /'

    - name: Cache keys
      id: llvm
      shell: bash
      run: |
        # the pack of an LLVM configuration never changes: one key for as long as the name does
        name=$(sed -n 's/.*"SMITH_LLVM_NAME", "\([^"]*\)".*/\1/p' build.c | head -1)
        echo "key=smith-llvm-$RUNNER_OS-$RUNNER_ARCH-$name" >>"$GITHUB_OUTPUT"

    - name: Restore the LLVM pack
      # restores everywhere and saves when the key was missing (the first run of a configuration; main's copy is the
      # one every pull request restores)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/smith/llvm
          ~/.cache/smith/enzyme
        key: ${{ steps.llvm.outputs.key }}

    - name: Restore the step cache
      # a job that takes the build of `build-linux` compiles nothing: no step cache to carry (1 GB of disk and time)
      id: steps
      if: inputs.artifact == ''
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/smith/steps
          ~/.cache/smith/packages
          ~/.cache/smith/tools
        key: smith-steps-${{ runner.os }}-${{ github.sha }}
        restore-keys: smith-steps-${{ runner.os }}-

    - name: Fetch the store from main's release (#3176)
      # the store is one file per commit of main, `step-cache-<sha7>` (smith-steps-linux.tar.gz.NN), the same one
      # `smith build stage0` fetches in a clone: when no Actions cache entry matched (an expired cache, a fork, a
      # runner of another repository), the newest one among the last 20 first-parent commits fills the folder. It only
      # fills a cache: a missing or unreadable file leaves the folder empty and the steps run for real
      if: inputs.artifact == '' && runner.os == 'Linux' && steps.steps.outputs.cache-matched-key == ''
      shell: bash
      run: |
        base="https://github.com/${{ github.repository }}/releases/download"
        dir="$HOME/.cache/smith/steps"; mkdir -p "$dir"
        start=$(date +%s); got=none
        for sha in $(git rev-list --first-parent -n 20 HEAD); do
          tag="step-cache-${sha:0:7}"
          curl -fsIL -o /dev/null "$base/$tag/smith-steps-linux.sha" || continue
          part=0; : >"$RUNNER_TEMP/store.tar.gz"
          while curl -fsSL --retry 3 "$base/$tag/smith-steps-linux.tar.gz.$(printf %02d $part)" >>"$RUNNER_TEMP/store.tar.gz" 2>/dev/null; do part=$((part + 1)); done
          if [ "$part" -gt 0 ] && tar -xzf "$RUNNER_TEMP/store.tar.gz" -C "$dir"; then got=$tag; fi
          break
        done
        rm -f "$RUNNER_TEMP/store.tar.gz"
        echo "store: $got, $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Restore the packages and tools
      # a job that takes the build of `build-linux` restores no step cache, but still needs the packages the tests
      # fetch (the tree-sitter CLI, Neovim): main's `warm` saves them apart, a small cache (#2825), so such a job
      # reaches github.com for a package only when this cache lacks it
      if: inputs.artifact != ''
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/smith/packages
          ~/.cache/smith/tools
        key: smith-tools-${{ runner.os }}-${{ github.sha }}
        restore-keys: smith-tools-${{ runner.os }}-

    - name: Fetch the previous smith
      if: inputs.artifact == ''
      uses: ./.github/actions/fetch-smith
      with:
        tag: ${{ inputs.stage0 }}

    - name: Fetch the LLVM pack
      if: inputs.artifact == ''
      shell: bash
      env:
        # this is the first smith verb of the job, so it is the one that prunes the step cache (at most once an hour,
        # and it stamps the time). Without the cap here it pruned at the 10 GB default, and the builds below, with
        # their cap, skipped their prune: the folder stayed 9.8 GB and took 2 minutes to restore (#3045)
        SMITH_CACHE_MAX: ${{ inputs.step-cache-max }}
      run: |
        start=$(date +%s)
        # the release's `smith build llvm` takes the pack of the
        # identity this tree wants from the cache above or downloads it (a hosted runner has no LLVM, and building it
        # takes hours)
        smith build llvm 2>&1 | tee "$RUNNER_TEMP/fetch.out"
        # a cap that empties the cache stays visible but never fails the job (#3045: at 300M every build missed 329 of
        # 329 steps for hours; #3052: at 2G the Linux folder passed the cap again): the prune prints `kept 0 entries`
        # then, and the cap is below one warm build. A cache may only make a run faster, so the job goes on with the
        # empty cache and warns
        if grep -qE '^cache: kept 0 entries \(0 MB\), dropped [1-9]' "$RUNNER_TEMP/fetch.out"; then
          echo "::warning::the step cache cap (${{ inputs.step-cache-max }}) dropped every result: the job goes on with an empty cache; the cap must stay above one warm build (about 1.4 GB on Linux, 670 MB on the Mac, knowledge/ci/caches.md)"
        fi
        echo "fetch: $(( $(date +%s) - start )) s (step cache: ${{ steps.steps.outputs.cache-matched-key || 'none' }})" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Build smith
      if: inputs.artifact == ''
      shell: bash
      env:
        # the cache is saved whole, so it is kept small: the least recently used results go past this (#2833)
        SMITH_CACHE_MAX: ${{ inputs.step-cache-max }}
      run: |
        start=$(date +%s)
        # the output is kept to count the steps the step cache served (#2833): "N steps, M cached"
        smith build -DPROFILE=${{ inputs.profile }} 2>&1 | tee "$RUNNER_TEMP/build.out"
        smith=$(ls "$PWD"/build/*/smith | head -n 1)
        echo "SMITH=$smith" >>"$GITHUB_ENV"
        echo "build: $(( $(date +%s) - start )) s, $(grep -cE '^\[[0-9]+/[0-9]+\] ' "$RUNNER_TEMP/build.out" || true) steps, $(grep -c ' (cached)$' "$RUNNER_TEMP/build.out" || true) cached ($smith)" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Report the step cache (build)
      if: inputs.artifact == ''
      continue-on-error: true
      uses: ./.github/actions/cache-report
      with:
        name: steps
        log: ${{ runner.temp }}/build.out
        inputs: '^(build\.c|patches/|llvm/)'

    - name: Build the tests
      if: inputs.artifact == '' && inputs.tests == 'true'
      shell: bash
      env:
        SMITH_CACHE_MAX: ${{ inputs.step-cache-max }}
      run: |
        start=$(date +%s)
        # `--list` builds the runner and every test program (of the given `test-flags` part) and runs none of them. The compiler's errors go to stdout
        # (stderr only says `build stopped`), so the output is kept in a file, not dropped with the list (#1115, #1118):
        # a failure prints the end of smith's own output, then its error lines last, also in the job summary
        if ! SMITH_OUTPUT=full "$SMITH" test --list ${{ inputs.test-flags }} >"$RUNNER_TEMP/list.out" 2>&1; then
          tail -n 300 "$RUNNER_TEMP/list.out"
          for runner in build/*/front-project/build/tests; do
            [ -x "$runner" ] && { echo "::group::$runner --list"; "$runner" --list 2>&1 | tail -n 100 || true; echo "::endgroup::"; }
          done
          for nested in .smith/log build/*/*-project/.smith/log; do
            [ -d "$nested" ] || continue
            echo "::group::$nested"
            ls -la "$nested" | tail -n 20
            for log in "$nested"/.smith_task_*.log; do [ -f "$log" ] && { echo "--- $log"; tail -n 60 "$log"; }; done
            echo "::endgroup::"
          done
          # the compiler's `file:line:col: error:` lines with their source lines, the linker's errors, and the command that failed (the
          # nested build's full output is also in `.smith/log/.smith_task_*.log`, and a nested project's (units, front) in its own, a hidden file a `*` glob misses)
          cat .smith/log/.smith_task_*.log build/*/*-project/.smith/log/.smith_task_*.log "$RUNNER_TEMP/list.out" 2>/dev/null |
            grep -hE -A3 '^[^ :]+:[0-9]+:[0-9]+: (fatal )?error|^FAILED:|^smith: build stopped|^Undefined symbols|^duplicate symbol|^ld[0-9.a-z]*: error|^clang(\+\+)?: error|^smith: build\.c' | grep -vE '^--$' | awk '!seen[$0]++' |
            tail -n 60 >"$RUNNER_TEMP/build-failed.txt" || true
          [ -s "$RUNNER_TEMP/build-failed.txt" ] || tail -n 60 "$RUNNER_TEMP/list.out" >"$RUNNER_TEMP/build-failed.txt"
          { echo '### The tests did not build'; echo '```'; cat "$RUNNER_TEMP/build-failed.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          echo "THE TESTS DID NOT BUILD:"
          cat "$RUNNER_TEMP/build-failed.txt"
          exit 1
        fi
        echo "tests built: $(( $(date +%s) - start )) s, $(grep -cE '^\[[0-9]+/[0-9]+\] ' "$RUNNER_TEMP/list.out" || true) steps, $(grep -c ' (cached)$' "$RUNNER_TEMP/list.out" || true) cached" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Report the step cache (tests built)
      if: inputs.artifact == '' && inputs.tests == 'true'
      continue-on-error: true
      uses: ./.github/actions/cache-report
      with:
        name: tests-built
        log: ${{ runner.temp }}/list.out
        inputs: '^(build\.c|patches/|llvm/)'

    - name: Download the build of this run
      if: inputs.artifact != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/smith-build

    - name: Restore the build of this run
      if: inputs.artifact != ''
      shell: bash
      run: |
        start=$(date +%s)
        # same checkout path in every job, so the absolute paths inside build/ still hold. The build keeps the times it
        # was written with (a step records the time of each input it read, and is out of date when an input is newer
        # than that: touching the files made all 318 steps run, 3 minutes), and the checkout's sources, the same
        # commit's, get an old time so that they are not newer than the build (#2833)
        tar -x --zstd -f "$RUNNER_TEMP/smith-build/build.tar.zst"
        git ls-files -z | xargs -0 touch -c -h -d '2001-01-01 00:00:00'
        smith=$(ls "$PWD"/build/*/smith | head -n 1)
        echo "SMITH=$smith" >>"$GITHUB_ENV"
        # the pack, when the cache above missed it (the first run of a configuration)
        "$smith" build llvm
        echo "restore: $(( $(date +%s) - start )) s ($smith)" | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Disk left
      if: always() && runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        # the background removal of the first step must have freed enough before the job fills the disk: wait for
        # 40 GB free on `/`, or for the removal to end, whichever comes first (#2255; waiting for the whole removal cost
        # about 127 s per job, when 108 GB were free at the end)
        pid=$(cat "$RUNNER_TEMP/free-disk.pid" 2>/dev/null || true)
        start=$(date +%s)
        free() { df --output=avail -BG / | tail -n 1 | tr -dc '0-9'; }
        while [ "$(free)" -lt 40 ] && [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; do sleep 1; done
        echo "disk wait: $(( $(date +%s) - start )) s, $(free) GB free" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "disk: $(df -h / | tail -n 1)" | tee -a "$GITHUB_STEP_SUMMARY"
