name: test-cache
description: >
  Restores the test-result store (the one store, `steps/a`, #2686, #3177) from the `test-cache-<sha7>-*` prereleases of the
  newest commit that has them (the commit under test and its first parents, #2938), which every job that runs tests in
  a merge queue run publishes with `./.github/actions/test-cache/save` (#2833, #2870): each Linux part and the macOS
  job its own, and this action extracts all of that commit's stores of the OS. `smith test` then leaves out every test whose key (its code, what it read, the smith under test) matches an
  entry that passed. A missing or unreadable release only leaves the store empty: every test runs. A cache entry never
  changes a result and a failure is never stored. `fresh: true` (the nightly full run) restores nothing, so every test
  runs and the run stores them all.
  The one store (`steps/a`, #3177) is all that travels: the results of tests, formats, lints and imports are answers in
  it (#3313, #3330), so there is no second tarball of imports and no `smith/tests` folder (#3347). The action sets
  SMITH_IMPORT_CACHE_LOG, from which `./.github/actions/test-cache/save` (or `./.github/actions/test-cache/report`)
  prints the job's import-cache hits.

  A queue run's Linux jobs restore one list (#3471): `build-linux` runs this action with `resolve-only: true`, which
  chooses the store files (the whole file and the additions) and restores nothing, and each part is handed that list
  (`urls`, `from`), so every part deals the tests from the same store. Left to itself each part chose at its own start,
  and a commit that published its additions between two parts' starts gave them different stores and so different deals.

inputs:
  resolve-only:
    description: '"true" chooses the list of store files and outputs it (`urls`, `from`); nothing is downloaded'
    default: "false"
  urls:
    description: the list chosen by an earlier run of this action (`urls` output, space separated); with `from`, nothing is chosen again
    default: ""
  from:
    description: the description of that list (`from` output); empty means choose here
    default: ""
  os:
    description: the OS of the store, "linux" or "macos"
    default: linux
  fresh:
    description: '"true" restores nothing'
    default: "false"
  tests:
    description: '"false" restores nothing (a job that runs no test, the count)'
    default: "true"
  only:
    description: >
      the name of one job's additions (`count1of4`, #3457): restore only the newest `test-cache-<sha7>-linux-<only>` of
      the commits tried, not the whole file; for a job that reads a small known part of the store
    default: ""

outputs:
  urls:
    description: the store files chosen (resolve-only), space separated
    value: ${{ steps.list.outputs.urls }}
  from:
    description: where the list came from (resolve-only), for the restore line
    value: ${{ steps.list.outputs.from }}

runs:
  using: composite
  steps:
    - name: The import-cache log
      shell: bash
      # every smith of the job appends its import-cache counts here (#2891); the save or report step prints them
      run: echo "SMITH_IMPORT_CACHE_LOG=$RUNNER_TEMP/import-cache.log" >>"$GITHUB_ENV"
    - name: Find the newest commit's sets
      if: inputs.fresh != 'true' && inputs.tests == 'true' && inputs.from == ''
      shell: bash
      env:
        OS: ${{ inputs.os }}
        REPO: ${{ github.repository }}
      run: |
        # The sets of the newest commit that published them (#2938): the commit under test, then its first parents,
        # newest first, at most 20, each by its tags (`test-cache-<sha7>-<job>`, or `test-cache-<sha7>` before #2870).
        # In a merge queue a group's first parent is the group ahead of it, so a run reads the sets of the groups
        # before it, then main's; in a pull request it is main.
        # No REST call (#2978; the walk made about 18 a commit, and the workflow token's pool ran out): the parents come
        # from git (`rev-list`, after a fetch when the checkout is shallow), the tags of every commit from one
        # `git ls-remote --tags`, and an asset by its download URL (`releases/download/<tag>/<file>`, the repository is
        # public; the name is known from the OS), probed with a HEAD request, which neither needs a token nor counts
        # against the pool. A tag without the asset answers 404 and is skipped. A macOS job looks only at the `-macos`
        # tag of a commit (its sets are the only ones it can use), not at every Linux job's. Writes tests-urls (one URL a
        # line) and tests-from to RUNNER_TEMP.
        t="$RUNNER_TEMP"; : >"$t/tests-urls"
        echo "none in the commits tried" >"$t/tests-from"
        git rev-parse --verify -q "$GITHUB_SHA^{commit}" >/dev/null 2>&1 || git fetch -q --no-tags --depth=25 origin "$GITHUB_SHA" 2>/dev/null || true
        git rev-list --first-parent -n 20 "$GITHUB_SHA" >"$t/commits" 2>/dev/null ||
          git rev-list --first-parent -n 20 FETCH_HEAD >"$t/commits" 2>/dev/null || : >"$t/commits"
        tags=$(git ls-remote --tags origin 'refs/tags/test-cache-*' 'refs/tags/test-store-*' 2>/dev/null | sed 's#.*refs/tags/##' || true)
        printf '%s\n' "$tags" >"$t/tags"
        back=0
        while read -r sha; do
          mine=$(printf '%s\n' "$tags" | grep "^test-cache-${sha:0:7}" || true)
          # #3281: the Linux sets of a commit that descends from the change (3654c61) hold additions, not a full store
          post=false
          if git cat-file -e 3654c61 2>/dev/null && git merge-base --is-ancestor 3654c61 "$sha" 2>/dev/null; then post=true; fi
          if [ "$OS" = linux ] && [ "$post" = true ]; then back=$((back + 1)); continue; fi
          urls=""
          for tag in $mine; do
            job=${tag#test-cache-*-}; [ "$job" = "$tag" ] && job=""
            if [ "$OS" = macos ] && [ "$job" != macos ]; then continue; fi
            if [ "$OS" != macos ] && [ "$job" = macos ]; then continue; fi
            url="https://github.com/$REPO/releases/download/$tag/smith-tests-$OS.tar.gz"
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --retry 2 "$url" 2>/dev/null || true)
            [ "$code" = 200 ] || continue
            urls="$urls$url"$'\n'
          done
          if [ -n "$urls" ]; then
            printf '%s' "$urls" >"$t/tests-urls"
            echo "commit ${sha:0:7}, $back first parents back" >"$t/tests-from"
            break
          fi
          back=$((back + 1))
        done <"$t/commits"
    - name: Find the whole file (Linux test store)
      if: inputs.fresh != 'true' && inputs.tests == 'true' && inputs.os == 'linux' && inputs.from == ''
      shell: bash
      env:
        REPO: ${{ github.repository }}
        ONLY: ${{ inputs.only }}
      run: |
        # #3457: a job that names its own additions (the count shard) restores the newest of those and nothing else:
        # they hold every entry that job looked up (hits and misses), about 1 MB, not the 335,000 entries of the whole file
        if [ -n "$ONLY" ]; then
          t="$RUNNER_TEMP"; back=0; : >"$t/tests-urls"; echo "no store of $ONLY in the commits tried" >"$t/tests-from"
          while read -r sha; do
            s=${sha:0:7}
            if grep -qx "test-cache-$s-linux-$ONLY" "$t/tags"; then
              url="https://github.com/$REPO/releases/download/test-cache-$s-linux-$ONLY/smith-tests-added-linux.tar.gz"
              code=$(curl -sIL -o /dev/null -w '%{http_code}' --retry 2 "$url" 2>/dev/null || true)
              if [ "$code" = 200 ]; then
                printf '%s\n' "$url" >"$t/tests-urls"; echo "$ONLY of ${s}, $back first parents back" >"$t/tests-from"; break
              fi
            fi
            back=$((back + 1))
          done <"$t/commits"
          exit 0
        fi
        # #3281: the Linux test store is one whole file per commit of main (`test-store-<sha7>`, asset
        # `smith-tests-store-linux.tar.gz`, built by `./.github/actions/test-cache/whole` after the merge) plus the small
        # additions of every commit newer than it (`test-cache-<sha7>-linux-NofM`, asset `smith-tests-added-linux.tar.gz`,
        # only what a part added). Walk the same commits as above, newest first: the additions of each go on the list
        # until a commit that has a whole file; that file, then the additions oldest first, replace the list the step
        # above made. With no whole file in the commits tried (before the first one exists), the step above's list (the
        # newest commit's full sets) stays and the additions of the commits newer than it follow it. Sets published
        # before #3281 landed are full stores, the ones after it hold additions under the old name: a commit that
        # descends from the change (3654c61) is never a full set.
        t="$RUNNER_TEMP"
        adds=""; n=0; base=""; from=""; back=0
        while read -r sha; do
          s=${sha:0:7}
          if grep -qx "test-store-$s" "$t/tags"; then
            url="https://github.com/$REPO/releases/download/test-store-$s/smith-tests-store-linux.tar.gz"
            code=$(curl -sIL -o /dev/null -w '%{http_code}' --retry 2 "$url" 2>/dev/null || true)
            if [ "$code" = 200 ]; then base=$url; from="whole file of ${s}, $back first parents back"; break; fi
          fi
          for tag in $(grep "^test-cache-$s-linux-" "$t/tags" || true); do
            adds="https://github.com/$REPO/releases/download/$tag/smith-tests-added-linux.tar.gz"$'\n'"$adds"; n=$((n + 1))
          done
          back=$((back + 1))
        done <"$t/commits"
        if [ -n "$base" ]; then
          printf '%s\n%s' "$base" "$adds" >"$t/tests-urls"
          echo "$from, plus $n additions of the $back newer commits" >"$t/tests-from"
        elif [ -s "$t/tests-urls" ]; then
          full=$(sed -n 's/^commit \([0-9a-f]*\),.*/\1/p' "$t/tests-from")
          if true; then
            # the additions of the commits newer than the full sets' commit
            back_full=$(grep -n "^$full" "$t/commits" | head -n 1 | cut -d: -f1)
            adds=""; n=0
            while read -r sha; do
              for tag in $(grep "^test-cache-${sha:0:7}-linux-" "$t/tags" || true); do
                adds="https://github.com/$REPO/releases/download/$tag/smith-tests-added-linux.tar.gz"$'\n'"$adds"; n=$((n + 1))
              done
            done < <(head -n $(( ${back_full:-1} - 1 )) "$t/commits")
            printf '%s%s' "$(cat "$t/tests-urls")"$'\n' "$adds" >"$t/tests-urls.new"; mv "$t/tests-urls.new" "$t/tests-urls"
            echo "$(cat "$t/tests-from"), plus $n additions of the newer commits" >"$t/tests-from"
          fi
        fi
    - name: The list of store files (for the jobs that are handed it)
      id: list
      if: inputs.resolve-only == 'true'
      shell: bash
      run: |
        # one line each, so a job output carries it (a few URLs, far below the size limit of an output)
        urls=$(cat "$RUNNER_TEMP/tests-urls" 2>/dev/null | tr '\n' ' ' || true)
        from=$(cat "$RUNNER_TEMP/tests-from" 2>/dev/null || true)
        { echo "urls=$urls"; echo "from=$from"; } >>"$GITHUB_OUTPUT"
        echo "test store list: ${from:-none} ($(printf '%s\n' "$urls" | wc -w) files)" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Restore the execution records
      if: inputs.fresh != 'true' && inputs.tests == 'true' && inputs.os == 'linux' && inputs.resolve-only != 'true'
      continue-on-error: true
      shell: bash
      env:
        REPO: ${{ github.repository }}
      run: |
        # #3434: the records a nightly COVERAGE=1 run on main published (`test-records-<sha7>`, asset
        # `smith-test-records.tar.gz`), the newest one among the last 200 first-parent commits, unpacked into
        # `.smith/records`, where the test key reads them (#3387). A plain run never writes one. None found: the key
        # falls back to the whole smith, as before.
        tags=$(git ls-remote --tags origin 'refs/tags/test-records-*' 2>/dev/null | sed 's#.*refs/tags/##' || true)
        [ -n "$tags" ] || { echo "records: none published" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
        for sha in $(git rev-list --first-parent -n 200 "$GITHUB_SHA" 2>/dev/null); do
          printf '%s\n' "$tags" | grep -qx "test-records-${sha:0:7}" || continue
          url="https://github.com/$REPO/releases/download/test-records-${sha:0:7}/smith-test-records.tar.gz"
          if curl -fsSL --retry 3 "$url" >"$RUNNER_TEMP/records.tar.gz" 2>/dev/null; then
            mkdir -p .smith && tar -xzf "$RUNNER_TEMP/records.tar.gz" -C .smith &&
              echo "records: $(find .smith/records -name '*.rec' | wc -l) from test-records-${sha:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
        done
        echo "records: none among the last 200 commits" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Restore the test-result store
      if: inputs.tests == 'true' && inputs.resolve-only != 'true'
      shell: bash
      env:
        FRESH: ${{ inputs.fresh }}
        GIVEN_URLS: ${{ inputs.urls }}
        GIVEN_FROM: ${{ inputs.from }}
      run: |
        if [ "$FRESH" = true ]; then echo "test store: fresh run, nothing restored" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
        # every store of the commit the step above found: one per job that ran tests (a part's store holds what it
        # restored plus what it added, so a set with a part missing is still a whole store). REST, plain HTTPS download
        # (retried: release downloads return 504 now and then, #2792; a plain download URL, no token and no API call, #2978).
        # Only the one store (`steps/a`, #3177) is taken from a tarball; a set published before #3347 also holds the old
        # per-tool folder, which nothing reads, and it is left in the tarball.
        urls=$(cat "$RUNNER_TEMP/tests-urls" 2>/dev/null || true); from=$(cat "$RUNNER_TEMP/tests-from" 2>/dev/null || true)
        # the list `build-linux` chose for the whole run (#3471) replaces the one this job would choose
        if [ -n "$GIVEN_FROM" ]; then urls=$GIVEN_URLS; from="$GIVEN_FROM (chosen once for the run)"; fi
        stage="$RUNNER_TEMP/test-store-stage"; mkdir -p "$stage"
        got=0
        for url in $urls; do
          curl -fsSL --retry 3 "$url" >"$RUNNER_TEMP/tests.tar.gz" 2>/dev/null &&
            tar -xzf "$RUNNER_TEMP/tests.tar.gz" -C "$stage" steps && got=$((got + 1))
        done
        # the mark of the additions (#3281): what a part adds is newer than this file, and `save` publishes only that
        touch "$RUNNER_TEMP/test-store-mark"
        # the answers go where smith run inside a test looks (a scratch project's XDG_CACHE_HOME, tests/scratch.smith)
        # and where the smith run by hand looks (#3177)
        if [ -d "$stage/steps/a" ]; then
          tests="${SMITH_TEST_CACHE:-$HOME/.cache/smith-tests}/xdg/smith/steps"; mkdir -p "$tests"
          byhand="${XDG_CACHE_HOME:-$HOME/.cache}/smith/steps"; mkdir -p "$byhand"
          cp -a "$stage/steps/." "$byhand/" && cp -a "$stage/steps/." "$tests/"
        fi
        if [ "$got" -gt 0 ]; then
          echo "test store: restored $(find "$stage/steps" -type f 2>/dev/null | wc -l) entries from $got of $(printf '%s\n' $urls | grep -c .) stores ($from)" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "test store: none, every test runs ($from)" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
        rm -rf "$stage"
