name: test-cache
description: >
  Restores the test-result store (`~/.cache/smith/tests`, #2686) from the `test-cache-<sha7>-*` prereleases of the
  newest commit that has them (the commit under test and its first parents, #2938), which every job that runs tests in
  a merge queue run publishes with `./.github/actions/test-cache/save` (#2833, #2870): each Linux part and the macOS
  job its own, and this action extracts all of that commit's stores of the OS. `smith test` then leaves out every test whose key (its code, what it read, the smith under test) matches an
  entry that passed. A missing or unreadable release only leaves the store empty: every test runs. A cache entry never
  changes a result and a failure is never stored. `fresh: true` (the nightly full run) restores nothing, so every test
  runs and the run stores them all.
  The same releases hold the import cache (`~/.cache/smith/imports`, #2891), `smith-imports-<os>.tar.gz`: std's parse
  trees and the C headers' declarations, in a folder per smith identity (a smith whose front end differs reads none).
  This action extracts every one of the newest commit that published one, and sets SMITH_IMPORT_CACHE_LOG, from which
  `./.github/actions/test-cache/save` (or `./.github/actions/test-cache/report`) prints the job's hits. `fresh: true`
  restores none of it either.

inputs:
  os:
    description: the OS of the store, "linux" or "macos"
    default: linux
  fresh:
    description: '"true" restores nothing'
    default: "false"
  tests:
    description: '"false" restores only the import cache (a job that runs no test, the count)'
    default: "true"
  imports-from:
    description: >
      the jobs whose import caches are restored, as patterns of the last part of their tag (`count count-3`,
      `linux-*`); empty, every job's. A count shard's set holds what that shard's files import (40 to 90 MB once the
      module trees are stored, about 490 MB for the nine count sets of a commit), so a shard restores its own and the fix
      job's, and a test job only the test jobs' (the dev smith's; the count's are the release smith's) (#2939)
    default: ""

runs:
  using: composite
  steps:
    - name: The import-cache log
      shell: bash
      # every smith of the job appends its import-cache counts here (#2891); the save or report step prints them
      run: echo "SMITH_IMPORT_CACHE_LOG=$RUNNER_TEMP/import-cache.log" >>"$GITHUB_ENV"
    - name: Find the newest commit's sets
      if: inputs.fresh != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OS: ${{ inputs.os }}
        TESTS: ${{ inputs.tests }}
        FROM: ${{ inputs.imports-from }}
      run: |
        # The sets of the newest commit that published them (#2938): the commit under test, then its first parents,
        # newest first, at most 20, each by its tags (`test-cache-<sha7>-<job>`, or `test-cache-<sha7>` before #2870),
        # so no page of releases is read (the repository has hundreds; the newest commit's fell past the first page,
        # #2891). In a merge queue a group's first parent is the group ahead of it, so a run reads the sets of the groups
        # before it, then main's; in a pull request it is main. The test store and the import cache may come from two
        # commits, and the import cache only from the jobs `imports-from` names. A tag whose release was pruned answers
        # 404 and gh prints its body: only URLs are kept. Writes
        # <kind>-urls (one URL a line) and <kind>-from (which commit, for the summary) to RUNNER_TEMP.
        t="$RUNNER_TEMP"; : >"$t/tests-urls"; : >"$t/imports-urls"
        echo "none in the commits tried" >"$t/tests-from"; echo "none in the commits tried" >"$t/imports-from"
        want_tests=$TESTS; want_imports=true
        # reads use the read-only app's token when the job minted one (#2986)
        rd() { GH_TOKEN=${READ_GH_TOKEN:-$GH_TOKEN} gh api "$@"; }
        sha=$(rd "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .sha 2>/dev/null || true)
        back=0
        while [ -n "$sha" ] && [ "$back" -lt 20 ] && { [ "$want_tests" = true ] || [ "$want_imports" = true ]; }; do
          assets=$(for tag in $(rd "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/test-cache-${sha:0:7}" --jq '.[].ref|sub("refs/tags/";"")' 2>/dev/null); do
              rd "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[]|\"${tag#test-cache-*-} \\(.name) \\(.url)\"" 2>/dev/null || true
            done | grep ' https://' || true)
          for kind in tests imports; do
            want=want_$kind
            [ "${!want}" = true ] || continue
            urls=$(printf '%s\n' "$assets" | while read -r job name url; do
                [ "$name" = "smith-$kind-$OS.tar.gz" ] || continue
                ok=true
                if [ "$kind" = imports ] && [ -n "$FROM" ]; then
                  ok=false; set -f # the patterns are words, not files of the working folder
                  for pattern in $FROM; do [[ $job == $pattern ]] && ok=true; done # not `case`: bash 3.2 (macOS) cannot read its `)` inside $( )
                fi
                [ "$ok" = true ] && echo "$url"
              done || true)
            [ -n "$urls" ] || continue
            printf '%s\n' "$urls" >"$t/$kind-urls"
            echo "commit ${sha:0:7}, $back first parents back" >"$t/$kind-from"
            printf -v "$want" false
          done
          sha=$(rd "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.parents[0].sha // empty' 2>/dev/null || true)
          back=$((back + 1))
        done
    - name: Restore the test-result store
      if: inputs.tests == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OS: ${{ inputs.os }}
        FRESH: ${{ inputs.fresh }}
      run: |
        dir="${XDG_CACHE_HOME:-$HOME/.cache}/smith/tests"; mkdir -p "$dir"
        if [ "$FRESH" = true ]; then echo "test store: fresh run, nothing restored" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
        # every store of the commit the step above found: one per job that ran tests (a part's store holds what it
        # restored plus what it added, so a set with a part missing is still a whole store). REST, plain HTTPS download
        # (retried: release downloads return 504 now and then, #2792)
        urls=$(cat "$RUNNER_TEMP/tests-urls"); from=$(cat "$RUNNER_TEMP/tests-from")
        got=0
        for url in $urls; do
          rd -H 'Accept: application/octet-stream' "$url" >"$RUNNER_TEMP/tests.tar.gz" 2>/dev/null &&
            tar -xzf "$RUNNER_TEMP/tests.tar.gz" -C "$dir" && got=$((got + 1))
        done
        if [ "$got" -gt 0 ]; then
          echo "test store: restored $(find "$dir" -type f | wc -l) entries from $got of $(printf '%s\n' "$urls" | grep -c .) stores ($from)" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "test store: none, every test runs ($from)" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
    - name: Restore the import cache
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        OS: ${{ inputs.os }}
        FRESH: ${{ inputs.fresh }}
      run: |
        if [ "$FRESH" = true ]; then echo "import cache: fresh run, nothing restored" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
        dir="${XDG_CACHE_HOME:-$HOME/.cache}/smith/imports"; mkdir -p "$dir"
        # every job's set of the commit the step above found (each holds what it restored plus what its own processes
        # stored, so the sets overlap; the same entry is the same bytes)
        urls=$(cat "$RUNNER_TEMP/imports-urls"); from=$(cat "$RUNNER_TEMP/imports-from")
        got=0
        for url in $urls; do
          rd -H 'Accept: application/octet-stream' "$url" >"$RUNNER_TEMP/imports.tar.gz" 2>/dev/null &&
            tar -xzf "$RUNNER_TEMP/imports.tar.gz" -C "$dir" && got=$((got + 1))
        done
        # and where smith run inside a test looks (a scratch project's XDG_CACHE_HOME, tests/scratch.smith)
        if [ "$got" -gt 0 ]; then
          tests="${SMITH_TEST_CACHE:-$HOME/.cache/smith-tests}/xdg/smith/imports"; mkdir -p "$tests"; cp -a "$dir/." "$tests/"
        fi
        if [ "$got" -gt 0 ]; then
          echo "import cache: restored $(find "$dir" -type f -path '*/[hm]/*' | wc -l) entries ($(du -sh "$dir" | cut -f1)) from $got sets ($from)" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "import cache: none, std and the headers are read ($from)" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
