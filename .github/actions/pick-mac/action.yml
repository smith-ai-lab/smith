name: pick-mac
description: >
  Where a macOS job runs (knowledge/ci-hosted.md): the owner's Mac when a runner labelled self-hosted, macOS, ARM64 is
  online and not busy, else a hosted macos-26. No token, a fork pull request or a failed call: hosted. Shared by
  ci.yml and llvm.yml, so the rule is written once.
inputs:
  token:
    description: A token that may read the repository's runners (RUNNER_STATUS_TOKEN); empty means hosted
    required: false
    default: ""
  fork:
    description: "'true' for a pull request from a fork, which never runs on the Mac"
    required: false
    default: "false"
outputs:
  mac:
    description: The runs-on of a macOS job, as JSON
    value: ${{ steps.pick.outputs.mac }}
  cores:
    description: SMITH_CORES of a macOS job
    value: ${{ steps.pick.outputs.cores }}
runs:
  using: composite
  steps:
    - name: Pick the macOS runner
      id: pick
      shell: bash
      env:
        RUNNER_STATUS_TOKEN: ${{ inputs.token }}
        FORK: ${{ inputs.fork }}
        GH_REPO: ${{ github.repository }}
      run: |
        # a Mac that is off never stalls a run, and neither does one whose runners are all busy: both go to hosted.
        # Online and not busy (`.busy == false`) is a runner that would take the job now.
        mac='"macos-26"'; cores=3; why="no secret"
        if [ "$FORK" = true ]; then why="fork pull request"
        elif [ -n "$RUNNER_STATUS_TOKEN" ]; then
          if json=$(GH_TOKEN=$RUNNER_STATUS_TOKEN gh api "repos/$GH_REPO/actions/runners" --paginate --jq \
            '.runners[] | select([.labels[].name] | contains(["self-hosted", "macOS", "ARM64"])) | "\(.name) \(.status) \(.busy)"' 2>/dev/null); then
            free=$(printf '%s\n' "$json" | awk '$2 == "online" && $3 == "false" { printf "%s ", $1 }')
            if [ -n "$free" ]; then mac='["self-hosted","macOS","ARM64"]'; cores=5; why="online and idle: $free"
            elif printf '%s' "$json" | grep -q ' online '; then why="all Mac runners busy"
            else why="no Mac runner online"; fi
          else why="runners call failed"; fi
        fi
        echo "mac=$mac" >>"$GITHUB_OUTPUT"
        echo "cores=$cores" >>"$GITHUB_OUTPUT"
        echo "macOS jobs run on $mac ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
