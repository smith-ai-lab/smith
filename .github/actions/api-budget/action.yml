name: api-budget
description: >
  Prints the REST quota the workflows' GITHUB_TOKEN has left (#2986): `api budget: <job> <remaining> of <limit>,
  resets in <s> s`, and adds the line to the job summary. GitHub gives that token 1,000 requests an hour for the
  whole repository, shared by every job of every run. `GET /rate_limit` does not count against it. Every job calls
  this as its first step and as its last (`if: always()`); a job's spend is the difference between the two lines, less
  what ran beside it. Never fails: when the call fails it prints `api budget: <job> unknown`.

inputs:
  label:
    description: Name printed in the line
    default: ${{ github.workflow }}/${{ github.job }}

runs:
  using: composite
  steps:
    - name: API budget
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LABEL: ${{ inputs.label }}
      run: |
        line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
        [ -n "$line" ] || line=unknown
        # which pool answered (settles whether two jobs share a window): x-ratelimit-resource / -reset / -used
        hdr=$(gh api -i rate_limit 2>/dev/null | tr -d '\r' | grep -iE '^x-ratelimit-(resource|reset|used|limit):' | tr '\n' ' ') || hdr=
        line="$line [$hdr]"
        echo "api budget: $LABEL $line (workflow token)"
        echo "api budget: $LABEL $line (workflow token)" >>"$GITHUB_STEP_SUMMARY"
    - name: gh_retry for the steps that follow
      shell: bash
      run: |
        # every later `bash` step of the job reads this file (BASH_ENV) and so has the function `gh_retry`; the
        # function lives here so that no shell file is tracked (owner: "I don't want any shell files")
        cat >"$RUNNER_TEMP/gh-retry" <<'GH_RETRY'
        # gh_retry <command...>: runs the command (usually `gh api ...`) and, when it fails because the installation's REST
        # quota is spent (#2986: `API rate limit exceeded for installation`), reads GET /rate_limit (which does not count),
        # sleeps until the reset and tries again. A wait is not a failure. Any other error is returned as it is, at once.
        # Fail-closed: when the waits add up to API_WAIT_MAX seconds (default 1200) the last error is returned.
        #   API_WAIT_MAX    the most seconds to wait in all (default 1200)
        #   API_WAIT_SLEEP  the sleep command (default `sleep`; tests/gh_retry_test.smith replaces it)
        gh_retry() {
          local out err rc waited=0 max=${API_WAIT_MAX:-1200} s
          err=$(mktemp)
          while :; do
            rc=0
            out=$("$@" 2>"$err") || rc=$?
            if [ "$rc" = 0 ] || ! { printf '%s\n' "$out"; cat "$err"; } | grep -qiE 'rate limit exceeded|secondary rate limit'; then
              cat "$err" >&2
              rm -f "$err"
              [ -z "$out" ] || printf '%s\n' "$out"
              return "$rc"
            fi
            if [ "$waited" -ge "$max" ]; then
              echo "api budget: gave up after waiting ${waited} s for the quota" >&2
              cat "$err" >&2
              rm -f "$err"
              return "$rc"
            fi
            # seconds to the reset; /rate_limit is free. Without an answer (or with quota left: a burst limit) pause 30 s.
            s=$(gh api rate_limit --jq '.resources.core | if .remaining > 0 then 30 else (.reset - now | ceil) end' 2>/dev/null) || s=
            case $s in '' | *[!0-9]*) s=30 ;; esac
            s=$((s + 1))
            [ "$s" -le $((max - waited)) ] || s=$((max - waited))
            echo "api budget: waiting ${s} s for the quota" >&2
            ${API_WAIT_SLEEP:-sleep} "$s"
            waited=$((waited + s))
          done
        }
        GH_RETRY
        echo "BASH_ENV=$RUNNER_TEMP/gh-retry" >>"$GITHUB_ENV"
