name: the emulator of x86-64 chips
description: >
  Puts `qemu-x86_64` on the path. The test of an executable started on a chip
  without the level it was built for makes such a chip with it, and fails
  where it is not there. The packages that hold it, with what they need that
  the runner's image does not have, are kept between runs by the release of the
  system and the month, and the mirror is asked for them only when no run has
  kept them in that month.

runs:
  using: composite
  steps:
    # What names the kept files is the release of the system, the chip, and the
    # month, and not the version of the package, which only the mirror (or lists
    # that the runner's image may not carry, and `apt-get update` is 10 s) can
    # say. A kept file is replaced in the month after it was kept, with the
    # package the mirror has then.
    - id: version
      shell: bash
      run: |
        set -eu
        release=$(. /etc/os-release && echo "$ID-$VERSION_ID")
        echo "key=$release-$(uname -m)-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
    - id: kept
      uses: actions/cache@v4
      with:
        path: ~/.cache/qemu-x86_64
        key: qemu-x86_64-${{ steps.version.outputs.key }}
    - name: Fetch it from the mirror, as no run has kept them this month
      if: steps.kept.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends --download-only qemu-user
        mkdir -p ~/.cache/qemu-x86_64
        cp /var/cache/apt/archives/*.deb ~/.cache/qemu-x86_64/
    - name: Install what was kept
      shell: bash
      run: |
        set -eu
        dir=$HOME/.cache/qemu-x86_64
        if ! ls "$dir"/*.deb >/dev/null 2>&1; then
          echo "::error::no package of qemu-user is in $dir, so no chip can be made to lack a level; the test of that fails without it"
          exit 1
        fi
        # dpkg does not work out what to fetch, as apt does, and apt asked for
        # archives it had not on an image that was not the one of the run that
        # kept these. What the package needs besides itself is what that image
        # lacked. Another image may lack more, and then the mirror is asked, and
        # a warning says so, so that the test still runs.
        if ! sudo dpkg -i "$dir"/*.deb; then
          echo "::warning::what was kept does not install on this image; fetching qemu-user from the mirror"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
        fi
        if ! command -v qemu-x86_64 >/dev/null; then
          echo "::error::qemu-x86_64 is not installed, so no chip can be made to lack a level; the test of that fails without it"
          exit 1
        fi
        qemu-x86_64 --version | head -1
