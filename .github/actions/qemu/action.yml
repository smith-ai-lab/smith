name: the emulator of x86-64 chips
description: >
  Puts `qemu-x86_64` on the path. The test of an executable started on a chip
  without the level it was built for makes such a chip with it, and fails
  where it is not there. The packages that hold it, with what they need that
  the runner's image does not have, are kept between runs by the version of the
  package, and the mirror is asked for them only when no run has kept that
  version.

runs:
  using: composite
  steps:
    # The version the package has now, as the lists the runner's image carries
    # say, and as the mirror says when the image carries none. The image's own
    # version is in the key too, as what the package needs besides itself is
    # what that image lacks.
    - id: version
      shell: bash
      run: |
        set -eu
        version=$(apt-cache policy qemu-user | sed -n 's/^ *Candidate: //p')
        if [ -z "$version" ] || [ "$version" = "(none)" ]; then
          sudo apt-get update
          version=$(apt-cache policy qemu-user | sed -n 's/^ *Candidate: //p')
        fi
        if [ -z "$version" ] || [ "$version" = "(none)" ]; then
          echo "::error::no version of the package qemu-user, which has qemu-x86_64, is known"
          exit 1
        fi
        echo "the version is $version, on the image ${ImageVersion:-unknown}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - id: kept
      uses: actions/cache@v4
      with:
        path: ~/.cache/qemu-x86_64
        key: qemu-x86_64-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ steps.version.outputs.version }}
    - name: Fetch it from the mirror, as no run has kept this version
      if: steps.kept.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends --download-only qemu-user
        mkdir -p ~/.cache/qemu-x86_64
        cp /var/cache/apt/archives/*.deb ~/.cache/qemu-x86_64/
    - name: Install what was kept
      shell: bash
      run: |
        set -eu
        dir=$HOME/.cache/qemu-x86_64
        if ! ls "$dir"/*.deb >/dev/null 2>&1; then
          echo "::error::no package of qemu-user is in $dir, so no chip can be made to lack a level; the test of that fails without it"
          exit 1
        fi
        sudo apt-get install -y --no-install-recommends --no-download "$dir"/*.deb
        if ! command -v qemu-x86_64 >/dev/null; then
          echo "::error::qemu-x86_64 is not installed, so no chip can be made to lack a level; the test of that fails without it"
          exit 1
        fi
        qemu-x86_64 --version | head -1
