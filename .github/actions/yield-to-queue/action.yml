name: yield-to-queue
description: >
  A pull request's check gives its runner back while a merge queue job waits for one (#2856). GitHub has no job
  priority and hands runners out first come, first served, so a PR check job can take the runner a queue job was
  waiting for. Each heavy job of a PR check (a `workflow_dispatch` run that ci-dispatch.yml started) calls this first:
  one check, no waiting. If a `merge_group` run of `ci.yml` is queued, or has a job queued, it force-cancels its own
  run, which leaves no `ci` check run behind (a plain cancel lets the always() `ci` job run and fail, a red `ci`), and
  ci-dispatch.yml starts the check again once there is room. A self-cancelled run is never a result. An API failure
  counts as no queue job waiting. Needs `GH_TOKEN` with `actions: write`.
  A merge-queue run waits instead, for the groups ahead of it (#2833), only where `queue-wait: "true"` (`changes`): while
  an earlier `merge_group` run of `ci.yml` has a job still queued for a runner, this run's `changes` waits, so the
  front group gets the runners first (2026-11-08 17:48: the front group held 2 running jobs and 18 queued while the
  two groups behind it held 17 runners). Capped at `queue-cap-minutes`; an API failure counts as no wait. Does
  nothing on any other event.

inputs:
  queue-wait:
    description: '"true" (only `changes`): a merge_group run waits for the groups ahead of it'
    default: "false"
  queue-cap-minutes:
    description: The longest a merge-queue run waits for the groups ahead of it, in minutes
    default: "10"

runs:
  using: composite
  steps:
    - name: Give the runner back while a queue job waits
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        repo=$GITHUB_REPOSITORY
        # a merge_group run that is queued, or that has a job queued (a job is listed once the jobs it needs are done,
        # so `queued` means it waits for a runner); a failed call counts as none
        waits() {
          local n run
          n=$(gh api -X GET "repos/$repo/actions/workflows/ci.yml/runs" -f event=merge_group -f status=queued \
            -f per_page=1 --jq .total_count 2>/dev/null) || n=0
          [ "${n:-0}" != 0 ] && return 0
          for run in $(gh api -X GET "repos/$repo/actions/workflows/ci.yml/runs" -f event=merge_group \
              -f status=in_progress -f per_page=50 --jq '.workflow_runs[].id' 2>/dev/null); do
            n=$(gh api -X GET "repos/$repo/actions/runs/$run/jobs" -f filter=latest -f per_page=100 \
              --jq '[.jobs[] | select(.status == "queued")] | length' 2>/dev/null) || n=0
            [ "${n:-0}" != 0 ] && return 0
          done
          return 1
        }
        if ! waits; then
          echo "yield-to-queue: no merge queue job waits" >>"$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "yield-to-queue: a merge queue job waits for a runner: this check gives its runner back, and ci-dispatch starts it again" | tee -a "$GITHUB_STEP_SUMMARY"
        if gh api -X POST "repos/$repo/actions/runs/$GITHUB_RUN_ID/force-cancel" --silent; then
          # the cancel ends this job within seconds; never go on to the heavy steps
          sleep 120
          exit 1
        fi
        # a refused cancel must not fail the check (a red `ci` is a result, and nothing would start it again)
        echo "::warning::yield-to-queue: force-cancel refused; the check goes on"

    - name: Wait while a group ahead still has jobs waiting for runners
      if: github.event_name == 'merge_group' && inputs.queue-wait == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CAP: ${{ inputs.queue-cap-minutes }}
      run: |
        repo=${GH_REPO:-$GITHUB_REPOSITORY}
        mine=$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID" --jq .created_at 2>/dev/null) || mine=
        if [ -z "$mine" ]; then echo "yield-to-queue: own run unknown, no wait" >>"$GITHUB_STEP_SUMMARY"; exit 0; fi
        # jobs of the earlier merge_group runs (created before this one, not finished) that wait for a runner; a job
        # exists in the list only once the jobs it needs are done, so `queued` means it waits for a runner. A failed
        # call counts as 0.
        queued() {
          local n=0 id c status
          for status in queued in_progress; do
            for id in $(gh api -X GET "repos/$repo/actions/workflows/ci.yml/runs" -f event=merge_group -f status="$status" \
              -f per_page=20 --jq ".workflow_runs[]|select(.created_at < \"$mine\")|.id" 2>/dev/null); do
              c=$(gh api -X GET "repos/$repo/actions/runs/$id/jobs" -f per_page=100 \
                --jq '[.jobs[]|select(.status=="queued")]|length' 2>/dev/null) || c=0
              n=$((n + ${c:-0}))
            done
          done
          echo "$n"
        }
        start=$(date +%s)
        n=$(queued)
        while [ "$n" != 0 ]; do
          waited=$(($(date +%s) - start))
          if [ "$waited" -ge $((CAP * 60)) ]; then
            echo "yield-to-queue: $n job(s) of earlier groups still wait after the ${CAP}-minute cap: going ahead (waited ${waited}s)" >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::yield-to-queue: cap of ${CAP} minutes reached with $n job(s) of earlier groups waiting"
            exit 0
          fi
          echo "$n job(s) of earlier groups wait for runners; ${waited}s waited"
          sleep 20
          n=$(queued)
        done
        echo "yield-to-queue: groups ahead had no job waiting for a runner after $(($(date +%s) - start)) s" >>"$GITHUB_STEP_SUMMARY"
