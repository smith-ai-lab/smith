name: pack-smith
description: >
  Hands the build of this job to the jobs after it (#798): every file the build made (git's ignored files: build/,
  .smith/, the generated headers and parser) except the downloaded stage0 release, as one tar saved in the cache
  under a key of this run (restoring a cache took 4 s for 194 MB, downloading an artifact 27 s for 378 MB: the
  cache is the faster way to hand a file to the jobs of a run). The jobs that use it run use-smith.

inputs:
  name:
    description: the build's name in the cache key (the runner's OS name)
    required: true

runs:
  using: composite
  steps:
    - name: Pack the build
      shell: bash
      run: |
        start=$(date +%s)
        git ls-files -z --others --ignored --exclude-standard --directory |
          grep -zv '^[.]smith/stage0/' |
          tar --null -T - -cf "$RUNNER_TEMP/tree.tar"
        echo "pack: $(( $(date +%s) - start )) s, $(du -h "$RUNNER_TEMP/tree.tar" | cut -f1) (the cache compresses it)" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Save the build
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/tree.tar
        key: smith-tree-${{ inputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
