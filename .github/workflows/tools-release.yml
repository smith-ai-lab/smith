# The tools that tests download (the tree-sitter CLI, Neovim) as the assets of a release of this repository (#3161).
# A run of `ci` reaches GitHub only: `smith build nvim` and the tree-sitter fetch read the release `tools-<id>` (the id
# is computed from the pins in build.c, `smith build tools-list` prints it) and fall back to the upstream host, with a
# printed `external:` line, only while that release does not exist. This workflow is the one place that reaches the
# upstream hosts. It runs on main after a merge (a no-op when the release exists) and by hand:
#   gh workflow run tools-release.yml -f ref=<branch>
# reads the pins from that ref, so a pull request that changes a pin gets its release made before it enters the queue.
name: tools-release

on:
  push:
    branches: [main]
    paths: [build.c, .github/workflows/tools-release.yml]
  workflow_dispatch:
    inputs:
      ref:
        description: the branch, tag or commit whose pins in build.c are released
        default: main

permissions:
  contents: write # gh release create

concurrency:
  group: tools-release-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/fetch-smith
      - name: Make the release of the pinned tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          list=$(mktemp)
          smith build tools-list >"$list"
          tag=$(grep -m 1 '^tools-' "$list")
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "tools-release: $tag exists" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          d=$(mktemp -d)
          files=()
          while IFS=$'\t' read -r file url hash; do
            curl -fsSL --retry 5 --retry-all-errors -o "$d/$file" "$url"
            echo "${hash#sha256:}  $d/$file" | sha256sum -c -
            files+=("$d/$file")
          done < <(grep -P '\t' "$list")
          # releases here are immutable: a release takes its assets when it is created
          gh release create "$tag" "${files[@]}" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "$tag" --notes "The tools the tests download, pinned in build.c (#3161)."
          echo "tools-release: made $tag with ${#files[@]} files" | tee -a "$GITHUB_STEP_SUMMARY"
