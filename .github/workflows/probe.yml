name: probe
on:
  push:
    branches: [ci-fast]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          mkdir -p .smith
          cc -std=c23 -x c scripts/stage0.c -o .smith/stage0-tool
          .smith/stage0-tool llvm 2>&1 | tail -1
          start=$(date +%s)
          .smith/stage0-tool 2>&1 | tail -1
          echo "stage0 build: $(( $(date +%s) - start )) s"
          smith=$(ls "$PWD"/build/*/smith | head -n 1)
          for i in 1 2 3; do
            start=$(date +%s)
            "$smith" build 2>&1 | tail -2
            echo "smith build $i: $(( $(date +%s) - start )) s"
          done
          for i in 1 2; do
            start=$(date +%s)
            "$smith" test --list 2>&1 | tail -1
            echo "test --list $i: $(( $(date +%s) - start )) s"
          done
          start=$(date +%s)
          "$smith" test --shard 1/5 --list 2>&1 | tail -1
          echo "shard list: $(( $(date +%s) - start )) s"
          git ls-files -z --others --ignored --exclude-standard --directory | tr '\0' '\n' > "$RUNNER_TEMP/ignored.txt"
          wc -l "$RUNNER_TEMP/ignored.txt"; cat "$RUNNER_TEMP/ignored.txt" | head -20
          echo "${{ github.sha }}" > .smith/built-from
          start=$(date +%s)
          grep -v '^.smith/stage0/' "$RUNNER_TEMP/ignored.txt" | tr '\n' '\0' | tar --null -T - -cf "$RUNNER_TEMP/tree.tar" .smith/built-from
          zstd -q -T0 "$RUNNER_TEMP/tree.tar" -o "$RUNNER_TEMP/tree.tar.zst"
          ls -l "$RUNNER_TEMP"/tree.tar*
          echo "pack: $(( $(date +%s) - start )) s"
          cp -p "$RUNNER_TEMP/tree.tar.zst" /tmp/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: tree
          path: ${{ runner.temp }}/tree.tar.zst
          compression-level: 0
          retention-days: 1
  artifact:
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: tree
          path: ${{ runner.temp }}
      - name: Unpack and try
        run: |
          start=$(date +%s)
          git ls-files -z | xargs -0 touch -t 202001010000
          zstd -dq -T0 "$RUNNER_TEMP/tree.tar.zst" -o "$RUNNER_TEMP/tree.tar"
          tar -xf "$RUNNER_TEMP/tree.tar"
          echo "touch and unpack: $(( $(date +%s) - start )) s"
          smith=$(ls "$PWD"/build/*/smith | head -n 1)
          start=$(date +%s)
          "$smith" build llvm 2>&1 | tail -1
          echo "llvm pack: $(( $(date +%s) - start )) s"
          for i in 1 2; do
            start=$(date +%s)
            "$smith" build 2>&1 | tail -2
            echo "smith build $i: $(( $(date +%s) - start )) s"
          done
          start=$(date +%s)
          "$smith" test --shard 1/5 --list 2>&1 | tail -2
          echo "shard list: $(( $(date +%s) - start )) s"
