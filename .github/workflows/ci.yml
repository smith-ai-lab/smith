name: ci

# The `ci` job is the one check the repository requires. It passes only when
# every other job passed or was skipped on purpose, so adding a job changes no
# rule. The `timings` and `release` workflows are the only ones that run after a
# merge.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

# A newer push to a pull request cancels the run for the older push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the change touches a file the compiler or its tests are built from.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      compiler: ${{ steps.diff.outputs.compiler }}
      install: ${{ steps.diff.outputs.install }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          echo "compiler=$(sh .github/changed.sh "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(install\.sh|\.github/check-install\.sh)$'; then
            echo "install=true" >> "$GITHUB_OUTPUT"
          else
            echo "install=false" >> "$GITHUB_OUTPUT"
          fi

  # Linux on x86-64 builds the compiler once for the tests that run once, the
  # tests that depend on the machine, and the timings.
  linux:
    name: format, lint, test on ubuntu-latest
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bootstrap
    steps:
      - uses: actions/checkout@v6
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked -- --group=once
      - name: Test what depends on the machine
        run: cargo test --locked -- --group=machine
      - name: Timings
        run: target/debug/smith build --timings tests/cases/hello.smith

  # Which kinds of machine need their tests. The tests that depend on the
  # machine run only executables, so a kind of machine has nothing new to find
  # when every executable they would run for its target has the bytes it had
  # on the commit the change is based on, where they passed. This job builds
  # the compiler of that commit and of this one, on a machine that is never
  # scarce, and compares what each would run, as `needs-machines.sh` says.
  decide:
    name: which machines need a test
    needs: changes
    if: needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.decide.outputs.machines }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -eu
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          sh .github/fingerprint.sh "$PWD" > head.fingerprint &
          sh .github/fingerprint.sh "$RUNNER_TEMP/base" > base.fingerprint &
          wait
          echo "== the base"; cat base.fingerprint
          echo "== this change"; cat head.fingerprint
          machines=$(sh .github/needs-machines.sh base.fingerprint head.fingerprint |
            jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "the machines that need a test: $machines"
          echo "machines=$machines" >> "$GITHUB_OUTPUT"

  # The tests whose result depends on the machine, on each other kind of machine
  # a target needs, when `decide` names it. linux_x64 is the job above.
  #
  # GitHub ends a job that waits about fifteen minutes for a machine as
  # `cancelled`, without a step run, and nothing here sets that limit. So a job
  # that never started is started again, twice at most, by `machine2` and
  # `machine3`, before the run counts it as failed. The jobs that follow the
  # first `machine` run only for the kinds whose job never started.
  machine:
    name: test on ${{ matrix.os }}
    needs: [changes, decide]
    if: ${{ needs.decide.result == 'success' && needs.decide.outputs.machines != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.decide.outputs.machines) }}
    uses: ./.github/workflows/machine-test.yml
    with:
      os: ${{ matrix.os }}

  lost1:
    name: which machines were not found
    needs: machine
    if: ${{ !cancelled() && needs.machine.result == 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      os: ${{ steps.lost.outputs.os }}
    steps:
      - uses: actions/checkout@v6
      - id: lost
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh .github/job-states.sh "test on " > states
          lost=$(sh .github/never-started.sh retry < states)
          os=$(echo "$lost" | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "os=$os" >> "$GITHUB_OUTPUT"

  machine2:
    name: test on ${{ matrix.os }}
    needs: lost1
    if: ${{ !cancelled() && needs.lost1.outputs.os != '' && needs.lost1.outputs.os != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.lost1.outputs.os) }}
    uses: ./.github/workflows/machine-test.yml
    with:
      os: ${{ matrix.os }}

  lost2:
    name: which machines were still not found
    needs: machine2
    if: ${{ !cancelled() && needs.machine2.result == 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      os: ${{ steps.lost.outputs.os }}
    steps:
      - uses: actions/checkout@v6
      - id: lost
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh .github/job-states.sh "test on " > states
          lost=$(sh .github/never-started.sh retry < states)
          os=$(echo "$lost" | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "os=$os" >> "$GITHUB_OUTPUT"

  machine3:
    name: test on ${{ matrix.os }}
    needs: lost2
    if: ${{ !cancelled() && needs.lost2.outputs.os != '' && needs.lost2.outputs.os != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.lost2.outputs.os) }}
    uses: ./.github/workflows/machine-test.yml
    with:
      os: ${{ matrix.os }}

  # Installs from the real newest release with the script in this change, on each
  # kind of machine it supports.
  install:
    name: install on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.install == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install the newest release
        run: sh .github/check-install.sh

  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
      - name: Check every commit message
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: sh .github/check-commits.sh "$BASE" "$HEAD"

  # Every page of the language says how much of it is built. It builds nothing,
  # so it runs for every change.
  status:
    name: language status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the status of every language page
        run: sh .github/check-status.sh

  ci:
    name: ci
    needs: [changes, linux, decide, machine, machine2, machine3, install, commits, status]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Show what the decision gives
        run: |
          for result in failure cancelled skipped; do
            echo "== a job that gave $result"
            if sh .github/ci-result.sh "job=$result"; then echo "-> passes"; else echo "-> fails"; fi
          done
      # A machine job that never started and then started again counts by how
      # the newest one ended, not by the first, and every kind of machine that
      # `decide` named must show a newest job that succeeded. A kind it did not
      # name has no job, and counts as skipped on purpose.
      - name: Judge the machine jobs
        id: machine
        if: ${{ needs.decide.result == 'success' && needs.decide.outputs.machines != '[]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MACHINES: ${{ needs.decide.outputs.machines }}
        run: |
          set -eu
          wanted=$(echo "$MACHINES" | jq -r '.[]')
          sh .github/job-states.sh "test on " > states
          result=$(sh .github/never-started.sh result $wanted < states)
          echo "the machine jobs gave $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Decide
        run: >
          sh .github/ci-result.sh
          "changes=${{ needs.changes.result }}"
          "linux=${{ needs.linux.result }}"
          "decide=${{ needs.decide.result }}"
          "machine=${{ steps.machine.outputs.result || needs.machine.result }}"
          "install=${{ needs.install.result }}"
          "commits=${{ needs.commits.result }}"
          "status=${{ needs.status.result }}"
