name: ci

# The full check (#798, knowledge/ci-hosted.md), run by the merge queue only (#3170): Linux carries the tests (8 hosted
# shards that restore the one build `build-linux` made, #1758) and the checks (`check`: fmt, docs, lint, prove; same
# build, beside the shards, #2234); the one job `ci` gathers them, so the ruleset and the merge queue name a single required check. The first job that fails cancels the run. A push to main (a commit the queue
# checked) re-tests nothing (#3172): it builds the macOS release (`release`) and publishes it with the Linux one the queue
# run packed, saves the cache (`warm`), and runs the macOS build, lint and tests (`macos`, `macos-lint`), which gate
# nothing: a failure there is the lead's to file. The front-end count runs in the queue run and refuses a regression (`count-shard`, `count`, #3369).
# A pull request runs nothing here: its check is the one job `ci` of ci-pr.yml, which passes at once so the PR can enter
# the queue. The pre-push hook is the check before the merge, the queue run the test.
on:
  workflow_dispatch:
    inputs:
      mac:
        description: "Only by hand, to test the Mac watchdog (#2835): `mac` runs the macOS job on the owner's Mac, `dead` on a Mac that does not answer (the watchdog must fall back to hosted macos-26); `auto` is the rule of pick-mac"
        type: choice
        options: [auto, mac, dead]
        default: auto
  merge_group:
  push:
    branches: [main]

# The merge queue's runs and main's never cancel each other. A push
# to main has a group of its own per commit: with one group for the branch, GitHub keeps only the newest *pending* run,
# so while the queue landed a PR every ~30 min and a run took longer, each pending run was cancelled by the next push
# with no job started, and `warm` (the step cache) never ran (#2792). The jobs that must run once at a time keep their
# own groups (`release-macos`, `release-linux`).
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  changes:
    # what the change touches decides what runs: a document no build reads runs nothing, the README,
    # knowledge/ and the skills run `smith docs` and their tests, everything else runs the full check
    runs-on: ubuntu-latest
    # 3 minutes of work: a queue run waits for nothing (one queue run at a time, #3131)
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      # whether the macOS build, lint and tests run (#3172): on a push to main that changed more than documents, and in the
      # nightly run; never in a queue run, where the Linux jobs are the test
      mac_run: ${{ steps.scope.outputs.mac_run }}
      # a push to main: the run of the merge queue that tested this very commit, and whether its artifacts hold the
      # Linux release tarball it built (#2832, knowledge/release.md); `publish` publishes that instead of building again
      queue_run: ${{ steps.packed.outputs.run }}
      linux_packed: ${{ steps.packed.outputs.linux }}
      # a queue entry: the PRs its tree holds that main does not
      prs: ${{ steps.prs.outputs.prs }}
      matrix: ${{ steps.linux.outputs.matrix }}
      linux: ${{ steps.linux.outputs.linux }}
      # where the macOS jobs run (knowledge/ci-hosted.md): hosted macos-26, the owner's Mac only as overflow when the
      # hosted pool is saturated; picked per run by the step `Pick the macOS runner`
      pack: ${{ steps.pack.outputs.build }}
      mac: ${{ steps.mac.outputs.mac || steps.mac-queue.outputs.mac }}
      # whether `warm` runs, and on which OSes: a push to main runs it on both
      warm: ${{ steps.scope.outputs.docs_push == 'true' && 'false' || steps.warm.outputs.warm }}
      # a docs-only diff (#3044): what `docs-linux` also runs
      docs_tests: ${{ steps.scope.outputs.docs_tests }}
      warm_os: ${{ steps.warm.outputs.os }}
      # SMITH_CORES of a macOS job: the Mac's 16 cores shared by its 3 runners (overflow only); a hosted runner has 3
      cores: ${{ steps.mac.outputs.cores || steps.mac-queue.outputs.cores }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - name: The macOS runner of a queue run (fixed)
        # a queue run starts no macOS job (`mac_run` is false there), so the 15 s of API calls of `pick-mac` buy nothing (#3277):
        # the outputs take the values pick-mac gives when hosted macOS has room
        id: mac-queue
        if: github.event_name == 'merge_group'
        run: |
          echo 'mac="macos-26"' >>"$GITHUB_OUTPUT"
          echo "cores=3" >>"$GITHUB_OUTPUT"
      - name: Pick the macOS runner
        id: mac
        if: github.event_name != 'merge_group'
        uses: ./.github/actions/pick-mac
        with:
          token: ${{ secrets.RUNNER_STATUS_TOKEN }}
          github-token: ${{ github.token }}
          fork: false
          force: ${{ inputs.mac }}
      - name: Is there a pack for this LLVM configuration
        id: pack
        # a change of patches/ bumps the configuration name, whose pack no release holds yet: the `pack` job builds
        # and publishes it before anything that needs LLVM runs (#1064). Not for a fork, which cannot publish.
        env:
          FORK: false
        run: |
          name=$(sed -n 's/.*"SMITH_LLVM_NAME", "\([^"]*\)".*/\1/p' build.c | head -1)
          build=false
          # A queue run never builds the pack: an LLVM build would hold the one queue run for its whole length (#3170).
          # An asset a pull request needs is made before it enters the queue, by a hand-started run.
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            for tag in "llvm-$name-darwin-arm64" "llvm-$name-linux-x86_64"; do
              gh release view "$tag" >/dev/null 2>&1 || {
                echo "::error::no LLVM pack $tag: start llvm.yml with workflow_dispatch on the pull request's branch, and queue the PR once it is published"
                exit 1
              }
            done
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "LLVM pack $name: built by this run: $build" >>"$GITHUB_STEP_SUMMARY"
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # What runs is one rule, runtime/check_plan.c (#3163), the code `smith check --plan` runs and the pre-push hook
          # shares. scope: none (only documents no build reads), docs (also the documents the docs check and their tests
          # read), full (anything else; a diff that cannot be read), release (a push to main: the queue already checked
          # that commit). This job has no smith yet, so it compiles that file by itself; it prints scope, docs_tests,
          # docs_push, mac_run and the shape of the tests, and the rules per event are there. Other workflows (llvm.yml)
          # change nothing this one runs; ci.yml itself and the actions it uses do. The base: a push, what it replaced;
          # a queue entry is built on main plus the entries ahead of it, and merging it merges them too, so its scope is
          # everything not yet on main (#1539 behind #1541, 2026-11-02: scoped by its own diff, a docs-only entry behind
          # a code change ran no tests and carried the failing code onto main); any other event has no base, so it is full.
          cc -std=gnu2x -O1 -DSMITH_CHECK_PLAN_MAIN runtime/check_plan.c -o "$RUNNER_TEMP/check_plan"
          if [ "$GITHUB_EVENT_NAME" = push ]; then BASE=$BEFORE; fi
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then git fetch -q origin main && BASE=$(git merge-base HEAD origin/main); fi
          "$RUNNER_TEMP/check_plan" --base "$BASE" --event "$GITHUB_EVENT_NAME" >>"$GITHUB_OUTPUT"
          echo "scope: $(sed -n 's/^scope=//p' "$GITHUB_OUTPUT") (macos: $(sed -n 's/^mac_run=//p' "$GITHUB_OUTPUT"))" >>"$GITHUB_STEP_SUMMARY"

      - name: The tarball the queue run of this commit built
        # a push to main is the commit the merge queue tested: its run built the Linux release profile and kept the tarball
        # as an artifact named after the commit (`release-pack-linux`, #2832). It counts only from a merge_group run whose
        # `ci` passed; one missing (a push that did not come through the queue, an expired artifact) is built by
        # `release-linux` as before. The artifact carries the release tool `publish` runs. The macOS tarball is always
        # built by `release` on the push (#3172).
        id: packed
        if: github.event_name == 'push'
        run: |
          run=; linux=false
          ids=$(gh_retry gh api "repos/$GH_REPO/actions/artifacts?name=stage0-$GITHUB_SHA-linux-x86_64" \
            --jq '.artifacts[]|select(.expired|not)|select(.workflow_run.head_sha=="'"$GITHUB_SHA"'")|.workflow_run.id' || true)
          for id in $ids; do
            event=$(gh_retry gh api "repos/$GH_REPO/actions/runs/$id" --jq .event || true)
            ci=$(gh_retry gh api "repos/$GH_REPO/actions/runs/$id/jobs?per_page=100" --jq '.jobs[]|select(.name=="ci")|.conclusion' || true)
            if [ "$event" = merge_group ] && [ "$ci" = success ]; then run=$id; linux=true; break; fi
          done
          echo "run=$run" >>"$GITHUB_OUTPUT"
          echo "linux=$linux" >>"$GITHUB_OUTPUT"
          echo "release: Linux tarball of queue run ${run:-none} (found: $linux); the macOS one is built here" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The pull requests this queue entry tests
        id: prs
        if: github.event_name == 'merge_group'
        # every entry ahead of this one and this one: the squash commits on top of main, each subject ending in (#N)
        run: |
          git fetch -q origin main
          prs=$(git log --format=%s "$(git merge-base HEAD origin/main)..HEAD" | grep -oE '[(]#[0-9]+[)]$' | tr -d '()' | tac | paste -sd ' ' -)
          echo "prs=$prs" >>"$GITHUB_OUTPUT"
          echo "tests: $prs" >>"$GITHUB_STEP_SUMMARY"

      - name: Does this run save the cache
        id: warm
        # `warm` writes (the cache, the release, #2751) and runs only on a push to main (#3170: a pull request runs no
        # dry run of it any more)
        run: |
          warm=false; os='["ubuntu-latest"]'
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            warm=true; os='["macos-26","ubuntu-latest"]'
          fi
          echo "warm=$warm" >>"$GITHUB_OUTPUT"
          echo "os=$os" >>"$GITHUB_OUTPUT"
          echo "warm: $warm ($GITHUB_EVENT_NAME)" >>"$GITHUB_STEP_SUMMARY"

      - name: Does the change undo a commit already on main
        # a stale working tree squashed onto a moved main deletes merged work with every test green (#1455, #1473):
        # scripts/revert_check.c fails a change that removes the lines of a recent commit; `Reverts #N` or
        # `Rewrites #N` in the body (or the queue entry's commit message) says a revert or a rewrite is meant
        if: github.event_name == 'merge_group'
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          cc -std=gnu2x -O1 scripts/revert_check.c -o "$RUNNER_TEMP/revert_check"
          git log -1 --format=%B HEAD >"$RUNNER_TEMP/body"
          "$RUNNER_TEMP/revert_check" "$(git merge-base "$BASE" HEAD)" HEAD "$RUNNER_TEMP/body"

      - name: Test matrix
        id: linux
        # Linux carries the tests: `--skip-macos` in parts, each building smith itself (no artifact egress). The Mac
        # runs the few tests only macOS can run (`--macos-only`, one part). The queue runs everything in 8 parts. A push to main runs no tests (the queue tested that exact commit; #1139): its work is the release and the
        # cache, and the Mac's build and tests (#3172).
        run: |
          flags="${{ steps.scope.outputs.linux_flags }}"
          macflags="${{ steps.scope.outputs.mac_flags }}"
          count=${{ steps.scope.outputs.test_parts }}
          linux=
          for i in $(seq 1 "$count"); do
            linux="$linux"${linux:+,}'{"shard":'$i',"count":'$count',"flags":"'"$flags"'"}'
          done
          echo "linux={\"include\":[$linux]}" >>"$GITHUB_OUTPUT"
          echo "matrix={\"include\":[{\"os\":\"macos-26\",\"shard\":1,\"count\":1,\"flags\":\"$macflags\"}]}" >>"$GITHUB_OUTPUT"
          echo "tests: $count Linux parts ($flags), one macOS part ($macflags)" >>"$GITHUB_STEP_SUMMARY"
      - name: The queue's last 24 hours
        # the standing number of #3051 and #3057 (owner, 2026-11-11: "if the PR queue is growing over time, that's bad"):
        # the nightly run prints entries against merges and pull requests per passing queue run. The queue holds its
        # load when merged is at least entered and the depth does not grow over three days. Entered counts every
        # `added_to_merge_queue` event of the pull requests updated in the window (a re-queue counts again); About 100 reads, with
        # the reader's token; a failed read prints `unreadable` and fails nothing.
        if: github.event_name == 'schedule'
        run: |
          r="repos/$GITHUB_REPOSITORY"
          cutoff=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)
          api() { GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api -X GET "$@"; }
          line() {
            local runs= prs= page p pr n entered=0 merged ok failed total depth per
            for p in 1 2 3 4 5; do
              page=$(api "$r/actions/workflows/ci.yml/runs" -f event=merge_group -f per_page=100 -f page="$p" -f created=">=$cutoff" \
                --jq '.workflow_runs[] | "\(.head_branch | capture("/pr-(?<n>[0-9]+)-").n) \(.conclusion // .status)"') || return 1
              [ -n "$page" ] || break
              runs="$runs$page"$'\n'
            done
            for p in 1 2 3 4 5; do
              page=$(api "$r/pulls" -f state=all -f base=main -f sort=updated -f direction=desc -f per_page=100 -f page="$p" \
                --jq ".[] | select(.updated_at >= \"$cutoff\") | \"\(.number) \(.merged_at // \"-\")\"") || return 1
              [ -n "$page" ] || break
              prs="$prs$page"$'\n'
            done
            for pr in $(echo "$prs" | cut -d' ' -f1); do
              for p in 1 2 3; do
                page=$(api "$r/issues/$pr/timeline" -f per_page=100 -f page="$p" \
                  --jq ".[] | if .event == \"added_to_merge_queue\" and .created_at >= \"$cutoff\" then \"entered\" else \"other\" end") || return 1
                n=$(echo "$page" | grep -c entered || true)
                entered=$((entered + n))
                [ "$(echo "$page" | grep -c .)" = 100 ] || break
              done
            done
            merged=$(echo "$prs" | awk -v c="$cutoff" '$2 != "-" && $2 >= c' | grep -c . || true)
            total=$(echo "$runs" | grep -c . || true)
            ok=$(echo "$runs" | grep -c ' success$' || true)
            failed=$(echo "$runs" | grep -c ' failure$' || true)
            depth=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f query='
              query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) {
                mergeQueue(branch: "main") { entries { totalCount } } } }' \
              --jq '.data.repository.mergeQueue.entries.totalCount' 2>/dev/null) || depth=unknown
            per=$(awk -v m="$merged" -v s="$ok" 'BEGIN { if (s > 0) printf "%.1f", m / s; else printf "none" }')
            echo "queue: last 24 h entered $entered, merged $merged, depth now $depth, runs $total ($ok ok, $failed failed), PRs per ok run $per"
          }
          { line || echo "queue: last 24 h unreadable"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  pack:
    # the LLVM pack of a configuration no release holds yet, built and published by llvm.yml (#1064) before the jobs
    # that need it start; it runs on the Mac only as overflow (hosted pool saturated), else on hosted runners
    needs: changes
    if: needs.changes.outputs.pack == 'true'
    uses: ./.github/workflows/llvm.yml
    permissions:
      contents: write # gh release create
      actions: write # llvm.yml's pick-mac lists the queued and running jobs
    secrets: inherit

  mac-probe:
    # The Mac watchdog (#2835), part 1. A job sent to the owner's Mac waits for a runner that never comes when the Mac is
    # off, asleep or hung, though the runners call says it is online; `ci` would wait with it. So the real `macos` job
    # is not queued on the Mac blind: this probe is, with nothing to do, and `watch` decides from whether it starts.
    # Nothing needs this job, so a probe that never starts holds nobody; `mac-probe-end` cancels it.
    needs: [changes, pack]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.changes.outputs.mac_run == 'true' && needs.changes.outputs.mac != '"macos-26"' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.mac) }}
    timeout-minutes: 5
    concurrency:
      group: mac-probe-${{ github.run_id }}
      cancel-in-progress: true
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: echo "the Mac started the probe"
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"

  watch:
    # The Mac watchdog, part 2: the one that decides where `macos` runs. Hosted was picked: hosted. The Mac was picked:
    # the Mac if it started the probe within 3 minutes, else hosted macos-26 with nobody's hand (a failed call is
    # hosted too). One small hosted Linux job for at most 3 minutes, started with the probe.
    needs: [changes, pack]
    if: ${{  !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.changes.outputs.mac_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.watch.outputs.runner }}
      cores: ${{ steps.watch.outputs.cores }}
      dead: ${{ steps.watch.outputs.dead }}
    env:
      GH_TOKEN: ${{ github.token }}
      MAC: ${{ needs.changes.outputs.mac }}
      MAC_CORES: ${{ needs.changes.outputs.cores }}
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Did the Mac start the probe
        id: watch
        run: |
          hosted='"macos-26"'
          runner=$hosted; cores=3; dead=false; why="hosted was picked"
          if [ "$MAC" != "$hosted" ]; then
            dead=true; why="the Mac did not start the probe within 180 s: macOS runs on hosted macos-26"
            end=$((SECONDS + 180))
            while [ "$SECONDS" -lt "$end" ]; do
              status=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq \
                '[.jobs[] | select(.name == "mac-probe")][0].status // "none"' 2>/dev/null) || status=none
              if [ "$status" = in_progress ] || [ "$status" = completed ]; then
                runner=$MAC; cores=$MAC_CORES; dead=false; why="the Mac started the probe after $SECONDS s"
                break
              fi
              sleep 10
            done
          fi
          echo "runner=$runner" >>"$GITHUB_OUTPUT"
          echo "cores=$cores" >>"$GITHUB_OUTPUT"
          echo "dead=$dead" >>"$GITHUB_OUTPUT"
          echo "macOS job runs on $runner ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"

  mac-probe-end:
    # The Mac watchdog, part 3: the probe of a Mac that did not answer is still queued; a job of its concurrency group
    # that starts replaces it (cancel-in-progress cancels a pending job too), so the run does not sit "in progress"
    # until GitHub drops the job a day later. That run ends `cancelled` though every job it owed passed.
    needs: [watch]
    if: ${{ always() && needs.watch.outputs.dead == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: mac-probe-${{ github.run_id }}
      cancel-in-progress: true
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: echo "the Mac did not answer; its probe is cancelled"
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"

  macos:
    # everything macOS tests in a run, in one job (#1709): build smith and the tests, then the macOS-only tests. It runs
    # after the merge, on the push to main, and gates nothing (#3172): a failure is the lead's to file. fmt, docs and prove run on Linux beside the test
    # parts (`check`, #2234), and lint on both: each platform lints code the other can't see.
    # It was five jobs
    # (build, mechanical, prove, test, docs) handing the build over as an artifact; four of them filled four of the five
    # hosted macOS slots the free plan allows, so a second run's jobs queued behind the first, and a job that waited
    # past its time limit was cancelled with no test failing (#1691: docs, #1648: prove). One job takes one slot, so
    # five runs proceed at once, and nothing is packed or downloaded. The stages run one after another: two verbs
    # cannot share one tree (they collide on .smith/build.ninja), and every stage runs even when an earlier one failed,
    # so one run names all failures.
    needs: [changes, pack, watch]
    # When the hosted macOS slots are full, `pick-mac` sends the job to the owner's Mac, if the Mac starts the probe job
    # within 3 minutes (`watch`, #2835).
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.watch.result == 'success' && needs.changes.outputs.mac_run == 'true' }}
    runs-on: ${{ fromJSON(needs.watch.outputs.runner) }}
    # hosted: build about 3.5 min, fmt/docs/lint 3 to 5, the proofs and the macOS tests a few more; the owner's Mac
    # does all of it in about 4 (#1709). The job's limit counts time spent queued for a slot: at 30 minutes, jobs waiting
    # for a full hosted pool were cancelled before their first step (2026-11-03). So the job allows 90, and each step has
    # its own limit to catch a hang.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: ${{ needs.watch.outputs.cores }}
      SMITH_OUTPUT: full
      SMITH_TEST_STATS: "1"
      MACFLAGS: ${{ fromJSON(needs.changes.outputs.matrix).include[0].flags }}
    permissions:
      contents: write # test-cache/save: `gh release create` of this job's test store (#2870)
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/setup-smith
        timeout-minutes: 20
        with:
          tests: "true"
          # builds only the `--macos-only` tests the job runs (`--shard 1/1` makes the scan list one part), not all of
          # them (#2242)
          test-flags: ${{ format('{0} --shard 1/1 --weigh {1}/weights.tsv', env.MACFLAGS, runner.temp) }}
      - name: API budget (before test-cache)
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} before test-cache
      - uses: ./.github/actions/test-cache
        # the macOS tests the store holds as passed are left out too (#2833): the `--macos-only` tests whose inputs did
        # not change do not run; the nightly restores nothing
        with:
          os: macos
          fresh: ${{ github.event_name == 'schedule' }}
      - name: API budget (after test-cache)
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} after test-cache
      - name: Checks
        timeout-minutes: 30
        shell: bash
        run: |
          # each stage's output goes to its own log; each prints `took <stage> <n>s (exit <code>)` in the job summary,
          # and a failed one prints its last 60 lines and `FAIL <stage>` (#1139)
          stage() { # name, then the command
            local name=$1 start=$SECONDS code=0
            shift
            "$@" >"$RUNNER_TEMP/$name.log" 2>&1 || code=$?
            echo "$code $((SECONDS - start))" >"$RUNNER_TEMP/$name.status"
            echo "took $name $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          macos_tests() {
            # shellcheck disable=SC2086
            "$SMITH" test $MACFLAGS --weigh "$RUNNER_TEMP/weights.tsv"
          }
          # fmt, docs, lint and prove run on Linux (`check`, #2234); lint runs on the Mac too, since each sees
          # code the other can't (`@when(target.os == .macos)`, Objective-C and Metal here; glibc's macros there):
          # on the Mac it is the job `macos-lint`, beside this one (#3045), so the two take their minutes together
          names="test"
          stage test macos_tests
          # the test stage's output, with the SMITH_TEST_STATS lines, is the log `smith build ci-times` reads (#1139)
          mkdir -p .smith/log
          [ -f "$RUNNER_TEMP/test.log" ] && cp "$RUNNER_TEMP/test.log" .smith/log/test.log
          failed=0
          for name in $names; do
            read -r code took <"$RUNNER_TEMP/$name.status"
            if [ "$code" != 0 ]; then
              tail -n 60 "$RUNNER_TEMP/$name.log"
              echo "FAIL $name"
              echo "::error::smith $name failed"
              # a failed test is named as an annotation, as on Linux
              grep -hE '^FAIL |^FAILED:' "$RUNNER_TEMP/$name.log" 2>/dev/null | sort -u | head -n 20 |
                while IFS= read -r line; do echo "::error::$line"; done
              failed=1
            else
              echo "ok $name"
            fi
          done
          exit $failed
      - name: Publish the test store
        # this job's store as its own release, `test-cache-<sha7>-macos` (#2870); queue and nightly runs only
        if: always()
        uses: ./.github/actions/test-cache/save
        with:
          os: macos
          name: macos
      - name: Upload the logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-log-macos-26-1-of-1
          path: .smith/log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"

  macos-lint:
    # `smith lint` of the code only the Mac sees, beside `macos` and not after it (#3045): the two stages cannot share one
    # tree (they collide on .smith/build.ninja), so each gets its own job and its own copy, and the job takes the longer
    # of the two, not their sum (lint 102 to 151 s, the macOS tests 116 to 173 s, on 2026-11-10). It builds smith only,
    # not the tests (`tests: false`: 109 to 156 s of `macos` that lint does not need). It runs where `macos` runs its
    # tests, on the push to main (#3172). It takes one more hosted macOS slot of the
    # five, so a second run's jobs may queue behind the first (knowledge/ci/caches.md).
    needs: [changes, pack, watch]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.watch.result == 'success' && needs.changes.outputs.mac_run == 'true' }}
    runs-on: ${{ fromJSON(needs.watch.outputs.runner) }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: ${{ needs.watch.outputs.cores }}
      SMITH_OUTPUT: full
    permissions:
      contents: read
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/setup-smith
        timeout-minutes: 20
        with:
          tests: "false"
      - name: Lint
        timeout-minutes: 30
        shell: bash
        run: |
          start=$SECONDS
          code=0
          "$SMITH" lint >"$RUNNER_TEMP/lint.log" 2>&1 || code=$?
          echo "took lint $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            tail -n 60 "$RUNNER_TEMP/lint.log"
            echo "FAIL lint"
            echo "::error::smith lint failed"
            exit 1
          fi
          echo "ok lint"

  build-linux:
    # builds smith and the tests once for the Linux shards (#1758): a hosted runner minute is the scarce thing (the free
    # plan's 20 slots were full most hours on 2026-11-02), so one job builds, and each shard restores it as an artifact
    # instead of spending about 2.5 min of its own on it (knowledge/ci.md)
    #
    # It waits for nothing (#3277): `changes` takes 13 s or more, and a queue run always builds. A push to main builds nothing
    # here (its scope is `release` or `none`); a run by hand has the scope `full`; a queue run builds whatever its scope, the
    # jobs that read the scope below still skip the tests of a documents-only entry. The 8 parts and their flags are constants
    # (they were the output `linux` of `changes`, a loop over the same numbers), and the LLVM pack is never built by a run
    # of this workflow (`changes` gives `pack` false), so `pack` is not waited for either.
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # where the 10 Linux jobs that start next run, chosen by the last step: hosted ubuntu-latest, the Mac's Linux runners
      # (#1140) for the ones that would not fit in the hosted slots (#2259)
      matrix: ${{ steps.runners.outputs.matrix }}
      runner-check: ${{ steps.runners.outputs.check }}
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
    permissions:
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/setup-smith
        with:
          tests: "true"
      - name: Pack the build
        shell: bash
        run: |
          start=$(date +%s)
          tar -c --zstd -f "$RUNNER_TEMP/build.tar.zst" build .smith
          ls -l "$RUNNER_TEMP/build.tar.zst"
          echo "pack: $(( $(date +%s) - start )) s ($(du -h "$RUNNER_TEMP/build.tar.zst" | cut -f1))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the build for the shards
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: ${{ runner.temp }}/build.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Pick the Mac's Linux runners
        # the choice is made here, when the 9 jobs that need this build (8 test parts, check) are
        # about to ask for slots, not once at the start of the run (#2259: `changes` saw the pool free and every job
        # ran hosted while parts waited 5 minutes for a slot). In this job, so no job and no slot is added.
        id: pick
        continue-on-error: true
        uses: ./.github/actions/pick-mac
        with:
          token: ${{ secrets.RUNNER_STATUS_TOKEN }}
          github-token: ${{ github.token }}
          fork: false
          linux-jobs: "9"
      - name: Give each job its runner
        id: runners
        if: ${{ always() }}
        shell: bash
        env:
          MAC: ${{ steps.pick.outputs.linux-mac }}
        run: |
          # the 8 fixed parts of the run (#3279)
          MATRIX='{"include":[{"shard":1,"count":8,"flags":"--skip-macos"},{"shard":2,"count":8,"flags":"--skip-macos"},{"shard":3,"count":8,"flags":"--skip-macos"},{"shard":4,"count":8,"flags":"--skip-macos"},{"shard":5,"count":8,"flags":"--skip-macos"},{"shard":6,"count":8,"flags":"--skip-macos"},{"shard":7,"count":8,"flags":"--skip-macos"},{"shard":8,"count":8,"flags":"--skip-macos"}]}'
          COUNT=8
          # hosted first; the Mac takes the last jobs in this order: parts 8, 7, ..., then check. An empty
          # or failed pick is 0: everything hosted.
          hosted='"ubuntu-latest"'; mac='["self-hosted","Linux","X64"]'
          n=${MAC:-0}; case "$n" in *[!0-9]*) n=0 ;; esac
          [ "$n" -gt 9 ] && n=9
          parts=$(( n > COUNT ? COUNT : n )); rest=$(( n - parts ))
          check=$hosted
          [ "$rest" -ge 1 ] && check=$mac
          matrix=$(printf '%s' "$MATRIX" | jq -c --argjson parts "$parts" --argjson hosted "$hosted" --argjson mac "$mac" \
            '.include |= map(. + {runner: (if .shard > (.count - $parts) then ($mac | tojson) else ($hosted | tojson) end)})') \
            || matrix=$(printf '%s' "$MATRIX" | jq -c --argjson hosted "$hosted" '.include |= map(. + {runner: ($hosted | tojson)})')
          { echo "matrix=$matrix"; echo "check=$check"; } >>"$GITHUB_OUTPUT"
          echo "Linux jobs on the Mac: $n (parts $parts, check $([ "$check" = "$mac" ] && echo yes || echo no))" >>"$GITHUB_STEP_SUMMARY"

      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  test-linux:
    # Linux carries the tests (required): hosted shards of `--skip-macos`, each restoring the build of `build-linux` (#1758)
    needs: [changes, pack, build-linux]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.build-linux.result == 'success' && needs.changes.outputs.scope == 'full' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-linux.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
      SMITH_OUTPUT: full
      SMITH_TEST_STATS: "1"
    permissions:
      contents: write # test-cache/save: `gh release create` of this part's test store (#2870)
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/setup-smith
        with:
          artifact: build-linux
      - uses: ./.github/actions/test-part
        with:
          part: ${{ matrix.shard }}
          count: ${{ matrix.count }}
          flags: ${{ matrix.flags }}
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget
  check:
    # fmt, docs, lint and the proofs on Linux (#2234), beside the test parts: `smith check --part fmt,docs,prove,lint`
    # (#3163), the command the pre-push hook runs, on the build of `build-linux` restored like a shard. Parts run one
    # after another (two verbs cannot share one tree) and each runs even when an earlier one failed. It was two jobs
    # (`check-fmt-prove` 135 s and `check-lint` 114 s, run 43214535651) so neither would be longer than a test part;
    # one job takes one restore of the build (22 to 31 s each) and one runner, and stays under the slowest part (284 s).
    # The Mac lints too, since each platform sees code the other can't.
    needs: [changes, pack, build-linux]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.build-linux.result == 'success' && needs.changes.outputs.scope == 'full' }}
    runs-on: ${{ fromJSON(needs.build-linux.outputs.runner-check) }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
      SMITH_OUTPUT: full
    permissions:
      contents: read
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/setup-smith
        with:
          artifact: build-linux
      - name: Restore the lint and proof caches
        # main's `warm` saves ONE cache holding both folders (#2237). `actions/cache` puts the path list in the cache
        # version, so a restore naming one folder never finds it ("Cache not found" even for the prefix, #2954): every
        # restore of `smith-lintprove-` names the same two paths, in the same order, as `warm`'s save.
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/smith/steps/a
          key: smith-lintprove-${{ runner.os }}-${{ github.sha }}
          restore-keys: smith-lintprove-${{ runner.os }}-
      - name: Checks
        shell: bash
        env:
          # lint says why each file ran, counted below
          SMITH_LINT_CACHE: why
        run: |
          start=$SECONDS
          code=0
          "$SMITH" check --part fmt,docs,prove,lint >"$RUNNER_TEMP/check.log" 2>&1 || code=$?
          echo "took check $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
          # each part's line, with its wall and CPU seconds
          grep -E '^smith check: (fmt|docs|lint|prove|[0-9]+ ok)' "$RUNNER_TEMP/check.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          # where the time went (#2985): lint's own line (files run and cached, run and setup seconds) and why each file
          # ran, and prove's (build and proof seconds, groups) with the sum of its groups' `N proved, M failed, K cached`
          grep 'smith lint: linted [0-9]* files' "$RUNNER_TEMP/check.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          grep -o 'runs: .*' "$RUNNER_TEMP/check.log" | sort | uniq -c | tee -a "$GITHUB_STEP_SUMMARY" || true
          grep 'smith prove: [0-9]* groups' "$RUNNER_TEMP/check.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          awk '/^[0-9]+ proved, [0-9]+ failed/ { p += $1; f += $3; for (i = 1; i <= NF; i++) if ($i == "cached") c += $(i - 1) }
               END { printf "prove: %d functions proved (%d reused from the cache, %d failed)\n", p, c, f }' \
            "$RUNNER_TEMP/check.log" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            tail -n 80 "$RUNNER_TEMP/check.log"
            grep -E '^smith check: .* FAILED' "$RUNNER_TEMP/check.log" | sed 's/^smith check: \([a-z-]*\) FAILED.*/FAIL \1/' || true
            echo "::error::smith check failed"
          fi
          exit $code
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  docs-linux:
    # A documentation-only diff (#3044): `smith docs` (0.02 s) with the published release, never a build, and, when the diff
    # touches README.md or the skills, `readme_test` and `skills_test` (about 2 minutes cold: the test runner is built).
    # One small Linux job, in a PR check and in a queue run; no macOS, no step cache, no LLVM pack.
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.scope == 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_OUTPUT: full
      DOCS_TESTS: ${{ needs.changes.outputs.docs_tests }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fetch-smith
      - name: Documentation checks
        run: |
          smith docs
          if [ "$DOCS_TESTS" = true ]; then smith test --test readme_test,skills_test; fi

  count-shard:
    # one eighth of the front-end count (#2697, #3369): `smith build frontend-coverage -Dshard=<k>/8` fixes the files whose
    # path hashes to k - 1 modulo 8 and the modules they import, and compiles them, with the release smith
    # `release-pack-linux` built for this very commit, so each file's row is the row of the whole count. `count` joins
    # the eight tables and refuses a regression. In a queue run only (the count gates what lands, #3369).
    needs: [changes, release-pack-linux]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.changes.result == 'success' && needs.release-pack-linux.result == 'success' && needs.changes.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: write # test-cache/save: `gh release create` of the import cache this shard made (#2891)
      actions: write # fail-fast: `gh run cancel` (#3051)
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/setup-smith
        with:
          artifact: build-linux-release
      - name: API budget (before test-cache)
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} before test-cache
      - uses: ./.github/actions/test-cache
        # restores no store (#3347); it sets SMITH_IMPORT_CACHE_LOG, from which the save below prints the hits
        with:
          tests: "false"
          fresh: "true"
      - name: API budget (after test-cache)
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} after test-cache
      - name: Count the shard
        # the shard fails when its count ends with a status other than 0, so it is seen; the merge job still reads the
        # status file it saves (the steps after this one run always)
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/coverage"
          # a shard takes 2 minutes (1.7 to 2.4); one that hung sat the whole 30 minutes of the job, failed the entry
          # and every group queued on it (#3051: runs 42924697431 and 42930758168, 45 minutes each). A hang that comes
          # from the diff is deterministic, so there is no retry: the command is bounded to 10 minutes and fails the entry.
          timeout -k 10 420 "$SMITH" build frontend-coverage -Dshard=${{ matrix.shard }}/8 -Dsmith="$SMITH" >"$RUNNER_TEMP/coverage/output.txt" 2>&1
          status=$?
          [ "$status" != 124 ] || echo "shard ${{ matrix.shard }} hung for 10 minutes: the entry fails" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "status: $status" >>"$RUNNER_TEMP/coverage/output.txt"
          cp .smith/frontend-coverage/results.tsv "$RUNNER_TEMP/coverage/results.tsv" 2>/dev/null
          # the lines that say where the time went, in the job log too (the output file is an artifact nobody can download)
          grep -E 'frontend_coverage: (fix phase|fixer cache|rows to measure|row cache|compile phase)' "$RUNNER_TEMP/coverage/output.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Save the shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-shard-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Report the import-cache hits
        # the shard's hits (the save publishes no store for tests: false, #3347)
        if: always()
        uses: ./.github/actions/test-cache/save
        with:
          name: count-${{ matrix.shard }}
          tests: "false"
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast

  count:
    # the join and the gate of the front-end count (#2697, #3369): the tables of the eight `count-shard` jobs are joined in the
    # order of the files (a file in no part, or in two, is an error; a part that failed or did not finish leaves the
    # count unmeasured and fails the run), and the run is REFUSED when a file that passed on the base no longer passes.
    # The base is the table of the newest commit among this one's first parents that a queue run measured and published
    # (the release `test-cache-<sha7>-count-table`, asset `frontend-coverage-table.tsv`, made below once the gate
    # passed); none found: unknown, a warning, and the table is published for the next run. A file gone from the tree is
    # not a regression. The line `frontend-coverage: <sha> <passed> <total>` and the `frontend-errors`, `frontend-fail`
    # and `frontend-cause` lines are in this job's log, so a worker measures its prediction from the queue run of its
    # merge and the run before it. knowledge/ci/count.md.
    needs: [changes, count-shard]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.changes.result == 'success' && needs.count-shard.result == 'success' && needs.changes.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release holding this commit's table
      actions: write # fail-fast: `gh run cancel` (#3051)
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - uses: ./.github/actions/setup-smith
        with:
          artifact: build-linux-release
      - name: Fetch the shards
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-coverage-shard-${{ github.sha }}-*
          path: ${{ runner.temp }}/shards
      - name: Join the shards
        id: join
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/coverage"
          out="$RUNNER_TEMP/coverage/output.txt"
          tables=
          parts=8
          for k in $(seq 1 "$parts"); do
            d="$RUNNER_TEMP/shards/frontend-coverage-shard-$GITHUB_SHA-$k"
            if [ -f "$d/results.tsv" ] && grep -qx 'status: 0' "$d/output.txt" 2>/dev/null; then
              tables="${tables:+$tables,}$d/results.tsv"
            else
              echo "frontend-coverage: shard $k of $parts did not finish, so the count is not measured" >>"$out"
              tail -n 20 "$d/output.txt" 2>/dev/null >>"$out"
            fi
          done
          if [ -n "$tables" ] && [ "$(printf %s "$tables" | tr ',' '\n' | wc -l)" = $((parts - 1)) ]; then
            "$SMITH" build frontend-coverage -Dmerge="$tables" -Dsmith="$SMITH" >>"$out" 2>&1
            echo "status: $?" >>"$out"
            cp .smith/frontend-coverage/results.tsv "$RUNNER_TEMP/coverage/results.tsv" 2>/dev/null
          fi
          exit 0
      - name: Publish the number
        shell: bash
        run: |
          out="$RUNNER_TEMP/coverage/output.txt"
          line=$(sed -n 's/^frontend-coverage: \([0-9][0-9]*\) of \([0-9][0-9]*\) files pass$/\1 \2/p' "$out" 2>/dev/null | tail -n 1)
          {
            if [ -n "$line" ]; then
              echo "### Front-end coverage: ${line% *} of ${line#* } files pass"
              echo
              echo '```'
              grep -E '^  failed at ' "$out"
              echo '```'
              echo
              echo "Total errors and files failing: $(grep '^frontend-errors: ' "$out" | tail -n 1 | sed 's/^frontend-errors: //' || true)"
              echo
              echo 'Top 20 causes, by the files each alone blocks, then the files each stops first (count, first, files, cause):'
              echo '```'
              awk '/^failures by cause/ {on=1; next} on && /^ *[0-9]+ +[0-9]+ +[0-9]+  / {print; n++} n==20 {exit}' "$out"
              echo '```'
            else
              echo "### Front-end coverage: not measured"
              echo '```'
              tail -n 40 "$out" 2>/dev/null
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          [ -n "$line" ] || tail -n 40 "$out" 2>/dev/null
          # one fixed line for the workers (the log of this job): <sha> <passed> <total>
          if [ -n "$line" ]; then echo "frontend-coverage: $GITHUB_SHA $line"
          else echo "frontend-coverage: $GITHUB_SHA unmeasured"; fi
          # what the count says about its own list (#3037): the file and what to do, as the job's error or warning line
          grep -E '^frontend_coverage: (error|warning): ' "$out" 2>/dev/null |
            sed -e 's/^frontend_coverage: error: /::error::/' -e 's/^frontend_coverage: warning: /::warning::/' || true
          # the total errors (#2731): frontend-errors: <sha> <errors> <files failing>
          errs=$(grep '^frontend-errors: ' "$out" 2>/dev/null | tail -n 1 || true)
          if [ -n "$errs" ]; then echo "frontend-errors: $GITHUB_SHA ${errs#frontend-errors: }"; fi
          # the files the count leaves out of its total (#3037): frontend-excluded: <sha> <n>
          left=$(grep '^frontend-excluded: ' "$out" 2>/dev/null | tail -n 1 || true)
          if [ -n "$left" ]; then echo "frontend-excluded: $GITHUB_SHA ${left#frontend-excluded: }"; fi
          # the error fixtures that compile (#3207): each is counted as failing and named, the count is still measured
          grep '^frontend-excluded-compiles: ' "$out" 2>/dev/null || true
          # the top 20 causes, one fixed line each (#2247, #2731): frontend-cause: <alone> <first> <files> <count> <cause>
          grep '^frontend-cause: ' "$out" 2>/dev/null || true
          # one line per failing file with every distinct cause of it (#3271): frontend-fail: <path> <stage> <n> <cause> [; <cause> ...]
          grep '^frontend-fail: ' "$out" 2>/dev/null || true
          # the top 10 pairs of causes that are a file's only two (#2731): frontend-pair: <files> <cause a> | <cause b>
          grep '^frontend-pair: ' "$out" 2>/dev/null || true
          # the top 15 names behind `unknown name` and `unknown type` (#2413): frontend-name: <first> <files> <count> <kind> <name>
          grep '^frontend-name: ' "$out" 2>/dev/null || true
          [ -n "$line" ]
      - name: The gate, files that passed on the base and fail now
        # REFUSES the run (#3369). The base: the newest commit among the first 20 first parents with a published table.
        shell: bash
        run: |
          set +e
          dir="$RUNNER_TEMP/coverage"
          now="$dir/results.tsv"
          prev=unknown
          base=
          mkdir -p "$RUNNER_TEMP/previous"
          for sha in $(git rev-list --first-parent -n 20 "$GITHUB_SHA" | tail -n +2); do
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/test-cache-${sha:0:7}-count-table/frontend-coverage-table.tsv"
            if curl -fsSL --retry 3 "$url" >"$RUNNER_TEMP/previous/results.tsv" 2>/dev/null && [ -s "$RUNNER_TEMP/previous/results.tsv" ]; then
              prev="$RUNNER_TEMP/previous/results.tsv"; base=${sha:0:7}; break
            fi
          done
          if [ "$prev" = unknown ]; then
            echo "frontend-regressed-count: unknown"
            echo "::warning::no published table of the count among the 20 first parents: nothing to compare with, this table is the base for the next run"
            exit 0
          fi
          echo "frontend-base: $base"
          # a file passed there and has a row here with another stage; a file gone from the tree or listed in excluded.txt
          # has no row here (`regressed` of the count's tool, with its test)
          # (the tool alone in a folder, as its tests run it; the excluded list is the change's own)
          gate="$RUNNER_TEMP/gate"; mkdir -p "$gate"; cp scripts/frontend_coverage/main.smith "$gate/"
          (cd "$gate" && SMITH_COVERAGE_EXCLUDED="$GITHUB_WORKSPACE/scripts/frontend_coverage/excluded.txt" \
            "$SMITH" run -- regressed "$prev" "$now") | awk -F'\t' 'NF >= 3' >"$RUNNER_TEMP/regressed.txt"
          # (`smith run` prints its build lines first; the rows of the tool are the lines with three fields)
          n=$(wc -l <"$RUNNER_TEMP/regressed.txt" | tr -d ' ')
          while IFS=$'\t' read -r f stage cause; do
            echo "frontend-regressed: $f ($stage: $cause)"
            echo "::error file=$f::passed on $base and fails now at $stage: $cause"
          done <"$RUNNER_TEMP/regressed.txt"
          echo "frontend-regressed-count: $n"
          # the rule (owner, 2026-11-12, #3369): any file that passed on the base and fails now refuses the change,
          # whatever the total does (fixing three files and breaking three is refused); two ways out
          if [ "$n" != 0 ]; then
            echo "::error::$n files passed on $base and fail now (frontend-regressed lines). Fix them, or, for a file that should no longer be measured, list it in scripts/frontend_coverage/excluded.txt with a reason (knowledge/front-end/driver.md, The count's excluded files); a total that goes up does not excuse a file that fails."
          fi
          {
            echo "### Front-end regression"
            echo
            echo "$n files passed on $base and fail now; the run is refused, whatever the total does. Two ways out: fix them, or list a file that should no longer be measured in \`scripts/frontend_coverage/excluded.txt\` with a reason."
            echo '```'
            cat "$RUNNER_TEMP/regressed.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          [ "$n" = 0 ]
      - name: Publish the table (the base of the next runs)
        shell: bash
        run: |
          set -eu
          tag="test-cache-${GITHUB_SHA:0:7}-count-table"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            cp "$RUNNER_TEMP/coverage/results.tsv" "$RUNNER_TEMP/frontend-coverage-table.tsv"
            gh release create "$tag" "$RUNNER_TEMP/frontend-coverage-table.tsv" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "count table $tag" \
              --notes "The front-end count's table (#3369) of the queue run at $GITHUB_SHA: the base the next queue runs compare with. Not a release of smith."
          fi
      - name: Save the table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  ci:
    # the one required check: green when every job that had to run is green; skipped jobs (a change of documents only)
    # do not count against it. It runs when a job failed too, after every job has ended (no job cancels the run).
    # The front-end count is here (#3369): `count-shard` and `count` are owed by a full queue run, and `count` refuses a regression.
    needs: [changes, pack, macos, macos-lint, docs-linux, build-linux, test-linux, check, release-pack-linux, count-shard, count]
    # not on a push to main (#3172): no required check reads that run, whose own jobs fail it when they fail
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write # a failed queue run deletes the release tarballs it kept (#2832)
    steps:
      - uses: actions/checkout@v4 # only the shared shell function and the budget action (git, not REST)
        with:
          sparse-checkout: .github/actions
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Verdict
        id: verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGES: ${{ needs.changes.result }}
          EVENT: ${{ github.event_name }}
          MACOS: ${{ needs.macos.result }}
          DOCS_LINUX: ${{ needs.docs-linux.result }}
          MACOS_LINT: ${{ needs.macos-lint.result }}
          MAC_RUN: ${{ needs.changes.outputs.mac_run }}
          # the one part a queue run's `build-linux` ran itself, else the parts of `test-linux` (#2870)
          TEST_LINUX: ${{ needs.test-linux.result }}
          CHECK: ${{ needs.check.result }}
          RELEASE_PACK_LINUX: ${{ needs.release-pack-linux.result }}
          COUNT_SHARD: ${{ needs.count-shard.result }}
          COUNT: ${{ needs.count.result }}
          PRS: ${{ needs.changes.outputs.prs }}
        run: |
          echo "scope: $SCOPE; jobs: $RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = merge_group ]; then echo "tests: $PRS" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          # Fail closed (#2965): only `success` and `skipped` pass. An `abandoned` job (GitHub never created it, as in the
          # outage of 2026-11-09), `failure`, `cancelled`, an empty or any future value fails.
          for r in $RESULTS; do
            case "$r" in
            success | skipped) ;;
            *)
              echo "::error::a CI job's result is '$r', not success or skipped"
              exit 1
              ;;
            esac
          done
          # `changes` decides what is owed: without its scope nothing can be owed, so nothing may pass.
          case "$SCOPE" in
          full | docs | release | none) ;;
          *)
            echo "::error::changes gave no scope ('$SCOPE'; result '$CHANGES'): nothing can be owed"
            exit 1
            ;;
          esac
          if [ "$CHANGES" != success ]; then
            echo "::error::changes gave no scope ('$SCOPE'; result '$CHANGES'): nothing can be owed"
            exit 1
          fi
          # A skipped job passes only where `changes` said the area was not touched (#1139). The scope says which jobs
          # the run owes: `full` owes test-linux and check, and the two macOS jobs where they run (the
          # nightly run, not a queue run, #3172), `docs` owes docs-linux (#3044), `none` owes nothing. A job that was owed
          # and skipped (a skipped `pack` skipped the three macOS jobs for hours) fails the check.
          case "$SCOPE" in
          full) owed="TEST_LINUX CHECK" ;;
          docs) owed="DOCS_LINUX" ;;
          *) owed="" ;;
          esac
          if [ "$MAC_RUN" = true ]; then owed="$owed MACOS MACOS_LINT"; fi
          # a full merge group builds the Linux release main will publish (#2832): one that does not build fails the entry
          if [ "$SCOPE" = full ] && [ "$EVENT" = merge_group ]; then owed="$owed RELEASE_PACK_LINUX"; fi
          # and counts the files the new front end compiles, and refuses a change that makes a passing file fail (#3369)
          if [ "$SCOPE" = full ] && [ "$EVENT" = merge_group ]; then owed="$owed COUNT_SHARD COUNT"; fi
          for name in $owed; do
            eval "result=\$$name"
            if [ "$result" != success ]; then
              echo "::error::$name was owed by scope $SCOPE and its result is '$result', not success"
              exit 1
            fi
          done
      - name: Every test is run or served by exactly one part
        # #3283: each part dealt the tests by itself; a split that lost a test, ran one twice or differs between the
        # parts is a red run
        if: needs.changes.outputs.scope == 'full' && needs.test-linux.result == 'success'
        uses: ./.github/actions/split-guard
        with:
          count: ${{ fromJSON(needs.build-linux.outputs.matrix).include[0].count }}
      - name: A failed queue run keeps no release
        # its tarballs (`stage0-<commit>-*` artifacts) are deleted, so nothing that looks like a release of a commit that
        # failed is left; the push to main also takes them only from a run whose `ci` passed (#2832)
        if: always() && github.event_name == 'merge_group' && steps.verdict.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh_retry gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[]|select(.name|startswith("stage0-"))|.id'); do
            gh_retry gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" && echo "deleted artifact $id"
          done
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  test-store:
    # The whole Linux test store of this commit (#3281): the previous whole file plus what the parts of the queue run
    # added, one release asset, which a part restores with one download. After the merge, on main's push run, and in
    # no job's `needs`, so the gate never waits for it; a failure here only leaves the next runs with the older file
    # and the additions, never a wrong result.
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.scope == 'release'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # test-cache/whole: `gh release create` of the whole store
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/test-cache/whole
  check-new:
    # `smith check`, the one command that is the whole check (#3163), run beside the old jobs so its result can be
    # compared with theirs before any old job goes. Where it runs and why (the lead's three limits): (a) ONE Linux job,
    # on main's push run only (the push run holds 2 Linux jobs, the queue 9, the count 8: 19 of 20 runners; this is
    # the 20th and `concurrency` keeps it to one at a time); (b) after the merge, so the queue run's critical path
    # gains nothing; (c) a push to main is a commit the queue run already tested, so `compare:` sets the two results
    # for the same commit side by side. `continue-on-error`: it gates nothing and no verdict reads it. The 20 compared
    # pushes are written into the body of #3163.
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.scope == 'release'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # one at a time; a push waiting behind it is replaced by a newer one (that commit is simply not compared)
    concurrency:
      group: check-new
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
      SMITH_TEST_STATS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-smith
        with:
          tests: "true"
      - name: Neovim 0.11+ for the editor tests
        run: |
          bin=$("$SMITH" build nvim | tail -n 1)
          echo "$bin" >>"$GITHUB_PATH"
      - uses: ./.github/actions/test-cache
        with:
          os: linux
      - name: smith check
        id: check
        env:
          SMITH_OUTPUT: full
        run: |
          start=$SECONDS
          rc=0
          "$SMITH" check --require fmt,docs,lint,test,prove 2>&1 | tee "$RUNNER_TEMP/check.log" || rc=${PIPESTATUS[0]}
          {
            echo "smith check: exit $rc, $((SECONDS - start)) s"
            grep -E '^smith check: (fmt|docs|lint|test|prove) |^smith check: (not run here|[0-9]+ ok|ok|failed)' "$RUNNER_TEMP/check.log"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          exit "$rc"
      - name: Compare with the queue run of this commit
        if: always() && steps.check.outcome != 'skipped'
        env:
          QUEUE_RUN: ${{ needs.changes.outputs.queue_run }}
          CHECK: ${{ steps.check.outcome }}
        run: |
          mine=pass; [ "$CHECK" = success ] || mine=fail
          if [ -z "$QUEUE_RUN" ]; then
            echo "compare: smith check $mine, no queue run found for $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          theirs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUEUE_RUN" --jq '.conclusion' 2>/dev/null || echo unknown)
          old=fail; [ "$theirs" = success ] && old=pass
          verdict=agree; [ "$mine" = "$old" ] || verdict=DISAGREE
          echo "compare: smith check $mine, queue run $QUEUE_RUN $old ($theirs): $verdict" | tee -a "$GITHUB_STEP_SUMMARY"

  warm:
    # a push to main (a commit the queue checked) builds smith and the tests once more only to save the step cache,
    # which every pull request and queue entry after it restores (a cache saved on a branch is seen by that branch and
    # the ones made from it, and main's by all: so only main saves, which keeps the entries few). One for each OS: the
    # Linux shards restored `none` until this job saved a Linux entry, and built smith from nothing in each of 6 jobs
    # It waits for `publish` and its setup names the stage0 of this very commit, which is the one every job after it
    # fetches: a compile step's key holds the digest of the smith that runs it, so a cache built with the stage0
    # before served 23 of 319 steps (#2833; warm used stage0-b2dc5ea at 06:20Z, build-linux stage0-a42cac3 at 06:38Z).
    # Fetching the cache's stage0 in the jobs instead would cost no wait but break the lag rule
    # (knowledge/smith-bootstrap.md): a commit using a feature of the one before would be built by a release without it.
    # Waiting was not enough by itself: fetch-smith's release list left the newest out (run 42601821786 got
    # stage0-d6bcd6c 2 s after stage0-78a4f9a was published), so the setup names the tag.
    # `always()`: a release that never publishes fails this job rather than save a cache built with another smith
    needs: [changes, release, release-linux, publish]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.warm == 'true'
    strategy:
      # one OS failing must not cancel the other: a Mac step that failed cancelled the Linux job, so main saved no
      # Linux cache from 01:48Z to 03:50Z on 2026-11-09 (#2826)
      fail-fast: false
      matrix:
        # each OS saves the cache of what its jobs build: the Mac builds only its `--macos-only` tests
        os: ${{ fromJSON(needs.changes.outputs.warm_os) }}
    runs-on: ${{ matrix.os }}
    # One warm per OS at a time on main (#3069): a running warm always finishes, and a warm still waiting is replaced
    # by the one of a newer push, whose stage0 every later job fetches; the older commit's cache would be keyed by a
    # stage0 no job uses any more. At 10 merges an hour and warms of about 14 minutes this skips about half of them;
    # the replaced push run ends `cancelled` (no required check reads a push run).
    concurrency:
      group: warm-${{ github.event_name == 'push' && 'main' || github.run_id }}-${{ matrix.os }}
      cancel-in-progress: false
    timeout-minutes: 25
    permissions:
      contents: write # the release-asset step replaces the assets of the rolling `step-cache` prerelease (#2755)
      issues: write # the timing step rewrites the body of #2751
    env:
      GH_TOKEN: ${{ github.token }}
      # every step that writes outside the job (cache, release, issue body) is skipped when this is 1, and prints what it
      # would have written to the step summary instead
      DRY_RUN: ${{ github.event_name != 'push' && '1' || '0' }}
      # what each step's key is made of (#3300), printed by the last step: the hosted side of the diff against a cloud
      # worker's, which is how a machine-specific input of a key is found
      SMITH_STEP_KEY_LOG: /tmp/smith-step-keys.log
    steps:
      - name: Say which job the stage0 comes from
        # on a push, a `publish` that did not succeed means no release of this commit will appear: say so at once and in one
        # line, instead of waiting 6 minutes in fetch-smith for it (#2976). The Mac's warm also needs the macOS tarball.
        if: github.event_name == 'push' && (needs.publish.result != 'success' || (runner.os == 'macOS' && needs.publish.outputs.mac != 'true'))
        run: |
          echo "warm: stage0-$GITHUB_SHA is not published: job publish ${{ needs.publish.result }} (macOS tarball ${{ needs.publish.outputs.mac }}; release ${{ needs.release.result }}, release-linux ${{ needs.release-linux.result }})" | tee -a "$GITHUB_STEP_SUMMARY" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/setup-smith
        with:
          tests: "true"
          # its own commit's release by name, not whatever the release list calls the newest (#2833)
          stage0: ${{ github.event_name == 'push' && format('stage0-{0}', github.sha) || '' }}
          test-flags: ${{ matrix.os == 'macos-26' && format('--macos-only --shard 1/1 --weigh {0}/weights.tsv', runner.temp) || '' }}
      - name: Make the release of the pinned tools (#3161)
        # the one place that reaches the upstream hosts: `smith build nvim` and the tree-sitter fetch read the release
        # `tools-<id>` of this repository (knowledge/ci/caches.md). Releases are immutable, so all assets at once; a
        # no-op when it exists. Runs before the step below so that one reads it
        if: runner.os == 'Linux' && github.event_name == 'push'
        shell: bash
        run: |
          set -eu
          list=$(mktemp)
          "$SMITH" build tools-list >"$list"
          tag=$(grep -m 1 '^tools-' "$list")
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "tools: $tag exists" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          d=$(mktemp -d)
          files=()
          while IFS=$'\t' read -r file url hash; do
            curl -fsSL --retry 5 --retry-all-errors -o "$d/$file" "$url"
            echo "${hash#sha256:}  $d/$file" | sha256sum -c -
            files+=("$d/$file")
          done < <(grep -P '\t' "$list")
          gh release create "$tag" "${files[@]}" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "$tag" --notes "The tools the tests download, pinned in build.c (#3161)."
          echo "tools: made $tag with ${#files[@]} files" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fetch what the test jobs download (#2825)
        # Linux only: `smith build nvim` fetches Neovim for Linux x86_64 and fails on a Mac, and the jobs that restore
        # this cache (the test parts, check, release-linux) are all Linux
        if: runner.os == 'Linux'
        # the test parts take the build of `build-linux` and so restore no step cache; they restore the small
        # `smith-tools-` cache saved below instead, which must hold every package they would fetch from github.com:
        # the tree-sitter CLI (the build above fetched it) and the Neovim release (`smith build nvim`)
        shell: bash
        run: |
          "$SMITH" build nvim | tail -n 1
          du -sh ~/.cache/smith/packages ~/.cache/smith/tools | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the release profile into the step cache (#3052)
        # the count's fix job and `release-pack-linux` build the release profile (-O2) of each commit; this save had
        # only the dev profile's compiles, so their builds had 13 of 329 steps cached and took 1.5 to 2.6 minutes in
        # every queue run (build-linux, dev: 303 of 329 in 28 s). Built by the same stage0 as the dev build above, so
        # the steps' keys are theirs, from a tree as the fix job has it (build/ and .smith/ but stage0 moved aside, as
        # the timing below does): the steps after this one use the dev smith and its tree, which go back unchanged.
        # A failure only leaves the release steps uncached
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        env:
          SMITH_CACHE_MAX: 300M
        run: |
          keep="$RUNNER_TEMP/dev-tree"; mkdir -p "$keep/smith-dir"
          mv build "$keep/build"
          for f in .smith/* .smith/.[!.]*; do [ -e "$f" ] && [ "$f" != .smith/stage0 ] && mv "$f" "$keep/smith-dir/"; done
          back() {
            rm -rf build
            for f in .smith/* .smith/.[!.]*; do [ -e "$f" ] && [ "$f" != .smith/stage0 ] && rm -rf "$f"; done
            mv "$keep/build" build
            for f in "$keep/smith-dir"/* "$keep/smith-dir"/.[!.]*; do [ -e "$f" ] && mv "$f" .smith/; done
          }
          trap back EXIT
          start=$(date +%s)
          smith build -DPROFILE=release 2>&1 | tee "$RUNNER_TEMP/release-build.out" | tail -n 3
          echo "release build: $(( $(date +%s) - start )) s, $(grep -cE '^\[[0-9]+/[0-9]+\] ' "$RUNNER_TEMP/release-build.out" || true) steps, $(grep -c ' (cached)$' "$RUNNER_TEMP/release-build.out" || true) cached" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Print the keys of the steps (#3300)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          [ -f "$SMITH_STEP_KEY_LOG" ] || { echo "no key log"; exit 0; }
          wc -l "$SMITH_STEP_KEY_LOG"
          echo "::group::step keys"
          cat "$SMITH_STEP_KEY_LOG"
          echo "::endgroup::"
      - name: Save the packages and tools
        # about 60 MB: every job that restores a build rather than making it reads this, so no job reaches github.com
        # for a package the cache holds (a 504 hour kept #2798 out of the queue for hours, #2825)
        if: env.DRY_RUN != '1' && runner.os == 'Linux'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/smith/packages
            ~/.cache/smith/tools
          key: smith-tools-${{ runner.os }}-${{ github.sha }}
      - name: Let the next build prune the step cache (#2833)
        # the folder is kept within `step-cache-max` of setup-smith, the least recently used first, by the prune a build
        # starts with, at most once an hour. The stamp of that check is saved with the folder, so a warm within the hour
        # of the one before would skip it and the folder would grow: it is left out of the save, and the next warm (or
        # any job that restores this) prunes at its first build
        if: env.DRY_RUN != '1'
        shell: bash
        run: |
          # the folder is pruned once more here, after the builds: the prune of a job runs at its first build, so the
          # results the dev and release builds just made (about 1.4 GB on Linux, all new keys when the compiler
          # changed) were saved on top of the survivors and the saved folder grew with every merge: 1,397 MB, then
          # 2,045 MB (#3045). The cap is the one of setup-smith, read from there so that it is written once
          cap=$(awk '/^  step-cache-max:/{f=1} f && /default:/{print $2; exit}' .github/actions/setup-smith/action.yml)
          rm -f ~/.cache/smith/steps/prune.timestamp
          SMITH_CACHE_MAX="$cap" "$SMITH" build 2>&1 | grep -E '^cache:|no work to do' | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::the prune before the save did not run"
          rm -f ~/.cache/smith/steps/prune.timestamp
          saved=$(du -sm ~/.cache/smith/steps | cut -f1)
          echo "step cache saved: $saved MB, $(find ~/.cache/smith/steps/m -type f | wc -l) manifests" | tee -a "$GITHUB_STEP_SUMMARY"
          # one warm build leaves 670 MB on the Mac and about 1.4 GB on Linux (the release profile, #3052): a folder under 400 MB means a cap or
          # a prune emptied it, and every job after would miss all 329 steps (#3045)
          if [ "$saved" -lt 400 ]; then echo "::error::the step cache to save is $saved MB, under one warm build (650 MB): a cap emptied it"; exit 1; fi
      - name: Save the step cache
        if: env.DRY_RUN != '1'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/smith/steps
            ~/.cache/smith/packages
            ~/.cache/smith/tools
          key: smith-steps-${{ runner.os }}-${{ github.sha }}
      - name: Restore the lint and proof caches
        # Linux only: the checks that restore them run on Linux (`check`, #2237). The newest
        # entry is the last main's, so the runs below only redo what the merge changed
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/smith/steps/a
          key: smith-lintprove-${{ runner.os }}-${{ github.sha }}
          restore-keys: smith-lintprove-${{ runner.os }}-
      - name: Fill the lint and proof caches
        # a failure here must not fail main's push: the queue already checked this commit, and the entries that did
        # complete are still worth saving
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          "$SMITH" lint >"$RUNNER_TEMP/lint.log" 2>&1 || true
          grep 'linted [0-9]* files' "$RUNNER_TEMP/lint.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          "$SMITH" prove >"$RUNNER_TEMP/prove.log" 2>&1 || true
          tail -n 3 "$RUNNER_TEMP/prove.log" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh ~/.cache/smith/steps/a | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the lint and proof caches
        if: runner.os == 'Linux' && env.DRY_RUN != '1' && always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/smith/steps/a
          key: smith-lintprove-${{ runner.os }}-${{ github.sha }}
      - name: Publish the step cache as release assets
        # a cloud runner cannot download an Actions artifact (its zip is served from a host the session's proxy refuses
        # by name, and the upload of one cost 3.35 runner-minutes a push for no reader: it is gone, #3069), but it can
        # download a release asset. The repository's releases are immutable (a release takes its
        # assets when it is created and never again, #2772), so each push to main creates its own prerelease
        # `step-cache-<sha7>` (never `stage0-*`, never "latest") with all its assets in the one `gh release create` call:
        # smith-steps-linux.tar.gz.NN (the step folder, gzip, cut in parts under the 2 GiB an asset may hold; join
        # them in order) and smith-steps-linux.sha (the commit it was built from). The 3 newest releases stay. A failure
        # here must not fail main's push. It runs after the proof results are filled in (`steps/a` is inside the folder), so the
        # file is the whole store of this commit (#3176); `smith-steps-linux.stage0` names the commit of the smith that
        # filled it (every key holds that smith's digest, and `warm` builds with `stage0-<its own commit>`), so a reader
        # takes the matching release and not the one before it, which served 24 of 339 steps (#3176)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          out="$RUNNER_TEMP/assets"; mkdir -p "$out"
          tar -C ~/.cache/smith/steps -c . | gzip -1 | split -b 1900M -d - "$out/smith-steps-linux.tar.gz."
          echo "$GITHUB_SHA" >"$out/smith-steps-linux.sha"
          echo "$GITHUB_SHA" >"$out/smith-steps-linux.stage0"
          files=("$out"/smith-steps-linux.tar.gz.* "$out/smith-steps-linux.sha" "$out/smith-steps-linux.stage0")
          ls -l "${files[@]}" | awk '{print $5, $9}'
          if [ "$DRY_RUN" = 1 ]; then
            { echo "### Dry run: would create release \`step-cache-${GITHUB_SHA:0:7}\` with these assets, then keep the 3 newest"; echo '```'; ls -l "${files[@]}" | awk '{print $5, $9}'; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="step-cache-${GITHUB_SHA:0:7}"
          if ! GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "${files[@]}" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "step cache $tag" --notes "Main's step cache at $GITHUB_SHA (#2772). Not a release of smith."
          fi
          # keep the 3 newest (the old rolling `step-cache` of #2755 goes first); a refused delete only warns
          GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[]|select(.tagName|test("^step-cache-"))]|sort_by(.createdAt)|reverse|.[3:]|.[].tagName' |
            while read -r old; do
              gh release delete "$old" --cleanup-tag --yes || echo "::warning::could not delete release $old"
            done
          gh release delete step-cache --cleanup-tag --yes 2>/dev/null || true
          echo "published $tag" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Time the build (tracked on #2751)
        # Linux only, after every cache is saved, so the timing never changes what is saved or delays it. It records
        # numbers and gates nothing: a failure here must not fail main's push. Hosted runners vary by about 15%
        # (knowledge/build-times.md, Tracked on main). The result goes to #2751's body, never a comment. The cold case moves build/, .smith/ (not stage0/) and the step
        # cache aside; the cases after it reuse the cold tree, and the originals go back at the end.
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -u
          aside="$RUNNER_TEMP/aside"; mkdir -p "$aside/smith-dir"
          # $SMITH lives in build/, which the cold case moves aside: time with a copy of it
          cp "$SMITH" "$RUNNER_TEMP/smith-timed"; timed="$RUNNER_TEMP/smith-timed"
          log="$RUNNER_TEMP/time"; : >"$log.cold"
          [ -d build ] && mv build "$aside/build"
          for f in .smith/* .smith/.[!.]*; do
            [ -e "$f" ] && [ "$f" != .smith/stage0 ] && mv "$f" "$aside/smith-dir/"
          done
          [ -d ~/.cache/smith/steps ] && mv ~/.cache/smith/steps "$aside/steps"
          run() { # run <case>: wall seconds into $secs, --time output into $log.<case>
            local t0=$SECONDS
            "$timed" build --time >"$log.$1" 2>&1 || true
            secs=$((SECONDS - t0))
          }
          run cold;    cold=$secs
          run noop;    noop=$secs
          echo '# timing' >>front/types_expr.smith
          run front;   front=$secs
          git checkout -- front/types_expr.smith
          echo '/* timing */' >>runtime/executor.c
          run runtime; runtime=$secs
          git checkout -- runtime/executor.c
          rm -rf build; find .smith -mindepth 1 -maxdepth 1 ! -name stage0 -exec rm -rf {} +
          rm -rf ~/.cache/smith/steps
          [ -d "$aside/build" ] && mv "$aside/build" build
          for f in "$aside"/smith-dir/* "$aside"/smith-dir/.[!.]*; do [ -e "$f" ] && mv "$f" .smith/; done
          [ -d "$aside/steps" ] && mv "$aside/steps" ~/.cache/smith/steps
          slow=$(grep -E '^time: +step ' "$log.cold" | sed 's/^time: *//' | head -n 10)
          {
            echo "### Build times (dev profile, hosted ubuntu-latest, about 15% run to run)"
            echo "| case | wall s |"; echo "|---|---|"
            echo "| cold | $cold |"; echo "| no-op | $noop |"
            echo "| front/ edit | $front |"; echo "| runtime/ edit | $runtime |"
            echo; echo "Slowest steps of the cold build:"; echo '```'; echo "$slow"; echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # the tracking issue's body is the only record (no comments): the text above `<!-- latest -->` stays, the
          # latest table replaces what follows it, and the last 10 one-line rows are kept under `<!-- rows -->`
          row="- \`$(git rev-parse --short=7 HEAD)\` $(date -u +%F) cold=$cold noop=$noop front=$front runtime=$runtime"
          old=$(gh api repos/${{ github.repository }}/issues/2751 --jq .body)
          head=${old%%<!-- latest -->*}
          rows=$(printf '%s\n' "$old" | sed -n '/<!-- rows -->/,$p' | sed 1d | grep '^- `' | head -n 9 || true)
          {
            printf '%s\n' "$head<!-- latest -->"
            echo "Latest, \`$(git rev-parse --short=7 HEAD)\` $(date -u +%F): cold $cold s, no-op $noop s, front/ edit $front s, runtime/ edit $runtime s. Slowest steps of the cold build:"
            echo '```'; echo "$slow"; echo '```'
            echo "<!-- rows -->"; echo "$row"; if [ -n "$rows" ]; then echo "$rows"; fi
          } >"$RUNNER_TEMP/body.md"
          if [ "$DRY_RUN" = 1 ]; then
            { echo "### Dry run: would write this as the body of #2751"; echo; cat "$RUNNER_TEMP/body.md"; } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api -X PATCH repos/${{ github.repository }}/issues/2751 -F body=@"$RUNNER_TEMP/body.md" >/dev/null
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  release-pack-linux:
    # the Linux release of the commit a queue run tests (#2832), as `release` builds the macOS one on the push (#3172): the
    # tarball, its checksum and the release tool `publish` and `prune` run, in this run's artifact
    # `stage0-<commit>-linux-x86_64` (3 days). It was packed in the background of `frontend-coverage-build`, whose warm
    # runs then waited 1.6 to 1.8 minutes for it (#3052); here it is beside the tests and off the count's path. Its
    # release build is served by the release steps main's `warm` saves. `ci` owes it, so a release that does not build
    # fails the queue run. It also packs the build for the count's shards (#3369): the release smith is the one the count
    # measures.
    needs: [changes, pack]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.changes.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - uses: ./.github/actions/setup-smith
        with:
          profile: release
      - name: Package the release
        run: |
          start=$SECONDS
          "$SMITH" version | grep -q "commit $GITHUB_SHA\$" || { echo "::error::$SMITH is not the smith of $GITHUB_SHA"; "$SMITH" version; exit 1; }
          out="$RUNNER_TEMP/stage0"; mkdir -p "$out"
          # the release tool (build.c's `release-tool`, compiled by the smith just built, as there); it stays in the
          # artifact: `publish` runs it to add the tarballs to the draft, `prune` to prune the old releases
          "$SMITH" cc -w -I include -I .smith/include release/publish.smith lib/std/files.smith lib/std/console.smith \
              lib/std/format.smith lib/std/mem.smith lib/std/arena.smith lib/std/contract.smith lib/std/env.smith \
              lib/std/text.smith lib/std/process.smith lib/std/clock.smith lib/handlers.c lib/trace.c lib/optimize_asm.c \
              -o "$out/release"
          "$out/release" package "$SMITH" "$out"
          [ -s "$out/smith-linux-x86_64.tar.xz.sha256" ] && [ -x "$out/release" ] \
            || { echo "::error::the Linux release of $GITHUB_SHA was not packaged"; exit 1; }
          ls -l "$out"
          echo "took package $((SECONDS - start))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the tarball for the push to main
        uses: actions/upload-artifact@v4
        with:
          name: stage0-${{ github.sha }}-linux-x86_64
          path: ${{ runner.temp }}/stage0
          compression-level: 0
          retention-days: 3
      - name: Pack the build for the count's shards (#3369)
        # the release smith this job built is the smith the count measures: `count-shard` restores it, so the count
        # builds nothing of its own
        shell: bash
        run: tar -c --zstd -f "$RUNNER_TEMP/build.tar.zst" build .smith
      - name: Save the build for the count's shards
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-release
          path: ${{ runner.temp }}/build.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Check the objects the count's key leaves out
        # an object left out must hold only another verb's code (#2832, #2854): this fails when something else calls it
        shell: bash
        run: |
          # the objects `unrelated_object` in scripts/frontend_coverage/main.smith leaves out of the key hold only another
          # verb's code: nothing outside them and the two dispatchers (smith.o, rt_runtime_verbs.o) calls a symbol they define,
          # and the list here is the list there
          source="$PWD/scripts/frontend_coverage/main.smith"
          cd "$(dirname "$SMITH")"
          exact="rt_runtime_docs.o rt_smith_protocol_dap.o rt_smith_protocol_mcp.o lldb_dap_shim.o lldb_server_shim.o"
          listed=$(sed -n '/static Bool unrelated_object/,/^}/p' "$source" | grep -o '"[a-z_]*\.o"' | tr -d '"' | sort | tr '\n' ' ')
          want=$(echo $exact | tr ' ' '\n' | sort | tr '\n' ' ')
          [ "$listed" = "$want" ] || { echo "::error::the excluded objects here ($want) differ from unrelated_object ($listed)"; exit 1; }
          excluded=$(for o in $exact rt_runtime_mcp*.o front_lsp_*.o; do [ -f "$o" ] && echo "$o"; done | tr '\n' ' ')
          defined=$(mktemp)
          nm -g --defined-only $excluded | awk 'NF == 3 && $2 ~ /^[TDRBSVW]$/ {print $3}' | sort -u >"$defined"
          status=0
          for o in *.o; do
            case " $excluded " in *" $o "*) continue ;; esac
            case "$o" in smith.o | rt_runtime_verbs.o) continue ;; esac
            hits=$(nm -u "$o" 2>/dev/null | awk 'NF == 2 {print $2}' | sort -u | comm -12 - "$defined" | head -n 5 | tr '\n' ' ')
            if [ -n "$hits" ]; then echo "::error::$o calls $hits(defined in an object left out of the count's key)"; status=1; fi
          done
          [ "$status" = 0 ] && echo "$(echo $excluded | wc -w) objects left out of the key, no caller outside the verbs' own code"
          exit $status
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  release:
    # a push to main (the merge queue's checked commit) publishes the stage0 release stage0-<commit>
    # (knowledge/release.md), which the next jobs' setup builds from. The queue run of this commit built the Linux
    # tarball (`release-pack-linux`, #2832); the macOS one is built here, on every push (#3172: a queue run has no macOS
    # job): this job builds it and puts it into the draft, and the `publish` job publishes the draft (releases are
    # immutable once published)
    needs: changes
    if: needs.changes.outputs.scope == 'release'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-macos
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - uses: ./.github/actions/setup-smith
        with:
          # the release profile in the default folder, as the queue run builds it (#2832): `-DPROFILE=release release`
          # then publishes this very binary and builds no second one
          profile: release
      - name: Release
        # `smith build release` prints no per-stage output to read, so only the whole command is timed (#2971)
        run: |
          start=$SECONDS
          code=0
          "$SMITH" build -DPROFILE=release release || code=$?
          echo "took release $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  release-linux:
    # the same draft release gets the Linux tarball (`release publish`, release/publish.smith, adds it to the draft the other job made). `publish` publishes without this
    # job's tarball when it fails, so nothing waits for Linux. Only when the queue run of this commit left no
    # Linux tarball (`release-pack-linux` packs it, #2832, #3052): the fallback, built the same way.
    needs: changes
    if: needs.changes.outputs.scope == 'release' && needs.changes.outputs.linux_packed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-linux
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - uses: ./.github/actions/setup-smith
        with:
          # the release profile in the default folder, as the queue run builds it (#2832): `-DPROFILE=release release`
          # then publishes this very binary and builds no second one
          profile: release
      - name: Release
        # `smith build release` prints no per-stage output to read, so only the whole command is timed (#2971)
        run: |
          start=$SECONDS
          code=0
          "$SMITH" build -DPROFILE=release release || code=$?
          echo "took release $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  publish:
    # publishes the draft the two release jobs added to: a published release is immutable, so it waits for both, and
    # either one's tarball lets the release out: a failed Linux job still lets the macOS release out, and a macOS job that
    # timed out lets the Linux one out (`warm` and every Linux job fetch the Linux tarball; 4 of the 5 failed `warm` runs of
    # 2026-11-09 waited for a release the macOS timeout kept unpublished, #2976). That commit has no macOS tarball for good.
    # The Linux tarball the queue run of this commit built (#2832) is its artifact: this job adds it to the draft
    # (`release upload`, the tool that travels in the Linux artifact) and publishes once `release` (the macOS tarball,
    # built on every push, #3172) is done; `release-linux` runs only for a tarball the queue run did not leave. It ends
    # by deleting the old releases.
    needs: [changes, release, release-linux]
    if: always() && needs.changes.result == 'success' && (needs.release.result == 'success' || needs.release-linux.result == 'success' || needs.changes.outputs.linux_packed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read # the queue run's artifacts
    outputs:
      # whether the published release holds the macOS tarball (the Mac's `warm` needs it)
      mac: ${{ steps.published.outputs.mac }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Download the Linux tarball of the queue run
        if: needs.changes.outputs.linux_packed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: stage0-${{ github.sha }}-linux-x86_64
          path: ${{ runner.temp }}/stage0
          run-id: ${{ needs.changes.outputs.queue_run }}
          github-token: ${{ github.token }}
      - name: Add the queue run's tarball to the draft
        if: needs.changes.outputs.linux_packed == 'true'
        env:
          QUEUE_RUN: ${{ needs.changes.outputs.queue_run }}
        run: |
          chmod +x "$RUNNER_TEMP/stage0/release"
          "$RUNNER_TEMP/stage0/release" upload "$RUNNER_TEMP/stage0"
          echo "release: Linux tarball of queue run $QUEUE_RUN" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        # no smith on this runner (a hosted Ubuntu, 3 minutes): the one command of `release finish`
        # (release/publish.smith), which stays for use by hand
        run: |
          gh release edit "stage0-$GITHUB_SHA" --draft=false
          echo "release: published stage0-$GITHUB_SHA"
      - name: What the release holds
        id: published
        run: |
          assets=$(gh_retry gh api "repos/$GH_REPO/releases/tags/stage0-$GITHUB_SHA" --jq '[.assets[].name]|join(" ")')
          case " $assets " in *" smith-darwin-arm64.tar.xz "*) mac=true ;; *) mac=false ;; esac
          echo "mac=$mac" >>"$GITHUB_OUTPUT"
          echo "release: stage0-$GITHUB_SHA holds $assets" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prune the old releases
        # `release prune-old` (the published ones past the 20 newest and a week each, and the drafts older than a day, by
        # id), last, so the release is out before it runs. It exits 1 when a delete failed or more releases remain than the
        # policy allows (#3029); that must not keep `warm` from running. A commit released by the fallback is pruned by
        # `release publish` in its release jobs.
        if: needs.changes.outputs.linux_packed == 'true'
        continue-on-error: true
        run: '"$RUNNER_TEMP/stage0/release" prune-old'
      - name: API budget (last)
