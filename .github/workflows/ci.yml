name: ci

# The full check (#798, knowledge/ci-hosted.md): Linux carries the tests (8 hosted shards that restore the one build `build-linux` made, #1758)
# and the checks (`check-fmt-prove`: fmt, docs, prove; `check-lint`: lint; same build, beside the shards, #2234), on pull
# requests too; one macOS job (`macos`) builds and runs what only macOS can (lint of the code only the Mac sees, the
# `--macos-only` tests; a documents-only change: docs and their tests);
# the one job `ci` gathers them, so the ruleset and the merge queue name a single required check. The first job that
# fails cancels the run. A push to main (a commit the queue checked) also publishes the release and saves the cache.
# A pull request's check is a run of this workflow that ci-dispatch.yml starts with `workflow_dispatch` on the PR's
# head branch, under a budget of Linux jobs and never while a merge queue job waits for a runner (#2856): its `ci`
# lands on the PR's head sha, where the ruleset reads it. It is a light check (#2822): the build, one job of fmt, docs,
# prove and lint, and one of only the tests `smith test --changed` reaches; the Mac only when the diff touches what
# only the Mac sees. The merge queue runs everything. There is no `pull_request` trigger: a run whose jobs were all
# skipped would leave a skipped `ci`, which the ruleset counts as passing.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "The pull request this run checks (ci-dispatch.yml starts it on the PR's head branch)"
        required: true
        type: string
      mac:
        description: "Only by hand, to test the Mac watchdog (#2835): `mac` runs the macOS job on the owner's Mac, `dead` on a Mac that does not answer (the watchdog must fall back to hosted macos-26); `auto` is the rule of pick-mac"
        type: choice
        options: [auto, mac, dead]
        default: auto
      no_yield:
        description: "Only by hand, for a check that must finish while the queue is never idle: skip yield-to-queue's self-cancel"
        type: boolean
        default: false
      uncached:
        description: "Only by hand (#2955): run the count as the nightly does, with no cache, and compare it row by row with the cached count of the same commit"
        type: boolean
        default: false
  merge_group:
  push:
    branches: [main]
  schedule:
    # the nightly full run (#2833): restores no test results, so every test runs once and the run stores them all. A
    # test that fails here while the cache said it passed is a p0 bug in a key (knowledge/ci-hosted.md)
    - cron: "17 3 * * *"

# A new push to a pull request replaces its older run; the merge queue's runs and main's never cancel each other. A push
# to main has a group of its own per commit: with one group for the branch, GitHub keeps only the newest *pending* run,
# so while the queue landed a PR every ~30 min and a run took longer, each pending run was cancelled by the next push
# with no job started, and `warm` (the step cache) never ran (#2792). The jobs that must run once at a time keep their
# own groups (`release-macos`, `release-linux`).
concurrency:
  group: ci-${{ inputs.pr && format('pr-{0}', inputs.pr) || github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  changes:
    # what the change touches decides what runs: a document no build reads runs nothing, the README,
    # knowledge/ and the skills run `smith docs` and their tests, everything else runs the full check
    runs-on: ubuntu-latest
    # 3 minutes of work plus the 10-minute cap of a queue run's wait for the groups ahead (`yield-to-queue`, #2833)
    # and the 60-minute cap of `batch-wait` (#2851, a queue entry)
    timeout-minutes: 75
    # `batch-wait` cancels the run of a group that left the queue; `yield-to-queue` force-cancels a PR check's own run
    permissions:
      contents: read
      actions: write
      pull-requests: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      # whether `macos` runs: always where the scope is full or docs; a PR check builds smith on the Mac even when its diff
      # touches nothing only the Mac sees (#2832: a macOS-only build error was first seen in the queue)
      mac_run: ${{ steps.scope.outputs.mac_run }}
      # whether `macos` also lints and runs the `--macos-only` tests: always, except on a PR check whose diff touches
      # nothing only the Mac sees (#2822), whose `macos` job only builds smith (#2832)
      mac_tests: ${{ steps.scope.outputs.mac_tests }}
      # a push to main: the run of the merge queue that tested this very commit, and whether its artifacts hold the
      # release tarballs it built (#2832, knowledge/release.md); `publish` publishes those instead of building again
      queue_run: ${{ steps.packed.outputs.run }}
      linux_packed: ${{ steps.packed.outputs.linux }}
      mac_packed: ${{ steps.packed.outputs.mac }}
      # whether the front-end count runs (#2914): every queue entry and nightly run, and a PR check whose diff touches
      # what can change the count
      count: ${{ steps.scope.outputs.count }}
      # the count is run with no cache and compared with the cached one (#2955): the nightly run, or a dispatch by hand
      uncached: ${{ steps.scope.outputs.uncached }}
      # the base a PR check is compared against (the count's gate reads main's last count from it)
      base: ${{ steps.pr.outputs.base }}
      # a queue entry: alone, waited or capped (`batch-wait`), and the PRs its tree holds that main does not
      batch: ${{ steps.batch.outputs.batch }}
      prs: ${{ steps.prs.outputs.prs }}
      matrix: ${{ steps.linux.outputs.matrix }}
      linux: ${{ steps.linux.outputs.linux }}
      # where the macOS jobs run (knowledge/ci-hosted.md): hosted macos-26, the owner's Mac only as overflow when the
      # hosted pool is saturated; picked per run by the step `Pick the macOS runner`
      pack: ${{ steps.pack.outputs.build }}
      mac: ${{ steps.mac.outputs.mac }}
      # whether `warm` runs, and on which OSes: a push to main runs it for real on both; a pull request that changes the
      # job (or the setup action it runs) runs it as a dry run on Linux only (#2769, knowledge/ci-hosted.md)
      warm: ${{ steps.warm.outputs.warm }}
      warm_os: ${{ steps.warm.outputs.os }}
      # SMITH_CORES of a macOS job: the Mac's 16 cores shared by its 3 runners (overflow only); a hosted runner has 3
      cores: ${{ steps.mac.outputs.cores }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/yield-to-queue
        with:
          queue-wait: "true"
      - name: The pull request
        # a PR check is a `workflow_dispatch` run (#2856): what a `pull_request` event carried (the base, the body) is
        # read from the PR the dispatcher named
        id: pr
        if: github.event_name == 'workflow_dispatch'
        env:
          PR: ${{ inputs.pr }}
        run: |
          gh_retry env GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" >"$RUNNER_TEMP/pr.json"
          echo "base=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")" >>"$GITHUB_OUTPUT"
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" >"$RUNNER_TEMP/body"
          echo "PR #$PR, base $(jq -r .base.sha "$RUNNER_TEMP/pr.json" | cut -c1-7), head ${GITHUB_SHA:0:7}" >>"$GITHUB_STEP_SUMMARY"
      - name: Wait while a later queue entry is built on this one
        # batching (#2851, knowledge/ci-hosted.md): with HEADGREEN a later group's passing run merges every entry ahead
        # of it, so an entry with a later group built on it waits here, on this one runner, and every heavy job (they
        # all need `changes`) waits with it; it is cancelled when its group merges. Once it is the last entry built, it
        # goes on and the run is the full check of its own tree, as today. Nothing here makes `ci` pass by itself.
        id: batch
        uses: ./.github/actions/batch-wait
      - name: Pick the macOS runner
        id: mac
        uses: ./.github/actions/pick-mac
        with:
          token: ${{ secrets.RUNNER_STATUS_TOKEN }}
          github-token: ${{ github.token }}
          fork: false
          force: ${{ inputs.mac }}
      - name: Is there a pack for this LLVM configuration
        id: pack
        # a change of patches/ bumps the configuration name, whose pack no release holds yet: the `pack` job builds
        # and publishes it before anything that needs LLVM runs (#1064). Not for a fork, which cannot publish.
        env:
          FORK: false
        run: |
          name=$(sed -n 's/.*"SMITH_LLVM_NAME", "\([^"]*\)".*/\1/p' build.c | head -1)
          build=false
          if [ "$FORK" != true ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            for tag in "llvm-$name-darwin-arm64" "llvm-$name-linux-x86_64"; do
              gh release view "$tag" >/dev/null 2>&1 || build=true
            done
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "LLVM pack $name: built by this run: $build" >>"$GITHUB_STEP_SUMMARY"
      - name: Scope
        id: scope
        env:
          BASE: ${{ steps.pr.outputs.base || github.event.merge_group.base_sha }}
          UNCACHED_INPUT: ${{ inputs.uncached }}
        run: |
          # none: only documents no build reads. docs: also the documents the docs check and their tests read. full:
          # anything else; a push to main, or a diff that cannot be read, is always full.
          # Other workflows (llvm.yml) change nothing this one runs; ci.yml itself and the actions it uses do.
          documents='^(LICENSE[^/]*|CONTRIBUTING[.]md|[^/]+[.](png|jpe?g|gif|svg|webp))$'
          workflows='^[.]github/workflows/'
          gated='^(README[.]md|knowledge/.*|[.]agents/.*)$'
          scope=full
          changed=
          # a push to main is a commit the merge queue already checked: it only publishes the release
          if [ "$GITHUB_EVENT_NAME" = push ]; then scope=release; BASE=; fi
          # a queue entry is built on main plus the entries ahead of it, and merging it merges them too: its scope is
          # everything not yet on main. Scoped by its own diff, a docs-only entry behind a code change ran no tests,
          # passed, and carried the failing code onto main (#1539 behind #1541, 2026-11-02)
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then git fetch -q origin main && BASE=$(git merge-base HEAD origin/main); fi
          if [ -n "$BASE" ] && changed=$(git diff --name-only "$BASE" HEAD); then
            own=$(printf '%s\n' "$changed" | grep -E '^([.]github/workflows/ci[.]yml|[.]github/actions/.*)$' || true)
            built=$(printf '%s\n' "$changed" | grep . | grep -vE "$documents" | grep -vE "$workflows" || true)
            built=$(printf '%s\n%s\n' "$built" "$own" | grep . || true)
            code=$(printf '%s\n' "$built" | grep . | grep -vE "$gated" || true)
            if [ -z "$built" ]; then scope=none; elif [ -z "$code" ]; then scope=docs; fi
          fi
          # A pull request lints and tests on the Mac only where the diff reaches what only the Mac sees: shim/,
          # Objective-C, the TLS file, a `@when(target.os == .macos)` line, or the workflows and actions (#2822); it
          # always builds smith there (#2832): a macOS-only build error (a deprecation under -Werror, #3014) failed only
          # in the queue. A docs scope keeps the whole job (it is where the docs check runs); the queue runs it always.
          mac_run=true
          mac_tests=true
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$scope" = full ] && [ -n "$changed" ]; then
            mac_tests=false
            if printf '%s\n' "$changed" | grep -E '^(shim/|lib/net_tls[.]c$|[.]github/)|[.]m$' >/dev/null; then mac_tests=true; fi
            if git diff -U0 "$BASE" HEAD | grep -E '^[+-].*target[.]os *== *[.]macos' >/dev/null; then mac_tests=true; fi
          fi
          # The count (#2914) runs in every queue entry and nightly run. A PR check runs it only when its diff touches
          # what the count reads: the front end, std, the C import, the language runtime or the build; a docs-only or
          # .github-only PR gets no count jobs and no extra cost.
          count=false
          case "$GITHUB_EVENT_NAME" in merge_group | schedule) count=true ;; esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$scope" = full ] && [ -n "$changed" ]; then
            if printf '%s\n' "$changed" | grep -E '^(front/|lib/std/|shim/cimport|runtime/front|runtime/lang|build[.]c$)' >/dev/null; then count=true; fi
          fi
          # The nightly run (#2955), or a dispatch by hand that asks for it, counts with no cache and compares the table
          # with the cached count of the same commit: the soundness check every count cache names. It needs the count.
          uncached=false
          if [ "$GITHUB_EVENT_NAME" = schedule ] || { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$UNCACHED_INPUT" = true ]; }; then
            uncached=true
            [ "$scope" = full ] && count=true
          fi
          echo "scope=$scope" >>"$GITHUB_OUTPUT"
          echo "mac_run=$mac_run" >>"$GITHUB_OUTPUT"
          echo "mac_tests=$mac_tests" >>"$GITHUB_OUTPUT"
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "uncached=$uncached" >>"$GITHUB_OUTPUT"
          echo "scope: $scope (macos: $mac_run, macos tests: $mac_tests, count: $count, uncached: $uncached)" >>"$GITHUB_STEP_SUMMARY"

      - name: The tarballs the queue run of this commit built
        # a push to main is the commit the merge queue tested: its run built the release profile on both platforms and
        # kept the tarballs as artifacts named after the commit (`release-pack-macos`, `frontend-coverage-fix`, #2832).
        # They count only from a merge_group run whose `ci` passed; one missing (a push that did not come through the
        # queue, an expired artifact) is built by `release` or `release-linux` as before. The Linux artifact carries
        # the release tool `publish` runs, so without it both are built.
        id: packed
        if: github.event_name == 'push'
        run: |
          run=; linux=false; mac=false
          for os in linux-x86_64 darwin-arm64; do
            ids=$(gh_retry gh api "repos/$GH_REPO/actions/artifacts?name=stage0-$GITHUB_SHA-$os" \
              --jq '.artifacts[]|select(.expired|not)|select(.workflow_run.head_sha=="'"$GITHUB_SHA"'")|.workflow_run.id' || true)
            for id in $ids; do
              [ -n "$run" ] && [ "$id" != "$run" ] && continue
              event=$(gh_retry gh api "repos/$GH_REPO/actions/runs/$id" --jq .event || true)
              ci=$(gh_retry gh api "repos/$GH_REPO/actions/runs/$id/jobs?per_page=100" --jq '.jobs[]|select(.name=="ci")|.conclusion' || true)
              if [ "$event" = merge_group ] && [ "$ci" = success ]; then
                run=$id
                [ "$os" = linux-x86_64 ] && linux=true || mac=true
                break
              fi
            done
          done
          # the tool that publishes travels in the Linux artifact
          [ "$linux" = true ] || { run=; mac=false; }
          echo "run=$run" >>"$GITHUB_OUTPUT"
          echo "linux=$linux" >>"$GITHUB_OUTPUT"
          echo "mac=$mac" >>"$GITHUB_OUTPUT"
          echo "release: tarballs of queue run ${run:-none} (linux: $linux, macos: $mac); the others are built here" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The pull requests this queue entry tests
        id: prs
        if: github.event_name == 'merge_group'
        # every entry ahead of this one and this one: the squash commits on top of main, each subject ending in (#N)
        run: |
          git fetch -q origin main
          prs=$(git log --format=%s "$(git merge-base HEAD origin/main)..HEAD" | grep -oE '[(]#[0-9]+[)]$' | tr -d '()' | tac | paste -sd ' ' -)
          echo "prs=$prs" >>"$GITHUB_OUTPUT"
          echo "tests: $prs" >>"$GITHUB_STEP_SUMMARY"

      - name: Does the change touch the warm job
        id: warm
        # `warm` writes (the cache, the release, #2751) and only runs on main, so a change to it could not be seen
        # working before it merged (#2761). A pull request whose `warm` job, or the setup action it uses, differs from
        # the base's runs it as a dry run: every write is skipped and printed to the step summary instead (#2769).
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          warm=false; os='["ubuntu-latest"]'
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            warm=true; os='["macos-26","ubuntu-latest"]'
          elif [ -n "$BASE" ]; then
            new=$(yq -o=json '.jobs.warm' .github/workflows/ci.yml)
            old=$(git show "$BASE:.github/workflows/ci.yml" | yq -o=json '.jobs.warm' || true)
            [ "$new" != "$old" ] && warm=true
            if ! git diff --quiet "$BASE" HEAD -- .github/actions/setup-smith; then warm=true; fi
          fi
          echo "warm=$warm" >>"$GITHUB_OUTPUT"
          echo "os=$os" >>"$GITHUB_OUTPUT"
          echo "warm: $warm ($GITHUB_EVENT_NAME)" >>"$GITHUB_STEP_SUMMARY"

      - name: Does the change undo a commit already on main
        # a stale working tree squashed onto a moved main deletes merged work with every test green (#1455, #1473):
        # scripts/revert_check.c fails a change that removes the lines of a recent commit; `Reverts #N` or
        # `Rewrites #N` in the body (or the queue entry's commit message) says a revert or a rewrite is meant
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
        env:
          BASE: ${{ steps.pr.outputs.base || github.event.merge_group.base_sha }}
        run: |
          cc -std=gnu2x -O1 scripts/revert_check.c -o "$RUNNER_TEMP/revert_check"
          # a PR check's body was saved by the step `The pull request`
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || git log -1 --format=%B HEAD >"$RUNNER_TEMP/body"
          "$RUNNER_TEMP/revert_check" "$(git merge-base "$BASE" HEAD)" HEAD "$RUNNER_TEMP/body"

      - name: Test matrix
        id: linux
        # Linux carries the tests: `--skip-macos` in parts, each building smith itself (no artifact egress). The Mac
        # runs the few tests only macOS can run (`--macos-only`, one part). A pull request runs everything in 8 parts,
        # as the queue does (owner, 2026-11-04, #2234): from 2026-11-03 the queue was the first place a change was
        # fully tested, 74 of 100 failed queue builds failed in `test-linux`, and each failure fails the builds behind
        # it. A push to main runs no tests (the queue tested that exact commit; #1139): its work is the release and the
        # cache.
        run: |
          flags="--skip-macos"
          macflags="--macos-only --shard 1/1"
          count=8
          # A pull request runs the tests `smith test --changed` reaches, in one part (#2822, #2856: a PR check is at most
          # 2 Linux jobs at once, this part and `check-fmt-prove`); the queue runs all of them in 8. A wide selection
          # (smith's core, the test runner) is still wide: the queue is the gate.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then flags="--skip-macos --changed"; count=1; fi
          linux=
          for i in $(seq 1 "$count"); do
            linux="$linux"${linux:+,}'{"shard":'$i',"count":'$count',"flags":"'"$flags"'"}'
          done
          echo "linux={\"include\":[$linux]}" >>"$GITHUB_OUTPUT"
          echo "matrix={\"include\":[{\"os\":\"macos-26\",\"shard\":1,\"count\":1,\"flags\":\"$macflags\"}]}" >>"$GITHUB_OUTPUT"
          echo "tests: $count Linux parts ($flags), one macOS part ($macflags)" >>"$GITHUB_STEP_SUMMARY"
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  pack:
    # the LLVM pack of a configuration no release holds yet, built and published by llvm.yml (#1064) before the jobs
    # that need it start; it runs on the Mac only as overflow (hosted pool saturated), else on hosted runners
    needs: changes
    if: needs.changes.outputs.pack == 'true'
    uses: ./.github/workflows/llvm.yml
    permissions:
      contents: write # gh release create
      actions: write # llvm.yml's pick-mac lists the queued and running jobs
    secrets: inherit

  mac-probe:
    # The Mac watchdog (#2835), part 1. A job sent to the owner's Mac waits for a runner that never comes when the Mac is
    # off, asleep or hung, though the runners call says it is online; `ci` would wait with it. So the real `macos` job
    # is not queued on the Mac blind: this probe is, with nothing to do, and `watch` decides from whether it starts.
    # Nothing needs this job, so a probe that never starts holds nobody; `mac-probe-end` cancels it.
    needs: [changes, pack]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.changes.outputs.mac_run == 'true' && (needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'docs') && needs.changes.outputs.mac != '"macos-26"' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.mac) }}
    timeout-minutes: 5
    concurrency:
      group: mac-probe-${{ github.run_id }}
      cancel-in-progress: true
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: echo "the Mac started the probe"
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"

  watch:
    # The Mac watchdog, part 2: the one that decides where `macos` runs. Hosted was picked: hosted. The Mac was picked:
    # the Mac if it started the probe within 3 minutes, else hosted macos-26 with nobody's hand (a failed call is
    # hosted too). One small hosted Linux job for at most 3 minutes, started with the probe.
    needs: [changes, pack]
    if: ${{  !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.changes.outputs.mac_run == 'true' && (needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'docs')  }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.watch.outputs.runner }}
      cores: ${{ steps.watch.outputs.cores }}
      dead: ${{ steps.watch.outputs.dead }}
    env:
      GH_TOKEN: ${{ github.token }}
      MAC: ${{ needs.changes.outputs.mac }}
      MAC_CORES: ${{ needs.changes.outputs.cores }}
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Did the Mac start the probe
        id: watch
        run: |
          hosted='"macos-26"'
          runner=$hosted; cores=3; dead=false; why="hosted was picked"
          if [ "$MAC" != "$hosted" ]; then
            dead=true; why="the Mac did not start the probe within 180 s: macOS runs on hosted macos-26"
            end=$((SECONDS + 180))
            while [ "$SECONDS" -lt "$end" ]; do
              status=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq \
                '[.jobs[] | select(.name == "mac-probe")][0].status // "none"' 2>/dev/null) || status=none
              if [ "$status" = in_progress ] || [ "$status" = completed ]; then
                runner=$MAC; cores=$MAC_CORES; dead=false; why="the Mac started the probe after $SECONDS s"
                break
              fi
              sleep 10
            done
          fi
          echo "runner=$runner" >>"$GITHUB_OUTPUT"
          echo "cores=$cores" >>"$GITHUB_OUTPUT"
          echo "dead=$dead" >>"$GITHUB_OUTPUT"
          echo "macOS job runs on $runner ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"

  mac-probe-end:
    # The Mac watchdog, part 3: the probe of a Mac that did not answer is still queued; a job of its concurrency group
    # that starts replaces it (cancel-in-progress cancels a pending job too), so the run does not sit "in progress"
    # until GitHub drops the job a day later. That run ends `cancelled` though every job it owed passed.
    needs: [watch]
    if: ${{ always() && needs.watch.outputs.dead == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: mac-probe-${{ github.run_id }}
      cancel-in-progress: true
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: echo "the Mac did not answer; its probe is cancelled"
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"

  macos:
    # everything macOS does in a run, in one job (#1709): build smith and the tests, then the macOS-only tests (a
    # documents-only change: docs and the tests that read them). fmt, docs and prove run on Linux beside the test
    # parts (`check-fmt-prove`, #2234), and lint on both (`check-lint` too): each platform lints code the other can't see.
    # It was five jobs
    # (build, mechanical, prove, test, docs) handing the build over as an artifact; four of them filled four of the five
    # hosted macOS slots the free plan allows, so a second run's jobs queued behind the first, and a job that waited
    # past its time limit was cancelled with no test failing (#1691: docs, #1648: prove). One job takes one slot, so
    # five runs proceed at once, and nothing is packed or downloaded. The stages run one after another: two verbs
    # cannot share one tree (they collide on .smith/build.ninja), and every stage runs even when an earlier one failed,
    # so one run names all failures.
    needs: [changes, pack, watch]
    # The queue runs it always; a pull request runs it only when its diff reaches what only the Mac sees, or when the
    # change is documents (where the docs check runs) (#2822): the free plan runs about 20 jobs at once, and a pull
    # request that cannot reach the Mac's code leaves it to the queue. Before #2822 it ran on every pull request so that
    # a green PR meant a green queue run (owner, 2026-11-04: "We have the 20 Linux runners and the 5 Mac runners. We
    # should be prioritizing that. But then absolutely leverage my Mac as well."): when the 5 hosted macOS slots are
    # full, `pick-mac` sends the job to the owner's Mac, if the Mac starts the probe job within 3 minutes (`watch`, #2835).
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.watch.result == 'success' && needs.changes.outputs.mac_run == 'true' && (needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'docs') }}
    runs-on: ${{ fromJSON(needs.watch.outputs.runner) }}
    # hosted: build about 3.5 min, fmt/docs/lint 3 to 5, the proofs and the macOS tests a few more; the owner's Mac
    # does all of it in about 4 (#1709). The job's limit counts time spent queued for a slot: at 30 minutes, jobs waiting
    # for a full hosted pool were cancelled before their first step (2026-11-03). So the job allows 90, and each step has
    # its own limit to catch a hang.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: ${{ needs.watch.outputs.cores }}
      SMITH_OUTPUT: full
      SMITH_TEST_STATS: "1"
      SCOPE: ${{ needs.changes.outputs.scope }}
      MACFLAGS: ${{ fromJSON(needs.changes.outputs.matrix).include[0].flags }}
      # false: a PR check whose diff reaches nothing only the Mac sees builds smith here and stops (#2832)
      MAC_TESTS: ${{ needs.changes.outputs.mac_tests }}
    permissions:
      contents: write # test-cache/save: `gh release create` of this job's test store (#2870)
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tools some tests need
        if: needs.changes.outputs.scope == 'full' && needs.changes.outputs.mac_tests == 'true'
        timeout-minutes: 5
        # the editor tests do nothing without nvim; some tests bound a command with coreutils' `timeout`. It runs
        # while smith builds: the macOS test stage waits for it
        shell: bash
        run: |
          # the owner's Mac already has them: three runners share it, so install only what is missing
          if command -v nvim >/dev/null && command -v gtimeout >/dev/null; then nohup true >"$RUNNER_TEMP/brew.log" 2>&1 &
          else HOMEBREW_NO_AUTO_UPDATE=1 nohup brew install neovim coreutils >"$RUNNER_TEMP/brew.log" 2>&1 &
          fi
          echo $! >"$RUNNER_TEMP/brew.pid"
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/setup-smith
        timeout-minutes: 20
        with:
          # a build-only PR check (#2832) builds smith alone: the build is the check
          tests: ${{ needs.changes.outputs.mac_tests }}
          # builds only the `--macos-only` tests the job runs (`--shard 1/1` makes the scan list one part), not all of
          # them (#2242); a documents-only change keeps the full list
          test-flags: ${{ needs.changes.outputs.scope == 'full' && format('{0} --costs {1}/.github/shard-costs.tsv', env.MACFLAGS, github.workspace) || '' }}
      - name: API budget (before test-cache)
        if: needs.changes.outputs.mac_tests == 'true'
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} before test-cache
      - uses: ./.github/actions/test-cache
        if: needs.changes.outputs.mac_tests == 'true'
        # the macOS tests the store holds as passed are left out too (#2833): the `--macos-only` tests whose inputs did
        # not change do not run; the nightly restores nothing
        with:
          os: macos
          fresh: ${{ github.event_name == 'schedule' }}
      - name: API budget (after test-cache)
        if: needs.changes.outputs.mac_tests == 'true'
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} after test-cache
      - name: Checks
        if: needs.changes.outputs.mac_tests == 'true'
        timeout-minutes: 30
        shell: bash
        run: |
          # each stage's output goes to its own log; each prints `took <stage> <n>s (exit <code>)` in the job summary,
          # and a failed one prints its last 60 lines and `FAIL <stage>` (#1139)
          stage() { # name, then the command
            local name=$1 start=$SECONDS code=0
            shift
            "$@" >"$RUNNER_TEMP/$name.log" 2>&1 || code=$?
            echo "$code $((SECONDS - start))" >"$RUNNER_TEMP/$name.status"
            echo "took $name $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          macos_tests() {
            while kill -0 "$(cat "$RUNNER_TEMP/brew.pid")" 2>/dev/null; do sleep 1; done
            tail -n 3 "$RUNNER_TEMP/brew.log"
            # shellcheck disable=SC2086
            "$SMITH" test $MACFLAGS --costs "$PWD/.github/shard-costs.tsv"
          }
          if [ "$SCOPE" = docs ]; then
            names="docs readme"
            stage docs "$SMITH" docs
            stage readme "$SMITH" test --test readme_test,skills_test
          else
            # fmt, docs and prove run on Linux (`check-fmt-prove`, #2234); lint runs on both platforms, since each sees
            # code the other can't (`@when(target.os == .macos)`, Objective-C and Metal here; glibc's macros there):
            # on the Mac it is the job `macos-lint`, beside this one (#3045), so the two take their minutes together
            names="test"
            stage test macos_tests
          fi
          # the test stage's output, with the SMITH_TEST_STATS lines, is the log `smith build ci-times` reads (#1139)
          mkdir -p .smith/log
          [ -f "$RUNNER_TEMP/test.log" ] && cp "$RUNNER_TEMP/test.log" .smith/log/test.log
          failed=0
          for name in $names; do
            read -r code took <"$RUNNER_TEMP/$name.status"
            if [ "$code" != 0 ]; then
              tail -n 60 "$RUNNER_TEMP/$name.log"
              echo "FAIL $name"
              echo "::error::smith $name failed"
              # a failed test is named as an annotation, as on Linux
              grep -hE '^FAIL |^FAILED:' "$RUNNER_TEMP/$name.log" 2>/dev/null | sort -u | head -n 20 |
                while IFS= read -r line; do echo "::error::$line"; done
              failed=1
            else
              echo "ok $name"
            fi
          done
          exit $failed
      - name: Publish the test store
        # this job's store as its own release, `test-cache-<sha7>-macos` (#2870); queue and nightly runs only
        if: always() && needs.changes.outputs.scope == 'full' && needs.changes.outputs.mac_tests == 'true'
        uses: ./.github/actions/test-cache/save
        with:
          os: macos
          name: macos
      - name: Upload the logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-log-macos-26-1-of-1
          path: .smith/log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"

  macos-lint:
    # `smith lint` of the code only the Mac sees, beside `macos` and not after it (#3045): the two stages cannot share one
    # tree (they collide on .smith/build.ninja), so each gets its own job and its own copy, and the job takes the longer
    # of the two, not their sum (lint 102 to 151 s, the macOS tests 116 to 173 s, on 2026-11-10). It builds smith only,
    # not the tests (`tests: false`: 109 to 156 s of `macos` that lint does not need). It runs where `macos` runs its
    # tests: a full run whose diff reaches the Mac's code (`mac_tests`). It takes one more hosted macOS slot of the
    # five, so a second run's jobs may queue behind the first (knowledge/ci/caches.md).
    needs: [changes, pack, watch]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.watch.result == 'success' && needs.changes.outputs.mac_run == 'true' && needs.changes.outputs.mac_tests == 'true' && needs.changes.outputs.scope == 'full' }}
    runs-on: ${{ fromJSON(needs.watch.outputs.runner) }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: ${{ needs.watch.outputs.cores }}
      SMITH_OUTPUT: full
    permissions:
      contents: read
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/setup-smith
        timeout-minutes: 20
        with:
          tests: "false"
      - name: Lint
        timeout-minutes: 30
        shell: bash
        run: |
          start=$SECONDS
          code=0
          "$SMITH" lint >"$RUNNER_TEMP/lint.log" 2>&1 || code=$?
          echo "took lint $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" != 0 ]; then
            tail -n 60 "$RUNNER_TEMP/lint.log"
            echo "FAIL lint"
            echo "::error::smith lint failed"
            exit 1
          fi
          echo "ok lint"

  build-linux:
    # builds smith and the tests once for the Linux shards (#1758): a hosted runner minute is the scarce thing (the free
    # plan's 20 slots were full most hours on 2026-11-02), so one job builds, and each shard restores it as an artifact
    # instead of spending about 2.5 min of its own on it (knowledge/ci.md)
    needs: [changes, pack]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.changes.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    # the build, then one test part when the sizing asks for one in a queue run (#2870)
    timeout-minutes: 30
    outputs:
      # the outcome of the test part this job ran (`success`, `failure`), or empty when the parts are `test-linux`'s
      tests: ${{ steps.tests.outcome != 'skipped' && steps.tests.outcome || '' }}
      # where the 10 Linux jobs that start next run, chosen by the last step: hosted ubuntu-latest, the Mac's Linux runners
      # (#1140) for the ones that would not fit in the hosted slots (#2259)
      matrix: ${{ steps.runners.outputs.matrix }}
      runner-fmt-prove: ${{ steps.runners.outputs.fmt-prove }}
      runner-lint: ${{ steps.runners.outputs.lint }}
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
      # in every test key (an environment variable of SMITH_ is): the test jobs set it, so the sizing step must too,
      # or `smith test --misses` finds nothing of the store and asks for 7 parts (#2833)
      SMITH_TEST_STATS: "1"
    permissions:
      contents: write # test-cache/save: `gh release create` of the test store of the part it runs (#2870)
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/yield-to-queue
      - uses: ./.github/actions/setup-smith
        with:
          tests: "true"
      - name: Pack the build
        shell: bash
        run: |
          start=$(date +%s)
          tar -c --zstd -f "$RUNNER_TEMP/build.tar.zst" build .smith
          ls -l "$RUNNER_TEMP/build.tar.zst"
          echo "pack: $(( $(date +%s) - start )) s ($(du -h "$RUNNER_TEMP/build.tar.zst" | cut -f1))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the build for the shards
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: ${{ runner.temp }}/build.tar.zst
          compression-level: 0
          retention-days: 1
      - name: API budget (before test-cache)
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} before test-cache
      - uses: ./.github/actions/test-cache
        with:
          os: linux
          fresh: ${{ github.event_name == 'schedule' }}
          imports-from: linux-* # the test parts' import caches, not the count's (#2939)
      - name: API budget (after test-cache)
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} after test-cache
      - name: Size the test parts
        # the number of Linux test parts follows the work the store leaves (#2833): `smith test --misses` plans the
        # whole suite, leaves out every test the restored store holds, and prints the CPU seconds that remain. A part
        # pays about 4 minutes of setup whatever it runs, so a part gets about 500 CPU seconds (2 minutes on 4 cores),
        # at most 8 parts and at least 1. Any failure keeps the 8 parts of `changes`.
        id: size
        continue-on-error: true
        shell: bash
        env:
          SMITH_OUTPUT: full
        run: |
          count=8
          # a PR check runs its tests in one part whatever they cost (#2856: at most 2 Linux jobs at once)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "count=1" >>"$GITHUB_OUTPUT"; echo "jobs=2" >>"$GITHUB_OUTPUT"
            echo "test parts: 1 (a pull request's check)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # `smith test` runs two runners (front, units): each prints its own `misses:` line, the seconds add up
          "$SMITH" test --skip-macos --misses --costs "$PWD/.github/shard-costs.tsv" >"$RUNNER_TEMP/misses.out" 2>&1 || true
          line=$(grep '^misses: ' "$RUNNER_TEMP/misses.out" || true)
          if [ -n "$line" ]; then
            secs=$(printf '%s\n' "$line" | sed -n 's/^misses: [0-9]* tests, \([0-9]*\)\.[0-9] s.*/\1/p' | awk '{s+=$1} END{print s+0}')
            count=$(( (secs + 499) / 500 )); [ "$count" -lt 1 ] && count=1; [ "$count" -gt 8 ] && count=8
          fi
          echo "count=$count" >>"$GITHUB_OUTPUT"
          # one part in a queue run is run by this job, which holds its runner already (#2870)
          jobs=$(( count + 2 )); [ "$count" = 1 ] && [ "$GITHUB_EVENT_NAME" = merge_group ] && jobs=2
          echo "jobs=$jobs" >>"$GITHUB_OUTPUT"
          echo "test parts: $count (${line:-no answer from smith test --misses})" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report the test-store hit rate (sizing)
        # one line per cache with its hit rate; the first misses say which input differs (#2876)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cache-report
        with:
          name: test-store
          log: ${{ runner.temp }}/misses.out
          inputs: '^(runtime/|lib/std/test\.smith|smith\.c|build\.c|\.github/)'
      - name: Pick the Mac's Linux runners
        # the choice is made here, when the 10 jobs that need this build (8 test parts, check-fmt-prove, check-lint) are
        # about to ask for slots, not once at the start of the run (#2259: `changes` saw the pool free and every job
        # ran hosted while parts waited 5 minutes for a slot). In this job, so no job and no slot is added.
        id: pick
        continue-on-error: true
        uses: ./.github/actions/pick-mac
        with:
          token: ${{ secrets.RUNNER_STATUS_TOKEN }}
          github-token: ${{ github.token }}
          fork: false
          linux-jobs: ${{ steps.size.outputs.jobs || '10' }}
      - name: Give each job its runner
        id: runners
        if: ${{ always() }}
        shell: bash
        env:
          MATRIX: ${{ needs.changes.outputs.linux }}
          MAC: ${{ steps.pick.outputs.linux-mac }}
          COUNT: ${{ steps.size.outputs.count }}
        run: |
          # fewer parts than `changes` planned: the same matrix cut to the count sized above (#2833)
          # no answer keeps the parts `changes` made (8 in the queue, 1 in a PR check)
          case "$COUNT" in ''|*[!0-9]*) COUNT=$(printf '%s' "$MATRIX" | jq '.include | length') ;; esac
          MATRIX=$(printf '%s' "$MATRIX" | jq -c --argjson n "$COUNT" \
            '.include |= (map(select(.shard <= $n)) | map(.count = $n))')
          [ "$COUNT" -gt 8 ] && COUNT=8
          # hosted first; the Mac takes the last jobs in this order: parts 8, 7, ..., then lint, then fmt-prove. An empty
          # or failed pick is 0: everything hosted.
          hosted='"ubuntu-latest"'; mac='["self-hosted","Linux","X64"]'
          n=${MAC:-0}; case "$n" in *[!0-9]*) n=0 ;; esac
          [ "$n" -gt 10 ] && n=10
          parts=$(( n > COUNT ? COUNT : n )); rest=$(( n - parts ))
          lint=$hosted; fmt=$hosted
          [ "$rest" -ge 1 ] && lint=$mac
          [ "$rest" -ge 2 ] && fmt=$mac
          matrix=$(printf '%s' "$MATRIX" | jq -c --argjson parts "$parts" --argjson hosted "$hosted" --argjson mac "$mac" \
            '.include |= map(. + {runner: (if .shard > (.count - $parts) then ($mac | tojson) else ($hosted | tojson) end)})') \
            || matrix=$(printf '%s' "$MATRIX" | jq -c --argjson hosted "$hosted" '.include |= map(. + {runner: ($hosted | tojson)})')
          { echo "matrix=$matrix"; echo "lint=$lint"; echo "fmt-prove=$fmt"; } >>"$GITHUB_OUTPUT"
          echo "Linux jobs on the Mac: $n (parts $parts, lint $([ "$lint" = "$mac" ] && echo yes || echo no), fmt-prove $([ "$fmt" = "$mac" ] && echo yes || echo no))" >>"$GITHUB_STEP_SUMMARY"

      - name: The one test part, in this job
        # A queue run whose misses fit in one part runs it here, on the tree just built, not in a `test-linux` job
        # (#2870): the part is no job of its own, restores and rebuilds nothing, and its test time replaces a job's
        # setup. The jobs that need this build start once it ends, which is off the critical path in the queue (the
        # count is longer). A pull request keeps its part in `test-linux`, beside `check-fmt-prove`. A failing test
        # fails the step, not the job, so the checks and the count still run on this build; `ci` reads the outcome.
        id: tests
        if: steps.size.outputs.count == '1' && github.event_name == 'merge_group'
        continue-on-error: true
        uses: ./.github/actions/test-part
        with:
          restore: "false"
          flags: ${{ fromJSON(needs.changes.outputs.linux).include[0].flags }}
      - name: Fail fast
        if: failure() || steps.tests.outcome == 'failure'
        uses: ./.github/actions/fail-fast
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  test-linux:
    # Linux carries the tests (required): hosted shards of `--skip-macos`, each restoring the build of `build-linux` (#1758)
    needs: [changes, pack, build-linux]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.build-linux.result == 'success' && needs.build-linux.outputs.tests == '' && needs.changes.outputs.scope == 'full' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-linux.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
      SMITH_OUTPUT: full
      SMITH_TEST_STATS: "1"
    permissions:
      contents: write # test-cache/save: `gh release create` of this part's test store (#2870)
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/yield-to-queue
      - uses: ./.github/actions/setup-smith
        with:
          artifact: build-linux
      - uses: ./.github/actions/test-part
        with:
          part: ${{ matrix.shard }}
          count: ${{ matrix.count }}
          flags: ${{ matrix.flags }}
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget
  check-fmt-prove:
    # fmt, docs and the proofs on Linux (#2234), beside the test parts: they restore the build of `build-linux` like a
    # shard. They moved off the Mac, where lint and prove were 6 of the 9 minutes of checks; split in two jobs
    # (`check-lint` has the other) so neither is longer than a test part. Stages run one after another (two verbs
    # cannot share one tree) and each runs even when an earlier one failed.
    needs: [changes, pack, build-linux]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.build-linux.result == 'success' && needs.changes.outputs.scope == 'full' }}
    runs-on: ${{ fromJSON(needs.build-linux.outputs.runner-fmt-prove) }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
      SMITH_OUTPUT: full
    permissions:
      contents: read
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/yield-to-queue
      - uses: ./.github/actions/setup-smith
        with:
          artifact: build-linux
      - name: Restore the lint and proof caches
        # main's `warm` saves ONE cache holding both folders (#2237). `actions/cache` puts the path list in the cache
        # version, so a restore naming one folder never finds it ("Cache not found" even for the prefix, #2954): every
        # restore of `smith-lintprove-` names the same two paths, in the same order, as `warm`'s save.
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/smith/lint
            ~/.cache/smith/proofs
          key: smith-lintprove-${{ runner.os }}-${{ github.sha }}
          restore-keys: smith-lintprove-${{ runner.os }}-
      - name: Checks
        shell: bash
        run: |
          failed=0
          stages=("fmt fmt --dry-run --Werror" "docs docs" "prove prove")
          # a PR check is at most 2 Linux jobs at once (#2856): lint runs here after the others, not in `check-lint`.
          # The queue keeps the two jobs side by side, the shorter critical path (lead, 2026-11-08, #2833)
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && stages+=("lint lint")
          for stage in "${stages[@]}"; do
            set -- $stage
            name=$1
            shift
            start=$SECONDS
            code=0
            SMITH_LINT_CACHE=why "$SMITH" "$@" >"$RUNNER_TEMP/$name.log" 2>&1 || code=$?
            echo "took $name $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
            # where a stage's time went (#2985): lint's own line (files run and cached, run and setup seconds), and
            # prove's (build and proof seconds, groups) with the sum of its groups' `N proved, M failed, K cached`
            case $name in
              lint)
                grep 'smith lint: linted [0-9]* files' "$RUNNER_TEMP/lint.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
                # why each file ran (`SMITH_LINT_CACHE=why`), counted by reason
                grep -o 'runs: .*' "$RUNNER_TEMP/lint.log" | sort | uniq -c | tee -a "$GITHUB_STEP_SUMMARY" || true ;;
              prove)
                grep 'smith prove: [0-9]* groups' "$RUNNER_TEMP/prove.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
                awk '/^[0-9]+ proved, [0-9]+ failed/ { p += $1; f += $3; for (i = 1; i <= NF; i++) if ($i == "cached") c += $(i - 1) }
                     END { printf "prove: %d functions proved (%d reused from the cache, %d failed)\n", p, c, f }' \
                  "$RUNNER_TEMP/prove.log" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            esac
            if [ "$code" != 0 ]; then
              tail -n 60 "$RUNNER_TEMP/$name.log"
              echo "FAIL $name"
              echo "::error::smith $name failed"
              failed=1
            else
              echo "ok $name"
            fi
          done
          exit $failed
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  check-lint:
    # `smith lint` on Linux (#2234), beside the test parts and `check-fmt-prove`; the Mac lints too, since each platform sees code the other can't.
    # Not in a PR check, where `check-fmt-prove` lints (#2856)
    needs: [changes, pack, build-linux]
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.build-linux.result == 'success' && needs.changes.outputs.scope == 'full' }}
    runs-on: ${{ fromJSON(needs.build-linux.outputs.runner-lint) }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
      SMITH_OUTPUT: full
    permissions:
      contents: read
      actions: write # queue-guard: `gh run cancel` (#2256)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/queue-guard
      - uses: ./.github/actions/setup-smith
        with:
          artifact: build-linux
      - name: Restore the lint and proof caches
        # the same two paths as `warm`'s save: the path list is part of the cache version (#2954)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/smith/lint
            ~/.cache/smith/proofs
          key: smith-lintprove-${{ runner.os }}-${{ github.sha }}
          restore-keys: smith-lintprove-${{ runner.os }}-
      - name: Lint
        shell: bash
        run: |
          start=$SECONDS
          code=0
          "$SMITH" lint >"$RUNNER_TEMP/lint.log" 2>&1 || code=$?
          echo "took lint $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'linted [0-9]* files' "$RUNNER_TEMP/lint.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$code" != 0 ]; then
            tail -n 60 "$RUNNER_TEMP/lint.log"
            echo "FAIL lint"
            echo "::error::smith lint failed"
          fi
          exit $code
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  ci:
    # the one required check: green when every job that had to run is green; skipped jobs (a change of documents only)
    # do not count against it. It runs when a job failed too, after every job has ended (no job cancels the run).
    needs: [changes, pack, macos, macos-lint, build-linux, test-linux, check-fmt-prove, check-lint, frontend-coverage, release-pack-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      statuses: write # a PR check posts its verdict as the commit status `ci` (#2856)
      actions: write # a failed queue run deletes the release tarballs it kept (#2832)
    steps:
      - uses: actions/checkout@v4 # only the shared shell function and the budget action (git, not REST)
        with:
          sparse-checkout: .github/actions
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Verdict
        id: verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGES: ${{ needs.changes.result }}
          EVENT: ${{ github.event_name }}
          MACOS: ${{ needs.macos.result }}
          MACOS_LINT: ${{ needs.macos-lint.result }}
          MAC_TESTS: ${{ needs.changes.outputs.mac_tests }}
          MAC_RUN: ${{ needs.changes.outputs.mac_run }}
          # the one part a queue run's `build-linux` ran itself, else the parts of `test-linux` (#2870)
          TEST_LINUX: ${{ needs.build-linux.outputs.tests || needs.test-linux.result }}
          CHECK_FMT_PROVE: ${{ needs.check-fmt-prove.result }}
          CHECK_LINT: ${{ needs.check-lint.result }}
          FRONTEND_COVERAGE: ${{ needs.frontend-coverage.result }}
          RELEASE_PACK_MACOS: ${{ needs.release-pack-macos.result }}
          COUNT: ${{ needs.changes.outputs.count }}
          BATCH: ${{ needs.changes.outputs.batch }}
          PRS: ${{ needs.changes.outputs.prs }}
        run: |
          echo "scope: $SCOPE; jobs: $RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = merge_group ]; then echo "batch: $BATCH; tests: $PRS" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          # Fail closed (#2965): only `success` and `skipped` pass. An `abandoned` job (GitHub never created it, as in the
          # outage of 2026-11-09), `failure`, `cancelled`, an empty or any future value fails.
          for r in $RESULTS; do
            case "$r" in
            success | skipped) ;;
            *)
              echo "::error::a CI job's result is '$r', not success or skipped"
              exit 1
              ;;
            esac
          done
          # `changes` decides what is owed: without its scope nothing can be owed, so nothing may pass.
          case "$SCOPE" in
          full | docs | release | none) ;;
          *)
            echo "::error::changes gave no scope ('$SCOPE'; result '$CHANGES'): nothing can be owed"
            exit 1
            ;;
          esac
          if [ "$CHANGES" != success ]; then
            echo "::error::changes gave no scope ('$SCOPE'; result '$CHANGES'): nothing can be owed"
            exit 1
          fi
          # A skipped job passes only where `changes` said the area was not touched (#1139). The scope says which jobs
          # the run owes: `full` owes macos, test-linux, check-fmt-prove and check-lint, `docs` owes macos, `release` (a push to main,
          # whose commit the queue already tested) owes no tests, `none` owes nothing. A job that was owed and skipped (a skipped `pack` skipped the three
          # macOS jobs for hours) fails the check.
          case "$SCOPE" in
          full) owed="MACOS MACOS_LINT TEST_LINUX CHECK_FMT_PROVE CHECK_LINT" ;;
          docs) owed="MACOS" ;;
          release) owed="" ;;
          *) owed="" ;;
          esac
          # `macos` is owed wherever it runs; a PR check whose diff cannot reach the Mac's code runs it as a build only
          # (#2822, #2832), which is still owed
          if [ "$MAC_RUN" = false ]; then owed=${owed/MACOS/}; fi
          # `macos-lint` runs only where the Mac's tests run (#3045)
          if [ "$MAC_RUN" = false ] || [ "$MAC_TESTS" != true ]; then owed=${owed/MACOS_LINT/}; fi
          # a PR check lints in `check-fmt-prove`, so it owes no `check-lint` (#2856)
          if [ "$EVENT" = workflow_dispatch ]; then owed=${owed/CHECK_LINT/}; fi
          # a full merge group also owes the count (owner, 2026-11-06): it measures the commit main moves to
          # so does the nightly run (#2955), whose count is compared with the cached one
          if [ "$SCOPE" = full ] && { [ "$EVENT" = merge_group ] || [ "$EVENT" = schedule ]; }; then owed="$owed FRONTEND_COVERAGE"; fi
          # a full merge group builds the release main will publish (#2832): one that does not build fails the entry
          if [ "$SCOPE" = full ] && [ "$EVENT" = merge_group ]; then owed="$owed RELEASE_PACK_MACOS"; fi
          # a PR check owes it when its diff reaches what the count reads (#2914)
          if [ "$SCOPE" = full ] && [ "$EVENT" = workflow_dispatch ] && [ "$COUNT" = true ]; then owed="$owed FRONTEND_COVERAGE"; fi
          for name in $owed; do
            eval "result=\$$name"
            if [ "$result" != success ]; then
              echo "::error::$name was owed by scope $SCOPE and its result is '$result', not success"
              exit 1
            fi
          done
      # The ruleset does not count a `ci` check run from a `workflow_dispatch` run (#2857 stayed `blocked` with it green),
      # so a PR check also posts its verdict as the commit status `ci` on the PR head, created by GitHub Actions (15368).
      # Only once every job before it ran: a cancelled or abandoned job (a lost job, #2965) posts nothing, and the next pass restarts
      # the check; the verdict above already fails a run in which a job that was owed was skipped.
      - name: Post the verdict as the commit status `ci`
        if: >-
          always() && github.event_name == 'workflow_dispatch' && !cancelled()
          && !contains(join(needs.*.result, ' '), 'cancelled') && !contains(join(needs.*.result, ' '), 'abandoned')
          && (steps.verdict.outcome == 'success' || steps.verdict.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.verdict.outcome }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh_retry gh api -X POST "repos/$GH_REPO/statuses/$GITHUB_SHA" -f context=ci -f state="$STATE" -f target_url="$URL" \
            -f description="PR check #${{ inputs.pr }}: $STATE in $URL" --silent
          echo "commit status ci: $STATE on ${GITHUB_SHA:0:7} ($URL)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A failed queue run keeps no release
        # its tarballs (`stage0-<commit>-*` artifacts) are deleted, so nothing that looks like a release of a commit that
        # failed is left; the push to main also takes them only from a run whose `ci` passed (#2832)
        if: always() && github.event_name == 'merge_group' && steps.verdict.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh_retry gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[]|select(.name|startswith("stage0-"))|.id'); do
            gh_retry gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" && echo "deleted artifact $id"
          done
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  warm:
    # a push to main (a commit the queue checked) builds smith and the tests once more only to save the step cache,
    # which every pull request and queue entry after it restores (a cache saved on a branch is seen by that branch and
    # the ones made from it, and main's by all: so only main saves, which keeps the entries few). One for each OS: the
    # Linux shards restored `none` until this job saved a Linux entry, and built smith from nothing in each of 6 jobs
    # It waits for `publish` and its setup names the stage0 of this very commit, which is the one every job after it
    # fetches: a compile step's key holds the digest of the smith that runs it, so a cache built with the stage0
    # before served 23 of 319 steps (#2833; warm used stage0-b2dc5ea at 06:20Z, build-linux stage0-a42cac3 at 06:38Z).
    # Fetching the cache's stage0 in the jobs instead would cost no wait but break the lag rule
    # (knowledge/smith-bootstrap.md): a commit using a feature of the one before would be built by a release without it.
    # Waiting was not enough by itself: fetch-smith's release list left the newest out (run 42601821786 got
    # stage0-d6bcd6c 2 s after stage0-78a4f9a was published), so the setup names the tag.
    # `always()`: a pull request's dry run (no release) warms with the newest published stage0; on a push, a release
    # that never publishes fails this job rather than save a cache built with another smith
    needs: [changes, release, release-linux, publish]
    # (a pull request that changes this job runs it as a dry run, Linux only: DRY_RUN=1, #2769)
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.warm == 'true'
    strategy:
      # one OS failing must not cancel the other: a Mac step that failed cancelled the Linux job, so main saved no
      # Linux cache from 01:48Z to 03:50Z on 2026-11-09 (#2826)
      fail-fast: false
      matrix:
        # each OS saves the cache of what its jobs build: the Mac builds only its `--macos-only` tests
        os: ${{ fromJSON(needs.changes.outputs.warm_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: write # the release-asset step replaces the assets of the rolling `step-cache` prerelease (#2755)
      actions: read # ... and reads the count's artifact of this commit
      issues: write # the timing step rewrites the body of #2751
    env:
      GH_TOKEN: ${{ github.token }}
      # every step that writes outside the job (cache, release, issue body) is skipped when this is 1, and prints what it
      # would have written to the step summary instead
      DRY_RUN: ${{ github.event_name != 'push' && '1' || '0' }}
    steps:
      - name: Say which job the stage0 comes from
        # on a push, a `publish` that did not succeed means no release of this commit will appear: say so at once and in one
        # line, instead of waiting 6 minutes in fetch-smith for it (#2976). The Mac's warm also needs the macOS tarball.
        if: github.event_name == 'push' && (needs.publish.result != 'success' || (runner.os == 'macOS' && needs.publish.outputs.mac != 'true'))
        run: |
          echo "warm: stage0-$GITHUB_SHA is not published: job publish ${{ needs.publish.result }} (macOS tarball ${{ needs.publish.outputs.mac }}; release ${{ needs.release.result }}, release-linux ${{ needs.release-linux.result }})" | tee -a "$GITHUB_STEP_SUMMARY" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - uses: ./.github/actions/setup-smith
        with:
          tests: "true"
          # its own commit's release by name, not whatever the release list calls the newest (#2833)
          stage0: ${{ github.event_name == 'push' && format('stage0-{0}', github.sha) || '' }}
          test-flags: ${{ matrix.os == 'macos-26' && format('--macos-only --shard 1/1 --costs {0}/.github/shard-costs.tsv', github.workspace) || '' }}
      - name: Fetch what the test jobs download (#2825)
        # Linux only: `smith build nvim` fetches Neovim for Linux x86_64 and fails on a Mac, and the jobs that restore
        # this cache (the test parts, check-fmt-prove, check-lint, release-linux) are all Linux
        if: runner.os == 'Linux'
        # the test parts take the build of `build-linux` and so restore no step cache; they restore the small
        # `smith-tools-` cache saved below instead, which must hold every package they would fetch from github.com:
        # the tree-sitter CLI (the build above fetched it) and the Neovim release (`smith build nvim`)
        shell: bash
        run: |
          "$SMITH" build nvim | tail -n 1
          du -sh ~/.cache/smith/packages ~/.cache/smith/tools | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the packages and tools
        # about 60 MB: every job that restores a build rather than making it reads this, so no job reaches github.com
        # for a package the cache holds (a 504 hour kept #2798 out of the queue for hours, #2825)
        if: env.DRY_RUN != '1' && runner.os == 'Linux'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/smith/packages
            ~/.cache/smith/tools
          key: smith-tools-${{ runner.os }}-${{ github.sha }}
      - name: Let the next build prune the step cache (#2833)
        # the folder is kept within `step-cache-max` of setup-smith, the least recently used first, by the prune a build
        # starts with, at most once an hour. The stamp of that check is saved with the folder, so a warm within the hour
        # of the one before would skip it and the folder would grow: it is left out of the save, and the next warm (or
        # any job that restores this) prunes at its first build
        if: env.DRY_RUN != '1'
        shell: bash
        run: |
          rm -f ~/.cache/smith/steps/prune.timestamp
          echo "step cache saved: $(du -sm ~/.cache/smith/steps | cut -f1) MB, $(find ~/.cache/smith/steps/m -type f | wc -l) manifests" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the step cache
        if: env.DRY_RUN != '1'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/smith/steps
            ~/.cache/smith/packages
            ~/.cache/smith/tools
          key: smith-steps-${{ runner.os }}-${{ github.sha }}
      - name: Upload the step cache for cloud runners
        # the Actions cache cannot be read from outside Actions, so a cloud runner (smith-dev-runner, step 3) downloads
        # the same folder as an artifact. Only this job on main writes it; 3 days keep it inside free storage, and the
        # folder is already pruned to SMITH_CACHE_MAX by the build above (#2690)
        if: runner.os == 'Linux' && env.DRY_RUN != '1'
        uses: actions/upload-artifact@v4
        with:
          name: smith-steps-linux-${{ github.sha }}
          path: ~/.cache/smith/steps
          retention-days: 3
          compression-level: 1
          if-no-files-found: warn
      - name: Publish the step cache and the count's table as release assets
        # a cloud runner cannot download an Actions artifact (its zip is served from a host the session's proxy refuses
        # by name), but it can download a release asset. The repository's releases are immutable (a release takes its
        # assets when it is created and never again, #2772), so each push to main creates its own prerelease
        # `step-cache-<sha7>` (never `stage0-*`, never "latest") with all its assets in the one `gh release create` call:
        # smith-steps-linux.tar.gz.NN (the step folder, gzip, cut in parts under the 2 GiB an asset may hold; join
        # them in order), smith-steps-linux.sha (the commit it was built from) and, when the queue run of this commit
        # made one, frontend-coverage.tar.gz (the count's per-file table) and count-fixed.tar.zst (its fixed files, #2942). The 3 newest releases stay. A failure here
        # must not fail main's push
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          out="$RUNNER_TEMP/assets"; mkdir -p "$out"
          tar -C ~/.cache/smith/steps -c . | gzip -1 | split -b 1900M -d - "$out/smith-steps-linux.tar.gz."
          echo "$GITHUB_SHA" >"$out/smith-steps-linux.sha"
          files=("$out"/smith-steps-linux.tar.gz.* "$out/smith-steps-linux.sha")
          # the queue run of this very commit saved the count (a documents-only merge runs none)
          id=$(GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=frontend-coverage-$GITHUB_SHA&per_page=5" --jq '[.artifacts[]|select(.expired|not)][0].id // empty')
          if [ -n "$id" ]; then
            GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" >"$out/c.zip"
            mkdir "$out/c"; unzip -q "$out/c.zip" -d "$out/c"
            echo "$GITHUB_SHA" >"$out/c/sha"
            tar -C "$out/c" -c . | gzip -1 >"$out/frontend-coverage.tar.gz"
            files+=("$out/frontend-coverage.tar.gz")
          fi
          # the fixed tree the count checked (#2942), at its tree paths, for a session to read the lines its errors name
          tid=$(GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=count-fixed-tree-$GITHUB_SHA&per_page=5" --jq '[.artifacts[]|select(.expired|not)][0].id // empty')
          if [ -n "$tid" ]; then
            GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$tid/zip" >"$out/t.zip"
            mkdir "$out/t"; unzip -q "$out/t.zip" -d "$out/t"
            mv "$out/t/count-fixed.tar.zst" "$out/count-fixed.tar.zst"
            files+=("$out/count-fixed.tar.zst")
          fi
          # the fixed files and rows of the count (#2832) are the release `count-fixed-<sha7>` of the queue run (`count-fixed-save`)
          ls -l "${files[@]}" | awk '{print $5, $9}'
          if [ "$DRY_RUN" = 1 ]; then
            { echo "### Dry run: would create release \`step-cache-${GITHUB_SHA:0:7}\` with these assets, then keep the 3 newest"; echo '```'; ls -l "${files[@]}" | awk '{print $5, $9}'; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="step-cache-${GITHUB_SHA:0:7}"
          if ! GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "${files[@]}" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "step cache $tag" --notes "Main's step cache and the count's table at $GITHUB_SHA (#2772). Not a release of smith."
          fi
          # keep the 3 newest (the old rolling `step-cache` of #2755 goes first); a refused delete only warns
          GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[]|select(.tagName|test("^step-cache-"))]|sort_by(.createdAt)|reverse|.[3:]|.[].tagName' |
            while read -r old; do
              gh release delete "$old" --cleanup-tag --yes || echo "::warning::could not delete release $old"
            done
          gh release delete step-cache --cleanup-tag --yes 2>/dev/null || true
          echo "published $tag" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restore the lint and proof caches
        # Linux only: the checks that restore them run on Linux (`check-lint`, `check-fmt-prove`, #2237). The newest
        # entry is the last main's, so the runs below only redo what the merge changed
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/smith/lint
            ~/.cache/smith/proofs
          key: smith-lintprove-${{ runner.os }}-${{ github.sha }}
          restore-keys: smith-lintprove-${{ runner.os }}-
      - name: Fill the lint and proof caches
        # a failure here must not fail main's push: the queue already checked this commit, and the entries that did
        # complete are still worth saving
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          "$SMITH" lint >"$RUNNER_TEMP/lint.log" 2>&1 || true
          grep 'linted [0-9]* files' "$RUNNER_TEMP/lint.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          "$SMITH" prove >"$RUNNER_TEMP/prove.log" 2>&1 || true
          tail -n 3 "$RUNNER_TEMP/prove.log" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh ~/.cache/smith/lint ~/.cache/smith/proofs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the lint and proof caches
        if: runner.os == 'Linux' && env.DRY_RUN != '1' && always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/smith/lint
            ~/.cache/smith/proofs
          key: smith-lintprove-${{ runner.os }}-${{ github.sha }}
      - name: Time the build (tracked on #2751)
        # Linux only, after every cache is saved, so the timing never changes what is saved or delays it. It records
        # numbers and gates nothing: a failure here must not fail main's push. Hosted runners vary by about 15%
        # (knowledge/build-times.md, Tracked on main). The result goes to #2751's body, never a comment. The cold case moves build/, .smith/ (not stage0/) and the step
        # cache aside; the cases after it reuse the cold tree, and the originals go back at the end.
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -u
          aside="$RUNNER_TEMP/aside"; mkdir -p "$aside/smith-dir"
          # $SMITH lives in build/, which the cold case moves aside: time with a copy of it
          cp "$SMITH" "$RUNNER_TEMP/smith-timed"; timed="$RUNNER_TEMP/smith-timed"
          log="$RUNNER_TEMP/time"; : >"$log.cold"
          [ -d build ] && mv build "$aside/build"
          for f in .smith/* .smith/.[!.]*; do
            [ -e "$f" ] && [ "$f" != .smith/stage0 ] && mv "$f" "$aside/smith-dir/"
          done
          [ -d ~/.cache/smith/steps ] && mv ~/.cache/smith/steps "$aside/steps"
          run() { # run <case>: wall seconds into $secs, --time output into $log.<case>
            local t0=$SECONDS
            "$timed" build --time >"$log.$1" 2>&1 || true
            secs=$((SECONDS - t0))
          }
          run cold;    cold=$secs
          run noop;    noop=$secs
          echo '# timing' >>front/types_expr.smith
          run front;   front=$secs
          git checkout -- front/types_expr.smith
          echo '/* timing */' >>runtime/executor.c
          run runtime; runtime=$secs
          git checkout -- runtime/executor.c
          rm -rf build; find .smith -mindepth 1 -maxdepth 1 ! -name stage0 -exec rm -rf {} +
          rm -rf ~/.cache/smith/steps
          [ -d "$aside/build" ] && mv "$aside/build" build
          for f in "$aside"/smith-dir/* "$aside"/smith-dir/.[!.]*; do [ -e "$f" ] && mv "$f" .smith/; done
          [ -d "$aside/steps" ] && mv "$aside/steps" ~/.cache/smith/steps
          slow=$(grep -E '^time: +step ' "$log.cold" | sed 's/^time: *//' | head -n 10)
          {
            echo "### Build times (dev profile, hosted ubuntu-latest, about 15% run to run)"
            echo "| case | wall s |"; echo "|---|---|"
            echo "| cold | $cold |"; echo "| no-op | $noop |"
            echo "| front/ edit | $front |"; echo "| runtime/ edit | $runtime |"
            echo; echo "Slowest steps of the cold build:"; echo '```'; echo "$slow"; echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # the tracking issue's body is the only record (no comments): the text above `<!-- latest -->` stays, the
          # latest table replaces what follows it, and the last 10 one-line rows are kept under `<!-- rows -->`
          row="- \`$(git rev-parse --short=7 HEAD)\` $(date -u +%F) cold=$cold noop=$noop front=$front runtime=$runtime"
          old=$(gh api repos/${{ github.repository }}/issues/2751 --jq .body)
          head=${old%%<!-- latest -->*}
          rows=$(printf '%s\n' "$old" | sed -n '/<!-- rows -->/,$p' | sed 1d | grep '^- `' | head -n 9 || true)
          {
            printf '%s\n' "$head<!-- latest -->"
            echo "Latest, \`$(git rev-parse --short=7 HEAD)\` $(date -u +%F): cold $cold s, no-op $noop s, front/ edit $front s, runtime/ edit $runtime s. Slowest steps of the cold build:"
            echo '```'; echo "$slow"; echo '```'
            echo "<!-- rows -->"; echo "$row"; if [ -n "$rows" ]; then echo "$rows"; fi
          } >"$RUNNER_TEMP/body.md"
          if [ "$DRY_RUN" = 1 ]; then
            { echo "### Dry run: would write this as the body of #2751"; echo; cat "$RUNNER_TEMP/body.md"; } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api -X PATCH repos/${{ github.repository }}/issues/2751 -F body=@"$RUNNER_TEMP/body.md" >/dev/null
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  release-pack-macos:
    # a queue run builds the macOS release of the commit it tests (#2832, knowledge/release.md): the merge queue moves
    # main to that very commit, so the push to main only publishes these tarballs (`publish`) instead of building smith
    # a third time. Beside the other jobs, not after them; `ci` owes it, so a release that does not build fails the
    # queue run. The tarball and its checksum are this run's artifact `stage0-<commit>-darwin-arm64` (3 days); a failed
    # run deletes its artifacts (`ci`), and `changes` of the push takes them only from a run whose `ci` passed.
    # Built as the fallback `release` below builds: setup-smith's release profile, by the newest stage0.
    needs: [changes, pack]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.changes.outputs.scope == 'full' }}
    runs-on: macos-26
    # the push run's `release` took 16 min (run 42857983618); the limit counts time queued for a macOS slot
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - uses: ./.github/actions/setup-smith
        timeout-minutes: 40
        with:
          profile: release
      - name: Package the release
        run: |
          start=$SECONDS
          "$SMITH" version | grep -q "commit $GITHUB_SHA\$" || { echo "::error::$SMITH is not the smith of $GITHUB_SHA"; "$SMITH" version; exit 1; }
          out="$RUNNER_TEMP/stage0"; mkdir -p "$out"
          # the release tool (build.c's `release-tool`, compiled by the smith just built, as there)
          "$SMITH" cc -w -I include -I .smith/include release/publish.smith lib/std/files.smith lib/std/console.smith \
              lib/std/format.smith lib/std/mem.smith lib/std/arena.smith lib/std/contract.smith lib/std/env.smith \
              lib/std/text.smith lib/std/process.smith lib/std/clock.smith lib/handlers.c lib/trace.c lib/optimize_asm.c \
              -o "$out/release"
          "$out/release" package "$SMITH" "$out"
          rm "$out/release"
          ls -l "$out"
          echo "took package $((SECONDS - start))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the tarball for the push to main
        uses: actions/upload-artifact@v4
        with:
          name: stage0-${{ github.sha }}-darwin-arm64
          path: ${{ runner.temp }}/stage0
          compression-level: 0
          retention-days: 3
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  release:
    # a push to main (the merge queue's checked commit) publishes the stage0 release stage0-<commit>
    # (knowledge/release.md), which the next jobs' setup builds from. The queue run of this commit built its tarball
    # (`release-pack-macos`, #2832), so this job runs only when that tarball is missing (a push that did not come
    # through the queue, an expired artifact): it builds the macOS tarball as the queue does and puts it into the draft,
    # and the `publish` job publishes the draft (releases are immutable once published)
    needs: changes
    if: needs.changes.outputs.scope == 'release' && needs.changes.outputs.mac_packed != 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-macos
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - uses: ./.github/actions/setup-smith
        with:
          # the release profile in the default folder, as the queue run builds it (#2832): `-DPROFILE=release release`
          # then publishes this very binary and builds no second one
          profile: release
      - name: Release
        # `smith build release` prints no per-stage output to read, so only the whole command is timed (#2971)
        run: |
          start=$SECONDS
          code=0
          "$SMITH" build -DPROFILE=release release || code=$?
          echo "took release $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  release-linux:
    # the same draft release gets the Linux tarball (`release publish`, release/publish.smith, adds it to the draft the other job made). `publish` publishes without this
    # job's tarball when it fails, so `install` never waits for Linux. Only when the queue run of this commit left no
    # Linux tarball (`frontend-coverage-fix` packs it, #2832): the fallback, built the same way.
    needs: changes
    if: needs.changes.outputs.scope == 'release' && needs.changes.outputs.linux_packed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-linux
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Install lld
        run: sudo apt-get install -y -q lld
      - uses: ./.github/actions/setup-smith
        with:
          # the release profile in the default folder, as the queue run builds it (#2832): `-DPROFILE=release release`
          # then publishes this very binary and builds no second one
          profile: release
      - name: Release
        # `smith build release` prints no per-stage output to read, so only the whole command is timed (#2971)
        run: |
          start=$SECONDS
          code=0
          "$SMITH" build -DPROFILE=release release || code=$?
          echo "took release $((SECONDS - start))s (exit $code)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  frontend-coverage-fix:
    # the fixing of the count, done once (#2832). Each of the eight shards used to fix every tracked file (a file reads
    # modules that must already be in the new syntax), so the whole tree was fixed eight times and the fix phase was
    # most of a shard's 15 to 26 minutes. This job fixes the tree once, starting from the fixed files main last saved
    # (`count-fixed.tar.gz`, an asset of the newest `count-fixed-*` release, written by `count-fixed-save` below from
    # the artifact of this job and the rows of the parts), and hands the folder to the shards as an artifact. A fixed file is cached under a key of
    # what it depends on (the file, every module it imports, the C headers and the objects the fixer is built from,
    # #2309, #2632), so an entry never changes a result: a stale or missing entry is only fixed again.
    # It builds the release profile (-O2, #2684) of smith itself, which `build-linux-release` did in a job of its own: the
    # count runs the smith it measures, and the dev build of `build-linux` (-O0) made six of eight shards hit their
    # timeout (queue run 42349047932). When at most one part is left to measure (a warm run) it also counts, here, and the
    # count of a queue run is this job, the merge and the gate (3 jobs); a cold one packs the build for the shards.
    needs: [changes, pack]
    if: ${{ !cancelled() && needs.changes.outputs.count == 'true' && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && needs.changes.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    # 60: a cold fix (a key change, or a change to front/) took 25 to 30 minutes on 2026-11-09 and a 30-minute limit
    # failed whole queue groups (#2786's run, #2874's group); the build of smith that `build-linux-release` did is in it now
    timeout-minutes: 60
    outputs:
      # the shards sized from the rows left to measure (#2832): 1 to 8 parts, one eighth of the tree each when cold
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      # a PR check measures a sample (#2914): the first two parts only, and the rows it was owed
      sampled: ${{ steps.plan.outputs.sampled }}
      missed: ${{ steps.plan.outputs.missed }}
    permissions:
      contents: write # test-cache/save: `gh release create` of the import cache this job made (#2891)
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - name: Install lld
        run: sudo apt-get install -y -q lld
      - uses: ./.github/actions/setup-smith
        with:
          profile: release
      - name: Package the release of this commit, in the background
        # a queue run's Linux release (#2832): this build is the release profile, so it is packed as the push to main
        # would build it (`release-linux`), and `publish` publishes it with the macOS one. In the background, so the
        # count does not wait: `smith cc` and tar, no `smith build` (two in one tree collide on .smith/build.ninja)
        if: github.event_name == 'merge_group'
        run: |
          "$SMITH" version | grep -q "commit $GITHUB_SHA\$" || { echo "::error::$SMITH is not the smith of $GITHUB_SHA"; "$SMITH" version; exit 1; }
          out="$RUNNER_TEMP/stage0"; mkdir -p "$out"
          export out
          nohup bash -c 'set -e; start=$SECONDS
            # the release tool (the task `release-tool` of build.c, compiled by the smith just built, as there); it stays
            # in the artifact: `publish` runs it to add the tarballs to the draft
            "$SMITH" cc -w -I include -I .smith/include release/publish.smith lib/std/files.smith lib/std/console.smith lib/std/format.smith lib/std/mem.smith lib/std/arena.smith lib/std/contract.smith lib/std/env.smith lib/std/text.smith lib/std/process.smith lib/std/clock.smith lib/handlers.c lib/trace.c lib/optimize_asm.c -o "$out/release"
            "$out/release" package "$SMITH" "$out"
            echo "took package $((SECONDS - start))s"' >"$RUNNER_TEMP/pack.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/pack.pid"
      - name: API budget (before test-cache)
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} before test-cache
      - uses: ./.github/actions/test-cache
        # the import cache only (#2891): std's trees and the headers of the release smith's identity, which only the
        # count's jobs publish; its own set (#2939)
        with:
          tests: "false"
          fresh: ${{ needs.changes.outputs.uncached }}
          imports-from: count
      - name: API budget (after test-cache)
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} after test-cache
      - name: Check the objects the count's key leaves out
        # an object left out must hold only another verb's code (#2832, #2854): this fails when something else calls it
        shell: bash
        run: |
          # the objects `unrelated_object` in scripts/frontend_coverage/main.smith leaves out of the key hold only another
          # verb's code: nothing outside them and the two dispatchers (smith.o, rt_runtime_verbs.o) calls a symbol they define,
          # and the list here is the list there
          source="$PWD/scripts/frontend_coverage/main.smith"
          cd "$(dirname "$SMITH")"
          exact="rt_runtime_docs.o rt_smith_protocol_dap.o rt_smith_protocol_mcp.o lldb_dap_shim.o lldb_server_shim.o"
          listed=$(sed -n '/static Bool unrelated_object/,/^}/p' "$source" | grep -o '"[a-z_]*\.o"' | tr -d '"' | sort | tr '\n' ' ')
          want=$(echo $exact | tr ' ' '\n' | sort | tr '\n' ' ')
          [ "$listed" = "$want" ] || { echo "::error::the excluded objects here ($want) differ from unrelated_object ($listed)"; exit 1; }
          excluded=$(for o in $exact rt_runtime_mcp*.o front_lsp_*.o; do [ -f "$o" ] && echo "$o"; done | tr '\n' ' ')
          defined=$(mktemp)
          nm -g --defined-only $excluded | awk 'NF == 3 && $2 ~ /^[TDRBSVW]$/ {print $3}' | sort -u >"$defined"
          status=0
          for o in *.o; do
            case " $excluded " in *" $o "*) continue ;; esac
            case "$o" in smith.o | rt_runtime_verbs.o) continue ;; esac
            hits=$(nm -u "$o" 2>/dev/null | awk 'NF == 2 {print $2}' | sort -u | comm -12 - "$defined" | head -n 5 | tr '\n' ' ')
            if [ -n "$hits" ]; then echo "::error::$o calls $hits(defined in an object left out of the count's key)"; status=1; fi
          done
          [ "$status" = 0 ] && echo "$(echo $excluded | wc -w) objects left out of the key, no caller outside the verbs' own code"
          exit $status
      - name: Restore main's fixed files
        # a failure only leaves the fix cold. The nightly count (#2955) restores nothing: its rows are measured fresh
        if: ${{ needs.changes.outputs.uncached != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .smith/frontend-coverage/fixed
          # Looked up by tag, never by listing: the repository has hundreds of releases and the list is in no order of
          # date, so its first 30 held none of these (#2974). Newest first along the first parents of HEAD, count-fixed
          # before step-cache, 20 commits back at most.
          d=$(mktemp -d); tag=; asset=; id=; back=0
          for prefix in count-fixed step-cache; do
            k=0
            for sha in $(git rev-list --first-parent -n 21 HEAD); do
              t="$prefix-${sha:0:7}"
              # a 404 makes gh exit non-zero but still print the error body to stdout: `|| a=` drops it (#2974)
              a=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$t" --jq '[.assets[]|select(.name=="count-fixed.tar.zst" or .name=="count-fixed.tar.gz")]|sort_by(.name)|reverse|.[0]|select(.)|"\(.id) \(.name)"' 2>/dev/null) || a=
              if [ -n "$a" ]; then tag=$t; id=${a% *}; asset=${a#* }; back=$k; break 2; fi
              k=$((k + 1))
            done
          done
          if [ -z "$tag" ]; then echo "fixed files: none in the last 20 commits"; exit 0; fi
          # by the asset's id from the lookup above: `gh release download` looked the tag up again and failed with
          # "release not found" on the queue run of #2975 (the step then counted cold)
          echo "fixed files: found $asset in $tag ($back commits back)"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" >"$d/$asset"
          case "$asset" in
            *.zst) tar -x --zstd -C .smith/frontend-coverage -f "$d/$asset" ;;
            *) tar -xz -C .smith/frontend-coverage -f "$d/$asset" ;;
          esac
          echo "fixed files: $(ls .smith/frontend-coverage/fixed | wc -l) restored from $tag ($back commits back)"
      - name: Fix the tree
        shell: bash
        run: |
          "$SMITH" build frontend-coverage -Dfix_only=1 -Dsmith="$SMITH" 2>&1 | tee "$RUNNER_TEMP/fix.txt"
          {
            echo "### Count: fixed files"
            echo '```'
            grep -E 'frontend_coverage: (fix phase|fixer cache|rows to measure)' "$RUNNER_TEMP/fix.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Size the shards
        id: plan
        shell: bash
        run: |
          # a part measures at most an eighth of the tree: a cold count is 8 parts as before, a warm one is 1 or 2
          read -r missing total < <(sed -n 's/^frontend_coverage: rows to measure: \([0-9]*\) of \([0-9]*\)$/\1 \2/p' "$RUNNER_TEMP/fix.txt" | tail -n 1)
          n=8
          if [ -n "${total:-}" ] && [ "$total" -gt 0 ]; then n=$(( (8 * missing + total - 1) / total )); fi
          [ "$n" -lt 1 ] && n=1
          [ "$n" -gt 8 ] && n=8
          # A PR check (#2914) runs the first two parts of a count that has more: about a quarter of the rows, spread over
          # the tree as the parts split it. All eight would cost the 65 runner-minutes of a cold queue run out of the
          # 20 shared jobs, for a count the queue repeats on the very commit anyway.
          # The nightly count (#2955) is never sampled: all the parts, measured with no cache.
          run=$n; sampled=false
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ needs.changes.outputs.uncached }}" != true ] && [ "$n" -gt 2 ]; then run=2; sampled=true; fi
          echo "count=$n" >>"$GITHUB_OUTPUT"
          echo "sampled=$sampled" >>"$GITHUB_OUTPUT"
          echo "missed=${missing:-0}" >>"$GITHUB_OUTPUT"
          echo "shards=$(seq -s, 1 "$run" | sed 's/^/[/;s/$/]/')" >>"$GITHUB_OUTPUT"
          echo "count parts: $n, run: $run (rows to measure ${missing:-?} of ${total:-?})" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Count the rows left, here
        # one part or none left (a warm run): measured in this job, as part 1 of 1, so no shard job runs
        if: ${{ steps.plan.outputs.count == '1' }}
        # never fails the job: the status is read by the merge job, whatever happened here
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/coverage"
          touch "$RUNNER_TEMP/before-count"
          "$SMITH" build frontend-coverage -Dshard=1/1 -Dsmith="$SMITH" >"$RUNNER_TEMP/coverage/output.txt" 2>&1
          echo "status: $?" >>"$RUNNER_TEMP/coverage/output.txt"
          cp .smith/frontend-coverage/results.tsv "$RUNNER_TEMP/coverage/results.tsv" 2>/dev/null
          mkdir -p "$RUNNER_TEMP/rows"
          find .smith/frontend-coverage/fixed -name '*.row' -newer "$RUNNER_TEMP/before-count" -exec cp {} "$RUNNER_TEMP/rows/" \; 2>/dev/null
          # the lines that say where the time went, in the job log too (the output file is an artifact nobody can download)
          grep -E 'frontend_coverage: (fix phase|fixer cache|rows to measure|row cache|compile phase)' "$RUNNER_TEMP/coverage/output.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Save the rows of the count here
        if: ${{ steps.plan.outputs.count == '1' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: count-rows-${{ github.sha }}-1
          path: ${{ runner.temp }}/rows
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 3
      - name: Save the part counted here
        if: ${{ steps.plan.outputs.count == '1' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-shard-${{ github.sha }}-1
          path: ${{ runner.temp }}/coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Wait for the release package
        # the background step above; a package that failed fails the job, and with it the queue run (#2832)
        if: github.event_name == 'merge_group'
        run: |
          pid=$(cat "$RUNNER_TEMP/pack.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/pack.log"
          [ -s "$RUNNER_TEMP/stage0/smith-linux-x86_64.tar.xz.sha256" ] && [ -x "$RUNNER_TEMP/stage0/release" ] \
            || { echo "::error::the Linux release of $GITHUB_SHA was not packaged"; exit 1; }
          grep 'took package' "$RUNNER_TEMP/pack.log" >>"$GITHUB_STEP_SUMMARY" || true
      - name: Keep the tarball for the push to main
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@v4
        with:
          name: stage0-${{ github.sha }}-linux-x86_64
          path: ${{ runner.temp }}/stage0
          compression-level: 0
          retention-days: 3
      - name: Pack the build for the shards
        if: ${{ steps.plan.outputs.count != '1' }}
        shell: bash
        run: tar -c --zstd -f "$RUNNER_TEMP/build.tar.zst" build .smith
      - name: Save the build for the shards
        if: ${{ steps.plan.outputs.count != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-release
          path: ${{ runner.temp }}/build.tar.zst
          compression-level: 0
          retention-days: 1
      - name: Pack the fixed tree for sessions (#2942)
        # the files as the count checks them, at their tree paths: its errors give lines of this form. `warm` attaches
        # the tarball to the commit's release, where a cloud session can download it
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fixed-tree"
          tar -C .smith/frontend-coverage/tree --exclude=compile_commands.json -c --zstd -f "$RUNNER_TEMP/fixed-tree/count-fixed.tar.zst" .
      - name: Save the fixed tree
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: count-fixed-tree-${{ github.sha }}
          path: ${{ runner.temp }}/fixed-tree
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - name: Save the fixed files
        uses: actions/upload-artifact@v4
        with:
          name: count-fixed-${{ github.sha }}
          path: .smith/frontend-coverage/fixed
          compression-level: 1
          retention-days: 3
      - name: Publish the import cache
        # `test-cache-<sha7>-count`, queue runs only, and the hits of the fix and of a count done here
        if: always()
        uses: ./.github/actions/test-cache/save
        with:
          name: count
          tests: "false"
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  frontend-coverage-shard:
    # one eighth of the count (#2697): `smith build frontend-coverage -Dshard=<k>/<n>` (n from the rows left, #2832) fixes and compiles the tracked files
    # whose path hashes to k - 1 modulo 8, and the modules they import, so each file's row is the row of the whole
    # count. The job `frontend-coverage` below joins the eight tables and gates the merge. The count was one job of 27
    # minutes in the queue (run 42329457015) against about 12 for build, lint and the test shards.
    # only when two or more parts are left to measure: with one or none, `frontend-coverage-fix` counted them itself
    needs: [changes, frontend-coverage-fix]
    if: ${{ !cancelled() && needs.frontend-coverage-fix.result == 'success' && needs.frontend-coverage-fix.outputs.count != '1' && needs.changes.outputs.count == 'true' && needs.changes.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.frontend-coverage-fix.outputs.shards) }}
    permissions:
      contents: write # test-cache/save: `gh release create` of the import cache this shard made (#2891)
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - name: Install lld
        run: sudo apt-get install -y -q lld
      - uses: ./.github/actions/setup-smith
        with:
          artifact: build-linux-release
      - name: API budget (before test-cache)
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} before test-cache
      - uses: ./.github/actions/test-cache
        # the import cache only (#2891), of the release smith's identity: this shard's set and the fix job's (#2939)
        with:
          tests: "false"
          fresh: ${{ needs.changes.outputs.uncached }}
          imports-from: count count-${{ matrix.shard }}
      - name: API budget (after test-cache)
        uses: ./.github/actions/api-budget
        with:
          label: ${{ github.workflow }}/${{ github.job }} after test-cache
      - name: Fetch the fixed files
        # from `frontend-coverage-fix`: the shard then only reuses them (its fixer cache is all hits) and compiles its files
        uses: actions/download-artifact@v4
        with:
          name: count-fixed-${{ github.sha }}
          path: .smith/frontend-coverage/fixed
      - name: Count the shard
        # never fails the job: the status is read by the merge job, whatever happened here
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/coverage"
          touch "$RUNNER_TEMP/before-count"
          # a shard takes 2 minutes (1.7 to 2.4); one that hung sat the whole 30 minutes of the job, failed the entry
          # and every group queued on it (#3051: runs 42924697431 and 42930758168, 45 minutes each). A hang that comes
          # from the diff is deterministic, so there is no retry: the command is bounded to 7 minutes and fails the entry.
          timeout -k 10 420 "$SMITH" build frontend-coverage -Dshard=${{ matrix.shard }}/${{ needs.frontend-coverage-fix.outputs.count }} -Dsmith="$SMITH" >"$RUNNER_TEMP/coverage/output.txt" 2>&1
          status=$?
          [ "$status" != 124 ] || echo "shard ${{ matrix.shard }} hung for 7 minutes: the entry fails" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "status: $status" >>"$RUNNER_TEMP/coverage/output.txt"
          cp .smith/frontend-coverage/results.tsv "$RUNNER_TEMP/coverage/results.tsv" 2>/dev/null
          # the rows this shard measured (#2832): the save job adds them to the cache main starts from
          mkdir -p "$RUNNER_TEMP/rows"
          find .smith/frontend-coverage/fixed -name '*.row' -newer "$RUNNER_TEMP/before-count" -exec cp {} "$RUNNER_TEMP/rows/" \; 2>/dev/null
          # the lines that say where the time went, in the job log too (the output file is an artifact nobody can download)
          grep -E 'frontend_coverage: (fix phase|fixer cache|rows to measure|row cache|compile phase)' "$RUNNER_TEMP/coverage/output.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Save the shard's rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: count-rows-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/rows
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 3
      - name: Save the shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-shard-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish the import cache
        # `test-cache-<sha7>-count-<k>`, and the shard's hits
        if: always()
        uses: ./.github/actions/test-cache/save
        with:
          name: count-${{ matrix.shard }}
          tests: "false"
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  frontend-coverage:
    # the merge of the eight shards of `frontend-coverage-shard` (#2697): their tables are joined in the order of the files
    # (a file in no shard, or in two, is an error), the summary is the single job's, and the gate below is unchanged.
    # A shard that failed or did not finish leaves the count unmeasured, which fails the merge as before.
    # the count of how many .smith files the new front end handles (#2073, #1885, #2433), measured on Linux (CI's machine,
    # not a developer's Mac) in the merge-queue run, on the smith `build-linux` built for that very commit: the commit the
    # queue fast-forwards main to, so every merge is counted and a drop is pinned on one group. No second build: it
    # restores the `build-linux` artifact like the test shards do, so it runs wherever `build-linux` does (scope full).
    # It gates the merge (owner, 2026-11-06, after it went unmeasured for five hours while PRs kept merging): it is in
    # `ci`'s needs and owed by a full merge group, a count that could not be made fails it, and so does a count below
    # main's last one, unless the PR's body has a line `Count drop: <why>`. A group the queue cancels cancels it too; the
    # next group counts again. `timeout-minutes` counts queue time too (knowledge/ci-hosted.md); the count took 9 to 19 minutes on 4 cores on 2026-11-06,
    # so 30 keeps a slow count from failing its group now that it gates (10 groups hit the old 20 that morning).
    needs: [changes, build-linux, frontend-coverage-fix, frontend-coverage-shard]
    if: ${{ !cancelled() && needs.changes.outputs.count == 'true' && needs.build-linux.result == 'success' && needs.changes.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Token for the reads (the app's, #2986)
        id: reader
        uses: ./.github/actions/ci-reader
        with:
          app-id: ${{ vars.CI_READER_APP_ID }}
          private-key: ${{ secrets.CI_READER_PRIVATE_KEY }}
      - name: Install lld
        run: sudo apt-get install -y -q lld
      - uses: ./.github/actions/setup-smith
        with:
          artifact: build-linux
      - name: Fetch the shards
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-coverage-shard-${{ github.sha }}-*
          path: ${{ runner.temp }}/shards
      - name: Count
        id: count
        # never fails the job: the output is read afterwards, whatever happened
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/coverage"
          out="$RUNNER_TEMP/coverage/output.txt"
          tables=
          parts=${{ needs.frontend-coverage-fix.outputs.count || 8 }}
          # a PR check's sample (#2914): only the first two parts ran
          [ "${{ needs.frontend-coverage-fix.outputs.sampled }}" = true ] && parts=2
          for k in $(seq 1 "$parts"); do
            d="$RUNNER_TEMP/shards/frontend-coverage-shard-$GITHUB_SHA-$k"
            if [ -f "$d/results.tsv" ] && grep -qx 'status: 0' "$d/output.txt" 2>/dev/null; then
              tables="${tables:+$tables,}$d/results.tsv"
            else
              echo "frontend-coverage: shard $k of $parts did not finish, so the count is not measured" >>"$out"
              tail -n 20 "$d/output.txt" 2>/dev/null >>"$out"
            fi
          done
          if [ "${{ needs.frontend-coverage-fix.outputs.sampled }}" = true ]; then
            # the sample is not a whole table: the shards' tables are joined as they are, and the gate reads only these files
            if [ -n "$tables" ] && [ "$(printf %s "$tables" | tr ',' '\n' | wc -l)" = $((parts - 1)) ]; then
              for t in $(printf %s "$tables" | tr ',' ' '); do cat "$t"; done >"$RUNNER_TEMP/coverage/results.tsv"
              measured=$(grep -v '^[[:space:]]' "$RUNNER_TEMP/coverage/results.tsv" | cut -f1 | sort -u | wc -l)
              echo "frontend-coverage-sample: $measured ${{ needs.frontend-coverage-fix.outputs.missed }}" >>"$out"
            fi
          elif [ -n "$tables" ] && [ "$(printf %s "$tables" | tr ',' '\n' | wc -l)" = $((parts - 1)) ]; then
            "$SMITH" build frontend-coverage -Dmerge="$tables" -Dsmith="$SMITH" >>"$out" 2>&1
            echo "status: $?" >>"$out"
            cp .smith/frontend-coverage/results.tsv "$RUNNER_TEMP/coverage/results.tsv" 2>/dev/null
          fi
          exit 0
      - name: Publish the number
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/coverage/output.txt"
          line=$(sed -n 's/^frontend-coverage: \([0-9][0-9]*\) of \([0-9][0-9]*\) files pass$/\1 \2/p' "$out" 2>/dev/null | tail -n 1)
          sample=$(sed -n 's/^frontend-coverage-sample: \([0-9][0-9]*\) \([0-9][0-9]*\)$/\1 \2/p' "$out" 2>/dev/null | tail -n 1)
          {
            if [ -n "$sample" ]; then
              echo "### Front-end coverage (PR check): measured ${sample% *} of ${sample#* } rows; the queue run measures all"
            elif [ -n "$line" ]; then
              echo "### Front-end coverage: ${line% *} of ${line#* } files pass"
              echo
              echo '```'
              grep -E '^  failed at ' "$out"
              echo '```'
              echo
              echo "Total errors and files failing: $(grep '^frontend-errors: ' "$out" | tail -n 1 | sed 's/^frontend-errors: //' || true)"
              echo
              echo 'Top 20 causes, by the files each alone blocks, then the files each stops first (count, first, files, cause):'
              echo '```'
              awk '/^failures by cause/ {on=1; next} on && /^ *[0-9]+ +[0-9]+ +[0-9]+  / {print; n++} n==20 {exit}' "$out"
              echo '```'
            else
              echo "### Front-end coverage: not measured"
              echo '```'
              tail -n 40 "$out" 2>/dev/null
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          # one fixed line for the lead's watcher (`gh api` reads this job's log): <sha> <passed> <total>
          if [ -n "$sample" ]; then echo "count (PR check): measured ${sample% *} of ${sample#* } rows; the queue run measures all"
          elif [ -n "$line" ]; then echo "frontend-coverage: $GITHUB_SHA $line"
          else echo "frontend-coverage: $GITHUB_SHA unmeasured"; fi
          # the total errors (#2731): frontend-errors: <sha> <errors> <files failing>
          errs=$(grep '^frontend-errors: ' "$out" 2>/dev/null | tail -n 1 || true)
          if [ -n "$errs" ]; then echo "frontend-errors: $GITHUB_SHA ${errs#frontend-errors: }"; fi
          # the top 20 causes, one fixed line each (#2247, #2731): frontend-cause: <alone> <first> <files> <count> <cause>
          grep '^frontend-cause: ' "$out" 2>/dev/null || true
          # the top 10 pairs of causes that are a file's only two (#2731): frontend-pair: <files> <cause a> | <cause b>
          grep '^frontend-pair: ' "$out" 2>/dev/null || true
          # the top 15 names behind `unknown name` and `unknown type` (#2413): frontend-name: <first> <files> <count> <kind> <name>
          grep '^frontend-name: ' "$out" 2>/dev/null || true
      - name: Save the table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Gate
        # the merge needs its count, and the count may not fall below main's last one (owner, 2026-11-06)
        if: always()
        shell: bash
        env:
          BASE: ${{ (needs.changes.outputs.uncached == 'true' && github.sha) || github.event.merge_group.base_sha || needs.changes.outputs.base }}
          UNCACHED: ${{ needs.changes.outputs.uncached }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          SAMPLED: ${{ needs.frontend-coverage-fix.outputs.sampled }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          pass='s/^frontend-coverage: \([0-9][0-9]*\) of [0-9][0-9]* files pass$/\1/p'
          now=$(sed -n "$pass" "$RUNNER_TEMP/coverage/output.txt" 2>/dev/null | tail -n 1)
          if [ -z "$now" ] && [ "$SAMPLED" = true ] && grep -q '^frontend-coverage-sample: ' "$RUNNER_TEMP/coverage/output.txt" 2>/dev/null; then now=sample; fi
          if [ -z "$now" ]; then
            echo "::error::the count was not measured, and a merge needs its count: see the Count step's output above (the tail is in the job summary)"
            echo "count: no main results to compare (this run's count was not measured)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # main's last count: the artifact of the newest commit on main's first-parent line that has one (a merge of
          # documents only runs no count) from a run whose own count job passed. In a queue group the base is the entry
          # ahead, whose run may have failed or not finished: its count is not main's (2026-11-07: #2660 fell to 551,
          # failed, and still merged because #2670 behind it compared against that 551 and passed)
          before=
          for sha in $(git rev-list --first-parent --max-count=20 "$BASE"); do
            id=
            for a in $(gh_retry env GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api "repos/$GH_REPO/actions/artifacts?name=frontend-coverage-$sha&per_page=5" --jq '.artifacts[]|select(.expired|not)|"\(.id):\(.workflow_run.id)"'); do
              ok=$(gh_retry env GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api "repos/$GH_REPO/actions/runs/${a#*:}/jobs?per_page=100" --jq '[.jobs[]|select(.name=="frontend-coverage" and .conclusion=="success")]|length')
              [ "$ok" = 1 ] && { id=${a%%:*}; break; }
            done
            [ -n "$id" ] || continue
            dir="$RUNNER_TEMP/before-$sha"; mkdir -p "$dir"
            gh_retry env GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api "repos/$GH_REPO/actions/artifacts/$id/zip" >"$dir/a.zip" && unzip -o -q "$dir/a.zip" -d "$dir" || continue
            before=$(sed -n "$pass" "$dir/output.txt" 2>/dev/null | tail -n 1)
            [ -n "$before" ] && { echo "main's last count: $before files pass, at $sha"; break; }
          done
          if [ -z "$before" ] && [ "$UNCACHED" = true ]; then
            echo "::error::no cached count on the last 20 commits to compare the uncached count with"
            echo "nightly count: $now files pass (cached: none found)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$before" ]; then
            echo "no count on main's last 20 commits: nothing to compare with"
            echo "count: no main results to compare (no passing count on main's last 20 commits)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$UNCACHED" = true ]; then
            # The nightly count (#2955) has no cache: it must equal the cached count of the same commit, row by row. The
            # table holds, per file, its rows (a line starting at the path, then the indented lines of its imports); a
            # file whose rows differ, or that only one table has, is a cache that served a stale result.
            [ -f "$dir/results.tsv" ] || { echo "::error::the cached count of ${sha:0:7} has no results.tsv to compare with"; exit 1; }
            diffs=$(awk -F'\t' '
              FNR == 1 { f++; cur = "" }
              /^[ \t]/ { if (cur != "") blk[f, cur] = blk[f, cur] "\037" $0; next }
              { cur = $1; all[cur] = 1; if ((f, cur) in blk) blk[f, cur] = blk[f, cur] "\037" $0; else blk[f, cur] = $0 }
              END {
                for (p in all) {
                  a = ((1, p) in blk) ? blk[1, p] : "(no rows)"; b = ((2, p) in blk) ? blk[2, p] : "(no rows)"
                  if (a == b) continue
                  nx = split(a, x, "\037"); ny = split(b, y, "\037")
                  for (i = 1; i <= nx && i <= ny && x[i] == y[i]; i++) ;
                  printf "nightly count: differs %s: cached [%s] uncached [%s]\n", p, x[i], y[i]
                }
              }' "$dir/results.tsv" "$RUNNER_TEMP/coverage/results.tsv" | LC_ALL=C sort)
            nd=$(printf '%s' "$diffs" | grep -c . || true)
            echo "nightly count: $now files pass (cached: $before, count of ${sha:0:7}, this run ${GITHUB_SHA:0:7})" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$nd" -gt 0 ] && printf '%s\n' "$diffs" | head -n 200 | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$nd" -gt 0 ] || [ "$now" != "$before" ]; then
              echo "::error::the uncached count differs from the cached one of ${sha:0:7}: $nd files with other rows, $now against $before files pass. A cache served a stale row: each file named above is a ticket"
              exit 1
            fi
            echo "nightly count: no row differs from the cached count"
            exit 0
          fi
          # the files that went from pass to fail or back against main's last passing count (#2879), in the log and the summary
          # (an agent session cannot download the artifact, but it reads the log). Output only: it never fails the job
          # and never changes the count
          if [ "$SAMPLED" = true ]; then
            # A PR check's sample (#2914): the gate compares only the files the sample measured. A file that passes in
            # main's last count and fails here is a loss; there is no total to compare, the queue run counts them all.
            if [ ! -f "$dir/results.tsv" ]; then
              echo "count (PR check): no main results to compare (no results.tsv in the count of ${sha:0:7})" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            lost=$(awk -F'\t' 'FNR == 1 { f++ } /^[ \t]/ { next }
              f == 1 { if (!($1 in m)) m[$1] = ($2 == "pass") ? "pass" : "fail"; next }
              !($1 in s) { s[$1] = ($2 == "pass") ? "pass" : "fail" }
              END { for (p in s) if (s[p] == "fail" && m[p] == "pass") print "count: pass->fail " p }' \
              "$dir/results.tsv" "$RUNNER_TEMP/coverage/results.tsv" | LC_ALL=C sort)
            [ -n "$lost" ] && printf '%s\n' "$lost" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -z "$lost" ]; then echo "count (PR check): no measured file went from pass to fail against main at ${sha:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
            why=$([ -n "$PR_NUMBER" ] && gh_retry env GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.body // ""' | grep -m1 '^Count drop: ') || true
            if [ -n "$why" ]; then echo "::warning::files fell against main; the PR says: ${why#Count drop: }"; exit 0; fi
            echo "::error::$(printf '%s\n' "$lost" | wc -l) of the files measured here passed in main's last count and fail now (listed above). Fix them, or add a line 'Count drop: <why>' to the PR body and ask the lead"
            exit 1
          fi
          if [ -f "$dir/results.tsv" ] && [ -f "$RUNNER_TEMP/coverage/results.tsv" ]; then
            # a table has one or more rows per file (path, stage); a file's stage is its first row's, `pass` or the stage
            # that failed; a file one table lacks counts as failing there
            { awk -F'\t' -v base="${sha:0:7}" '
                FNR == 1 { f++ }
                !((f, $1) in st) { st[f, $1] = ($2 == "pass") ? "pass" : "fail"; all[$1] = 1 }
                END {
                  for (p in all) {
                    a = ((1, p) in st) ? st[1, p] : "fail"; b = ((2, p) in st) ? st[2, p] : "fail"
                    if (a == b) continue
                    if (a == "pass") { print "count: pass->fail " p; down++ } else { print "count: fail->pass " p; up++ }
                  }
                  n = down + up
                  if (n == 0) print "count: no file changed against main " base
                  else printf "count~total: %d files changed (%d pass->fail, %d fail->pass)\n", n, down + 0, up + 0
                }' "$dir/results.tsv" "$RUNNER_TEMP/coverage/results.tsv" | LC_ALL=C sort | sed 's/^count~total:/count:/' || true; } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "count: no main results to compare (no results.tsv in the count of ${sha:0:7} or in this run)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$now" -ge "$before" ]; then echo "count: $now files pass (main: $before)"; exit 0; fi
          pr=$(printf '%s' "$HEAD_REF" | sed -n 's|.*/pr-\([0-9][0-9]*\)-.*|\1|p')
          why=$([ -n "$pr" ] && gh_retry env GH_TOKEN="${READ_GH_TOKEN:-$GH_TOKEN}" gh api "repos/$GH_REPO/pulls/$pr" --jq '.body // ""' | grep -m1 '^Count drop: ')
          if [ -n "$why" ]; then echo "::warning::the count fell from $before to $now files; the PR says: ${why#Count drop: }"; exit 0; fi
          echo "::error::the count fell from $before to $now files pass. Fix the files it lost (the Count step lists them), or add a line 'Count drop: <why>' to the PR body and ask the lead"
          exit 1
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  count-fixed-save:
    # the queue run saves the fixed files of its own head commit (#2832). Main's `warm` publishes them with the step cache
    # about 11 minutes after a merge, so the very next queue run always started cold (the fix job: 19 minutes instead of
    # a few). A group's head commit is the tree main becomes if the group merges, so a run that passed (`ci` is green and
    # the fix job ran) puts its `count-fixed` artifact in a prerelease `count-fixed-<sha7>`, which the fix job restores
    # from like a `step-cache-*` one. Only a passing run saves, and a cache entry is keyed by what it depends on, so one
    # for a group that never merges costs nothing. It does not gate the merge: it needs `ci` and nothing needs it. The 3
    # newest `count-fixed-*` stay.
    needs: [ci, frontend-coverage-fix, frontend-coverage-shard]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.ci.result == 'success' && needs.frontend-coverage-fix.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: count-fixed-${{ github.sha }}
          path: ${{ runner.temp }}/f/fixed
      - name: Fetch the rows the parts measured
        # the rows of the count (#2832) go in the same tarball: a part saved the ones it measured
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: count-rows-${{ github.sha }}-*
          path: ${{ runner.temp }}/rows
          merge-multiple: true
      - name: Release the fixed files
        # a failure only leaves the next run cold
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          out="$RUNNER_TEMP/assets"; mkdir -p "$out"
          if [ -d "$RUNNER_TEMP/rows" ]; then cp "$RUNNER_TEMP"/rows/*.row "$RUNNER_TEMP/f/fixed/" 2>/dev/null || true; fi
          # rows are keyed by the smith, so each change of it leaves a tree of dead ones: drop those not written in 3 days
          find "$RUNNER_TEMP/f/fixed" -name '*.row' -mtime +3 -delete
          echo "rows saved: $(ls "$RUNNER_TEMP/f/fixed" | grep -c '\.row$' || true)" | tee -a "$GITHUB_STEP_SUMMARY"
          tar -C "$RUNNER_TEMP/f" -c fixed | gzip -1 >"$out/count-fixed.tar.gz"
          tag="count-fixed-${GITHUB_SHA:0:7}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$out/count-fixed.tar.gz" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "count fixed $tag" --notes "The fixed files of the count at $GITHUB_SHA (#2832). Not a release of smith."
          fi
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[]|select(.tagName|test("^count-fixed-"))]|sort_by(.createdAt)|reverse|.[3:]|.[].tagName' |
            while read -r old; do
              gh release delete "$old" --cleanup-tag --yes || echo "::warning::could not delete release $old"
            done
          echo "published $tag" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    # publishes the draft the two release jobs added to: a published release is immutable, so it waits for both, and
    # either one's tarball lets the release out: a failed Linux job still lets the macOS release out, and a macOS job that
    # timed out lets the Linux one out (`warm` and every Linux job fetch the Linux tarball; 4 of the 5 failed `warm` runs of
    # 2026-11-09 waited for a release the macOS timeout kept unpublished, #2976). That commit has no macOS tarball for good.
    # The tarballs the queue run of this commit built (#2832) are its artifacts: this job adds them to the draft
    # (`release upload`, the tool that travels in the Linux artifact) and publishes at once, a minute or two after the
    # merge; `release` and `release-linux` run only for a tarball the queue run did not leave.
    needs: [changes, release, release-linux]
    if: always() && needs.changes.result == 'success' && (needs.release.result == 'success' || needs.release-linux.result == 'success' || needs.changes.outputs.linux_packed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read # the queue run's artifacts
    outputs:
      # whether the published release holds the macOS tarball (`install` and the Mac's `warm` need it)
      mac: ${{ steps.published.outputs.mac }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Download the Linux tarball of the queue run
        if: needs.changes.outputs.linux_packed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: stage0-${{ github.sha }}-linux-x86_64
          path: ${{ runner.temp }}/stage0
          run-id: ${{ needs.changes.outputs.queue_run }}
          github-token: ${{ github.token }}
      - name: Download the macOS tarball of the queue run
        if: needs.changes.outputs.linux_packed == 'true' && needs.changes.outputs.mac_packed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: stage0-${{ github.sha }}-darwin-arm64
          path: ${{ runner.temp }}/stage0
          run-id: ${{ needs.changes.outputs.queue_run }}
          github-token: ${{ github.token }}
      - name: Add the queue run's tarballs to the draft
        if: needs.changes.outputs.linux_packed == 'true'
        env:
          QUEUE_RUN: ${{ needs.changes.outputs.queue_run }}
        run: |
          chmod +x "$RUNNER_TEMP/stage0/release"
          "$RUNNER_TEMP/stage0/release" upload "$RUNNER_TEMP/stage0"
          echo "release: tarballs of queue run $QUEUE_RUN" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        # no smith on this runner (a hosted Ubuntu, 3 minutes): the one command of `release finish`
        # (release/publish.smith), which stays for use by hand
        run: |
          gh release edit "stage0-$GITHUB_SHA" --draft=false
          echo "release: published stage0-$GITHUB_SHA"
      - name: What the release holds
        id: published
        run: |
          assets=$(gh_retry gh api "repos/$GH_REPO/releases/tags/stage0-$GITHUB_SHA" --jq '[.assets[].name]|join(" ")')
          case " $assets " in *" smith-darwin-arm64.tar.xz "*) mac=true ;; *) mac=false ;; esac
          echo "mac=$mac" >>"$GITHUB_OUTPUT"
          echo "release: stage0-$GITHUB_SHA holds $assets" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  prune:
    # deletes the old releases once this one is out (`release prune-old`: the published ones past the 20 newest and a week
    # each, and the drafts older than a day, by id), so the prune never delays the release, `install` or `warm`. In
    # `publish` it took 5 of the 6.4 minutes from merge to release (run 42877475136, #2832). The tool travels in the queue
    # run's Linux artifact; a commit released by the fallback is pruned by `release publish` in its release jobs.
    needs: [changes, publish]
    if: always() && needs.publish.result == 'success' && needs.changes.outputs.linux_packed == 'true'
    runs-on: ubuntu-latest
    # the first run deletes 422 releases at about 0.7 s each (about 5 minutes); 30 leaves room for a slow API (#3029)
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read # the queue run's artifacts
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Download the release tool of the queue run
        uses: actions/download-artifact@v4
        with:
          name: stage0-${{ github.sha }}-linux-x86_64
          path: ${{ runner.temp }}/stage0
          run-id: ${{ needs.changes.outputs.queue_run }}
          github-token: ${{ github.token }}
      - name: Prune the old releases
        run: |
          chmod +x "$RUNNER_TEMP/stage0/release"
          # exits 1 when a delete failed or more releases remain than the policy allows (#3029)
          "$RUNNER_TEMP/stage0/release" prune-old
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget

  install:
    # the owner's Mac installs the release just published, so the installed smith is always main's: a download and a
    # checksum, no build (owner, 2026-10-29). Nothing needs this job (not `ci`, not the release): with the Mac off it
    # waits, and only the newest commit's install is kept waiting, so the Mac installs once when it returns.
    # a commit published without its macOS tarball (the macOS job failed or timed out, #2976) is skipped, not waited for:
    # `publish` says whether the release holds it, from the queue run (#2832) or from `release`
    needs: [publish]
    if: always() && needs.publish.outputs.mac == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    concurrency:
      group: install-mac
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: API budget (first)
        uses: ./.github/actions/api-budget
      - name: Install the release
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          tmp=$(mktemp -d)
          # plain curl and tar, no smith: this step must work with whatever smith is installed, even a stale one
          # (compiling release/publish.smith here broke on every push, #1843). `release fetch` does the same by hand.
          name="smith-$(uname -s | tr A-Z a-z)-$(uname -m).tar.xz"
          api=https://api.github.com/repos/smith-ai-lab/smith
          # A release published seconds ago is not always served yet: github.com/releases/download/ answered 504 to all 9
          # tries of curl over 40 s (2026-11-09 05:37Z, run 42567390515). Try for about 6 minutes, by the asset API (a
          # redirect to a signed URL, asked for with the token and fetched without it, #2835) and then by the download URL.
          get() {
            f=$1
            for try in $(seq 1 24); do
              id=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/stage0-$GITHUB_SHA" 2>/dev/null \
                | jq -r --arg n "$f" '.assets[]|select(.name==$n)|.id' 2>/dev/null) || id=
              if [ -n "$id" ]; then
                url=$(curl -fsS -o /dev/null -w '%{redirect_url}' -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/octet-stream" "$api/releases/assets/$id" 2>/dev/null) || url=
                if [ -n "$url" ] && curl -fsSL --retry 3 --retry-all-errors -o "$tmp/$f" "$url"; then return 0; fi
              fi
              curl -fsSL --retry 2 --retry-all-errors -o "$tmp/$f" \
                "https://github.com/smith-ai-lab/smith/releases/download/stage0-$GITHUB_SHA/$f" && return 0
              echo "install: try $try of 24 failed for $f; waiting 15 s"; sleep 15
            done
            echo "external: stage0-$GITHUB_SHA/$f not served after 24 tries (about 6 minutes)" >&2
            return 1
          }
          get "$name"
          get "$name.sha256"
          [ "$(shasum -a 256 "$tmp/$name" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$tmp/$name.sha256")" ] \
            || { echo "the checksum of stage0-$GITHUB_SHA does not match"; exit 1; }
          tar -C "$tmp" -xJf "$tmp/$name"
          mkdir -p "$HOME/.local/bin"
          for f in "$tmp"/bin/*; do
            # copy beside, then rename over: a smith running now keeps its old file
            cp -P "$f" "$HOME/.local/bin/.$(basename "$f").new"
            mv -f "$HOME/.local/bin/.$(basename "$f").new" "$HOME/.local/bin/$(basename "$f")"
          done
          rm -rf "$tmp"
          "$HOME/.local/bin/smith" version
      - name: API budget (last)
        if: always()
        uses: ./.github/actions/api-budget
