name: ci

# The full check (#798, knowledge/ci-hosted.md): Linux carries the tests (8 hosted shards, each building smith itself,
# no artifact travels) and the owner's Mac runs what only macOS can (`build`, `mechanical`, the `--macos-only` tests);
# the one job `ci` gathers them, so the ruleset and the merge queue name a single required check. The first job that
# fails cancels the run. A push to main (a commit the queue checked) also publishes the release and saves the cache.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# A new push to a pull request replaces its older run; the merge queue's runs and main's never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write # `gh run cancel`: the first failing job ends the run

env:
  GH_REPO: ${{ github.repository }}

jobs:
  changes:
    # what the change touches decides what runs: a document no build reads runs nothing, the README, AGENTS.md,
    # knowledge/ and the skills run `smith docs` and their tests, everything else runs the full check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      mode: ${{ steps.scope.outputs.mode }}
      base: ${{ steps.scope.outputs.base }}
      matrix: ${{ steps.linux.outputs.matrix }}
      linux: ${{ steps.linux.outputs.linux }}
      # where the macOS jobs run (knowledge/ci-hosted.md): hosted macos-26, the owner's Mac only as overflow when the
      # hosted pool is saturated; picked per run by the step `Pick the macOS runner`
      pack: ${{ steps.pack.outputs.build }}
      mac: ${{ steps.mac.outputs.mac }}
      # SMITH_CORES of a macOS job: the Mac's 16 cores shared by its 3 runners (overflow only); a hosted runner has 3
      cores: ${{ steps.mac.outputs.cores }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the macOS runner
        id: mac
        uses: ./.github/actions/pick-mac
        with:
          token: ${{ secrets.RUNNER_STATUS_TOKEN }}
          github-token: ${{ github.token }}
          fork: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Is there a pack for this LLVM configuration
        id: pack
        # a change of patches/ bumps the configuration name, whose pack no release holds yet: the `pack` job builds
        # and publishes it before anything that needs LLVM runs (#1064). Not for a fork, which cannot publish.
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          name=$(sed -n 's/.*"SMITH_LLVM_NAME", "\([^"]*\)".*/\1/p' build.c | head -1)
          build=false
          if [ "$FORK" != true ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            for tag in "llvm-$name-darwin-arm64" "llvm-$name-linux-x86_64"; do
              gh release view "$tag" >/dev/null 2>&1 || build=true
            done
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "LLVM pack $name: built by this run: $build" >>"$GITHUB_STEP_SUMMARY"
      - name: Scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # none: only documents no build reads. docs: also the documents the docs check and their tests read. full:
          # anything else; a push to main, or a diff that cannot be read, is always full.
          # Other workflows (llvm.yml) change nothing this one runs; ci.yml itself and the actions it uses do.
          documents='^(LICENSE[^/]*|CONTRIBUTING[.]md|[^/]+[.](png|jpe?g|gif|svg|webp))$'
          workflows='^[.]github/workflows/'
          gated='^(README[.]md|AGENTS[.]md|knowledge/.*|[.]agents/.*)$'
          scope=full
          mode=full
          # a push to main is a commit the merge queue already checked: it only publishes the release
          if [ "$GITHUB_EVENT_NAME" = push ]; then scope=release; BASE=; fi
          if [ -n "$BASE" ] && changed=$(git diff --name-only "$BASE" HEAD); then
            own=$(printf '%s\n' "$changed" | grep -E '^([.]github/workflows/ci[.]yml|[.]github/actions/.*)$' || true)
            built=$(printf '%s\n' "$changed" | grep . | grep -vE "$documents" | grep -vE "$workflows" || true)
            built=$(printf '%s\n%s\n' "$built" "$own" | grep . || true)
            code=$(printf '%s\n' "$built" | grep . | grep -vE "$gated" || true)
            if [ -z "$built" ]; then scope=none; elif [ -z "$code" ]; then scope=docs; fi
            # a pull request tests what its change can reach (`smith test --changed`); the merge queue runs
            # everything, and so does a pull request that changes this workflow or its actions (how they are tested)
            if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -z "$own" ]; then mode=changed; fi
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "base=$PR_BASE" >>"$GITHUB_OUTPUT"
          echo "scope=$scope" >>"$GITHUB_OUTPUT"
          echo "scope: $scope, tests: $mode" >>"$GITHUB_STEP_SUMMARY"

      - name: Test matrix
        id: linux
        # Linux carries the tests: `--skip-macos` in parts, each building smith itself (no artifact egress). The Mac
        # runs the few tests only macOS can run (`--macos-only`, one part). A pull request tests what its change
        # reaches, split into 4 parts (one part took 10 to 17 min); the queue and main run everything in 8. A push to
        # main runs only the Linux parts (the Mac's work is the release).
        run: |
          flags="--skip-macos"
          macflags="--macos-only"
          count=8
          if [ "${{ steps.scope.outputs.mode }}" = changed ]; then
            flags="$flags --changed --base ${{ steps.scope.outputs.base }}"
            macflags="$macflags --changed --base ${{ steps.scope.outputs.base }}"
            count=4
          fi
          linux=
          for i in $(seq 1 "$count"); do
            linux="$linux"${linux:+,}'{"shard":'$i',"count":'$count',"flags":"'"$flags"'"}'
          done
          echo "linux={\"include\":[$linux]}" >>"$GITHUB_OUTPUT"
          echo "matrix={\"include\":[{\"os\":\"macos-26\",\"shard\":1,\"count\":1,\"flags\":\"$macflags\"}]}" >>"$GITHUB_OUTPUT"
          echo "tests: $count Linux parts, one macOS part ($macflags)" >>"$GITHUB_STEP_SUMMARY"

  pack:
    # the LLVM pack of a configuration no release holds yet, built and published by llvm.yml (#1064) before the jobs
    # that need it start; it runs on the Mac only as overflow (hosted pool saturated), else on hosted runners
    needs: changes
    if: needs.changes.outputs.pack == 'true'
    uses: ./.github/workflows/llvm.yml
    permissions:
      contents: write # gh release create
      actions: read # llvm.yml's pick-mac lists the queued and running jobs
    secrets: inherit

  build:
    # smith built once for the run (#798): the stage0 release and the LLVM pack come from the cache (or the release),
    # compiles from the step cache main saved, then the tests are built too. Every job after this one unpacks the
    # result instead of compiling smith again.
    needs: [changes, pack]
    # macOS only: the Linux shards build smith themselves. A push to main builds nothing here (the release does).
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && (needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'docs') }}
    runs-on: ${{ fromJSON(needs.changes.outputs.mac) }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: ${{ needs.changes.outputs.cores }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-smith
        with:
          tests: "true"
      - uses: ./.github/actions/pack-smith
        with:
          name: macos-26
      - name: Fail fast
        if: failure()
        run: gh run cancel ${{ github.run_id }}

  mechanical:
    # fmt, docs, lint and the proofs of the project (the stages of `smith check` that are not tests)
    needs: [changes, build]
    # `!cancelled()` and the build's result: without a status function the implicit success() also looks at the skipped
    # ancestor `pack` and skips this job, which left fmt, lint, prove and the macOS tests unrun from #1067 on (#1139)
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.scope == 'full' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.mac) }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: ${{ needs.changes.outputs.cores }}
      SMITH_OUTPUT: full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/use-smith
        with:
          name: macos-26
      - name: Mechanical checks
        shell: bash
        run: |
          # every stage runs, and each failure ends in a line `FAIL <stage>`, so one run names all of them
          failed=0
          for stage in "fmt --dry-run --Werror" docs lint prove; do
            name=${stage%% *}
            if ! "$SMITH" $stage >"$RUNNER_TEMP/$name.log" 2>&1; then
              tail -n 60 "$RUNNER_TEMP/$name.log"
              echo "FAIL $name"
              echo "::error::smith $name failed"
              failed=1
            else
              echo "ok $name"
            fi
          done
          exit $failed
      - name: Fail fast
        if: failure()
        run: gh run cancel ${{ github.run_id }}

  test:
    # the macOS-only tests (`smith test --macos-only`, 3 of them, one part), on the Mac with the build of this run
    needs: [changes, build]
    # `!cancelled()` and the build's result: without a status function the implicit success() also looks at the skipped
    # ancestor `pack` and skips this job, which left fmt, lint, prove and the macOS tests unrun from #1067 on (#1139)
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.scope == 'full' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.mac) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: ${{ needs.changes.outputs.cores }}
      SMITH_OUTPUT: full
      SMITH_TEST_STATS: "1"
    steps:
      - name: Tools some tests need
        if: runner.os == 'macOS'
        # the editor tests do nothing without nvim; some tests bound a command with coreutils' `timeout`. It runs
        # while the build downloads: the next step waits for it
        shell: bash
        run: |
          # the owner's Mac already has them: three runners share it, so install only what is missing
          if command -v nvim >/dev/null && command -v gtimeout >/dev/null; then nohup true >"$RUNNER_TEMP/brew.log" 2>&1 &
          else HOMEBREW_NO_AUTO_UPDATE=1 nohup brew install neovim coreutils >"$RUNNER_TEMP/brew.log" 2>&1 &
          fi
          echo $! >"$RUNNER_TEMP/brew.pid"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/use-smith
        with:
          name: ${{ matrix.os }}
      - name: Tools some tests need (wait)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          while kill -0 "$(cat "$RUNNER_TEMP/brew.pid")" 2>/dev/null; do sleep 1; done
          tail -n 3 "$RUNNER_TEMP/brew.log"
          nvim --version | head -n 1
      - name: Tests, part ${{ matrix.shard }} of ${{ matrix.count }}
        shell: bash
        run: |
          start=$(date +%s)
          rc=0
          shard=
          if [ "${{ matrix.count }}" -gt 1 ]; then shard="--shard ${{ matrix.shard }}/${{ matrix.count }}"; fi
          # shellcheck disable=SC2086
          "$SMITH" test $shard ${{ matrix.flags }} --costs "$PWD/.github/shard-costs.tsv" 2>&1 |
            tee "$RUNNER_TEMP/test.log" || rc=${PIPESTATUS[0]}
          took=$(( $(date +%s) - start ))
          {
            echo "### tests ${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.count }}: $took s"
            grep -E '^[0-9]+ passed' "$RUNNER_TEMP/test.log" || true
          } >>"$GITHUB_STEP_SUMMARY"
          # a failure names its test: the line `FAIL <name>` of the runner, as an annotation and in the summary
          if [ "$rc" -ne 0 ]; then
            # each failed test's name and the lines under it (where the check failed, its error), kept for the
            # `Fail fast` step, which prints them last, before it cancels the other shards
            grep -hE -A6 '^FAIL |^FAILED:' "$RUNNER_TEMP/test.log" 2>/dev/null | grep -vE '^--$' | head -n 80 >"$RUNNER_TEMP/failed.txt" || true
            { echo '```'; cat "$RUNNER_TEMP/failed.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
            grep -hE '^FAIL |^FAILED:' "$RUNNER_TEMP/test.log" .smith/log/*.log 2>/dev/null | sort -u | head -n 20 |
              while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $rc
      - name: Upload the logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.shard }}-of-${{ matrix.count }}
          path: .smith/log
          # .smith is a hidden folder, which upload-artifact v4 leaves out unless asked (no log was uploaded since)
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail fast
        if: failure()
        # the failed tests are the last lines of this shard's log (#1086): the run then shows only cancelled jobs
        run: |
          if [ -s "$RUNNER_TEMP/failed.txt" ]; then
            echo "FAILED TESTS of this shard (the other shards are cancelled):"
            cat "$RUNNER_TEMP/failed.txt"
          fi
          gh run cancel ${{ github.run_id }}

  test-linux:
    # Linux carries the tests (required): 6 hosted shards of `--skip-macos`, each builds smith itself (a hosted
    # runner is free, and no ~1 GB artifact travels: storage egress), so none waits for `build`
    needs: [changes, pack]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.pack.result != 'failure' && needs.pack.result != 'cancelled' && (needs.changes.outputs.scope == 'full' || needs.changes.outputs.scope == 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.linux) }}
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
      SMITH_OUTPUT: full
      SMITH_TEST_STATS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-smith
        with:
          tests: "true"
      - name: Neovim 0.11+ for the editor tests (#1017)
        # the runner's nvim is 0.9 and the plugin needs `vim.uv`: `smith build nvim` fetches the pinned release (by
        # hash, kept in ~/.cache/smith/tools) and prints its bin/, which goes first on the PATH
        shell: bash
        run: |
          bin=$("$SMITH" build nvim | tail -n 1)
          echo "$bin" >>"$GITHUB_PATH"
          "$bin/nvim" --version | head -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tests, part ${{ matrix.shard }} of ${{ matrix.count }}
        shell: bash
        run: |
          start=$(date +%s)
          rc=0
          shard=
          if [ "${{ matrix.count }}" -gt 1 ]; then shard="--shard ${{ matrix.shard }}/${{ matrix.count }}"; fi
          # shellcheck disable=SC2086
          "$SMITH" test $shard ${{ matrix.flags }} --costs "$PWD/.github/shard-costs.tsv" 2>&1 |
            tee "$RUNNER_TEMP/test.log" || rc=${PIPESTATUS[0]}
          took=$(( $(date +%s) - start ))
          {
            echo "### tests linux ${{ matrix.shard }}/${{ matrix.count }}: $took s"
            grep -E '^[0-9]+ passed' "$RUNNER_TEMP/test.log" || true
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            # each failed test's name and the lines under it (where the check failed, its error), kept for the
            # `Fail fast` step, which prints them last, before it cancels the other shards
            grep -hE -A6 '^FAIL |^FAILED:' "$RUNNER_TEMP/test.log" 2>/dev/null | grep -vE '^--$' | head -n 80 >"$RUNNER_TEMP/failed.txt" || true
            { echo '```'; cat "$RUNNER_TEMP/failed.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
            grep -hE '^FAIL |^FAILED:' "$RUNNER_TEMP/test.log" .smith/log/*.log 2>/dev/null | sort -u | head -n 20 |
              while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $rc
      - name: Upload the logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-log-linux-${{ matrix.shard }}-of-${{ matrix.count }}
          path: .smith/log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail fast
        if: failure()
        # the failed tests are the last lines of this shard's log (#1086): the run then shows only cancelled jobs
        run: |
          if [ -s "$RUNNER_TEMP/failed.txt" ]; then
            echo "FAILED TESTS of this shard (the other shards are cancelled):"
            cat "$RUNNER_TEMP/failed.txt"
          fi
          gh run cancel ${{ github.run_id }}
  docs:
    # a change of the README, AGENTS.md, knowledge/ or the skills only: the docs check and the tests that read them
    # (a change that also touches code runs the full check, whose parts include both)
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.scope == 'docs' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.mac) }}
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: ${{ needs.changes.outputs.cores }}
      SMITH_OUTPUT: full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/use-smith
        with:
          name: macos-26
      - name: Docs and the tests that read them
        shell: bash
        run: |
          "$SMITH" docs
          "$SMITH" test --test readme_test,skills_test
      - name: Fail fast
        if: failure()
        run: gh run cancel ${{ github.run_id }}

  ci:
    # the one required check: green when every job that had to run is green; skipped jobs (a change of documents only)
    # do not count against it. It runs when a job failed too (the failing job cancels the run): red at once.
    needs: [changes, pack, build, mechanical, test, test-linux, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verdict
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          MECHANICAL: ${{ needs.mechanical.result }}
          TEST: ${{ needs.test.result }}
          DOCS: ${{ needs.docs.result }}
          TEST_LINUX: ${{ needs.test-linux.result }}
        run: |
          echo "scope: $SCOPE; jobs: $RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
          case " $RESULTS " in
          *" failure "* | *" cancelled "*)
            echo "::error::a CI job failed or was cancelled"
            exit 1
            ;;
          esac
          # A skipped job passes only where `changes` said the area was not touched (#1139). The scope says which jobs
          # the run owes: `full` owes mechanical, test and test-linux, `docs` owes docs, `release` (a push to main)
          # owes test-linux, `none` owes nothing. A job that was owed and skipped (a skipped `pack` skipped the three
          # macOS jobs for hours) fails the check.
          case "$SCOPE" in
          full) owed="MECHANICAL TEST TEST_LINUX" ;;
          docs) owed="DOCS" ;;
          release) owed="TEST_LINUX" ;;
          *) owed="" ;;
          esac
          for name in $owed; do
            eval "result=\$$name"
            if [ "$result" != success ]; then
              echo "::error::$name was owed by scope $SCOPE and its result is '$result', not success"
              exit 1
            fi
          done

  warm:
    # a push to main (a commit the queue checked) builds smith and the tests once more only to save the step cache,
    # which every pull request and queue entry after it restores (a cache saved on a branch is seen by that branch and
    # the ones made from it, and main's by all: so only main saves, which keeps the entries few). One for each OS: the
    # Linux shards restored `none` until this job saved a Linux entry, and built smith from nothing in each of 6 jobs
    needs: changes
    if: needs.changes.outputs.scope == 'release'
    strategy:
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-smith
        with:
          tests: "true"
      - name: Save the step cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/smith/steps
            ~/.cache/smith/packages
            ~/.cache/smith/tools
          key: smith-steps-${{ runner.os }}-${{ github.sha }}

  release:
    # a push to main (the merge queue's checked commit) publishes the stage0 release stage0-<commit>
    # (knowledge/release.md), which the next jobs' setup builds from; the macOS tarball goes into its draft, and the
    # `publish` job publishes the draft (releases are immutable once published)
    needs: changes
    if: needs.changes.outputs.scope == 'release'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-macos
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-smith
      - name: Release
        run: '"$SMITH" build release'

  release-linux:
    # the same draft release gets the Linux tarball (`release.sh publish` adds it to the draft the other job made). Until
    # a Linux release exists, setup builds smith from source (scripts/seed_linux.c, about two hours): expected once,
    # for the first push to main after this job exists; the hosted limit is 6 hours. `publish` publishes without this
    # job's tarball when it fails, so `install` never waits for Linux.
    needs: changes
    if: needs.changes.outputs.scope == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-linux
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lld
        # the seed (scripts/seed_linux.c) links smith with `-fuse-ld=lld`, which the hosted image does not have
        run: sudo apt-get install -y -q lld
      - uses: ./.github/actions/setup-smith
      - name: Release
        run: '"$SMITH" build release'

  publish:
    # publishes the draft the two release jobs added to: a published release is immutable, so it waits for both, and
    # a failed Linux job still lets the macOS release out
    needs: [release, release-linux]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        run: sh scripts/release.sh finish "stage0-$GITHUB_SHA"

  install:
    # the owner's Mac installs the release just published, so the installed smith is always main's: a download and a
    # checksum, no build (owner, 2026-10-29). Nothing needs this job (not `ci`, not the release): with the Mac off it
    # waits, and only the newest commit's install is kept waiting, so the Mac installs once when it returns.
    needs: publish
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 3
    concurrency:
      group: install-mac
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the release
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          tmp=$(mktemp -d)
          sh scripts/release.sh fetch "stage0-$GITHUB_SHA" "$tmp"
          mkdir -p "$HOME/.local/bin"
          for f in "$tmp"/bin/*; do
            # copy beside, then rename over: a smith running now keeps its old file
            cp -P "$f" "$HOME/.local/bin/.$(basename "$f").new"
            mv -f "$HOME/.local/bin/.$(basename "$f").new" "$HOME/.local/bin/$(basename "$f")"
          done
          rm -rf "$tmp"
          "$HOME/.local/bin/smith" version
