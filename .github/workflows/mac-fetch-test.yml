name: mac-fetch-test
# Throwaway (#2835): does the release download fail on the owner's self-hosted Mac with main's fetch-smith, and pass
# with #2829's? Runs only on pushes to the lead's branch; never merged.
on:
  push:
    branches: [claude/vibrant-mendel-tvpj1l]
permissions:
  contents: read
jobs:
  old:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Environment (no secrets printed)
        run: |
          which -a curl; curl --version | head -1
          for f in ~/.curlrc ~/.netrc; do [ -e "$f" ] && echo "$f exists" || echo "$f absent"; done
          env | cut -d= -f1 | grep -iE 'curl|proxy|netrc' || true
      - name: main's fetch-smith
        uses: ./.github/actions/fetch-smith
  new:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: "#2829's fetch-smith"
        uses: ./.github/actions/fetch-smith-new
      - run: smith --version || ls .smith/stage0/bin
