name: prover-linux-dev
# TEMPORARY (issue #820): once the llvm workflow has published the r12 pack, builds smith on Linux against it and runs
# the prove and autodiff tests. Does nothing before. Deleted before the pull request merges.
on:
  workflow_dispatch:
  push:
    branches: [worktree-agent-adc594bd97d4c5bb0]
    paths: [".github/workflows/prover-linux-dev.yml", "scripts/llvm_linux.c", "shim/**", "build.c", "runtime/**", "tests/**", "lib/**", "smith.c"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_OUTPUT: full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is the pack there
        id: pack
        run: |
          name=$(sed -n 's/.*"SMITH_LLVM_NAME", "\([^"]*\)".*/\1/p' build.c | head -1)
          if gh release view "llvm-$name-linux-x86_64" >/dev/null 2>&1; then echo "there=true" >>"$GITHUB_OUTPUT"; else echo "::notice::no pack llvm-$name-linux-x86_64 yet"; echo "there=false" >>"$GITHUB_OUTPUT"; fi
      - name: Fetch the previous smith and the pack
        if: steps.pack.outputs.there == 'true'
        run: |
          mkdir -p .smith
          cc -std=c23 -x c scripts/stage0.c -o .smith/stage0-tool 2>/dev/null || cc -std=c2x -x c scripts/stage0.c -o .smith/stage0-tool
          .smith/stage0-tool llvm -Dfetch=1
          ls -la ~/.cache/smith/llvm/*/prove/lib ~/.cache/smith/enzyme/*/lib
      - name: Build smith
        if: steps.pack.outputs.there == 'true'
        run: |
          .smith/stage0-tool
          smith=$(ls "$PWD"/build/*/smith | head -n 1)
          echo "SMITH=$smith" >>"$GITHUB_ENV"
      - name: Prove and autodiff tests
        if: steps.pack.outputs.there == 'true'
        run: |
          set +e
          "$SMITH" test --test prove_checks_test,prove_memory_test,prove_misc_test,prove_smith_test,prove_sound_test,prove_test,autodiff_test >"$RUNNER_TEMP/test.log" 2>&1
          rc=$?
          echo "smith test exit status: $rc"
          grep -E 'passed,|^FAIL |^FAILED:|build stopped' "$RUNNER_TEMP/test.log" | cut -c1-300 | sort | uniq -c | sort -rn | head -80
          echo "=== the failures"
          grep -A16 '^FAIL ' "$RUNNER_TEMP/test.log" | cut -c1-400 | head -300
          if [ "$rc" -eq 0 ] && ! grep -qE 'build stopped|^FAIL ' "$RUNNER_TEMP/test.log"; then exit 0; fi
          exit 1
