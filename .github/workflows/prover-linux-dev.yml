name: prover-linux-dev
# TEMPORARY (issue #820): tries the Linux prover and Enzyme steps on the published r11 pack, then builds smith with them
# and runs the prove and autodiff tests. Deleted before the pull request merges.
on:
  workflow_dispatch:
  push:
    branches: [worktree-agent-adc594bd97d4c5bb0]
    paths: [".github/workflows/prover-linux-dev.yml", "scripts/llvm_linux.c", "shim/**", "build.c"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_OUTPUT: full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q m4 lld
      - name: Fetch the previous smith and the r11 pack
        run: |
          mkdir -p .smith
          cc -std=c23 -x c scripts/stage0.c -o .smith/stage0-tool 2>/dev/null || cc -std=c2x -x c scripts/stage0.c -o .smith/stage0-tool
          .smith/stage0-tool llvm
      - name: llvm-objcopy (the pack has none; the full install of llvm.yml does)
        run: |
          sudo apt-get install -y -q llvm
          tool=$(command -v llvm-objcopy || ls /usr/lib/llvm-*/bin/llvm-objcopy | head -n 1)
          ln -sf "$tool" ~/.cache/smith/llvm/23.1.3-r11/install/bin/llvm-objcopy
          ln -sf "$(dirname "$tool")/llvm-ar" ~/.cache/smith/llvm/23.1.3-r11/install/bin/llvm-ar
          # the pack has no programs, but LLVM's cmake exports name them and cmake checks they exist
          cd ~/.cache/smith/llvm/23.1.3-r11/install
          grep -ho '_IMPORT_PREFIX}/\(bin\|lib\)/[A-Za-z0-9_.+-]*' lib/cmake/*/*.cmake | sed 's|.*_IMPORT_PREFIX}/||' | sort -u | while read -r name; do
            [ -e "$name" ] || { : >"$name"; chmod +x "$name"; }
          done
      - name: Restore the builds
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/smith/llvm/23.1.3-r11/prove
            ~/.cache/smith/llvm/23.1.3-r11/prove-work
            ~/.cache/smith/llvm/23.1.3-r11/packages
            ~/.cache/smith/llvm/23.1.3-r11/enzyme-work
            ~/.cache/smith/enzyme
          key: prover-dev-none
          restore-keys: prover-dev-
      - name: Z3, Alive2, Bitwuzla
        run: |
          rm -f ~/.cache/smith/llvm/23.1.3-r11/prove/.bitwuzla
          cc -std=gnu2x -O1 -x c scripts/llvm_linux.c -o "$RUNNER_TEMP/llvm_linux"
          LLVM_LINUX_ONLY=prover "$RUNNER_TEMP/llvm_linux" "" "" "" "$RUNNER_TEMP/x.stamp" ""
          ls -la ~/.cache/smith/llvm/*/prove/lib
      - name: Enzyme
        run: |
          LLVM_LINUX_ONLY=enzyme "$RUNNER_TEMP/llvm_linux" "" "" "" "$RUNNER_TEMP/x.stamp" ""
          ls -la ~/.cache/smith/enzyme/*/lib
      - name: Save the builds
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/smith/llvm/23.1.3-r11/prove
            ~/.cache/smith/llvm/23.1.3-r11/prove-work
            ~/.cache/smith/llvm/23.1.3-r11/packages
            ~/.cache/smith/llvm/23.1.3-r11/enzyme-work
            ~/.cache/smith/enzyme
          key: prover-dev-${{ github.run_id }}
      - name: Build smith
        run: |
          .smith/stage0-tool
          smith=$(ls "$PWD"/build/*/smith | head -n 1)
          echo "SMITH=$smith" >>"$GITHUB_ENV"
      - name: Prove and autodiff tests
        run: |
          rc=0
          "$SMITH" test --test prove_checks_test,prove_memory_test,prove_misc_test,prove_smith_test,prove_sound_test,prove_test,autodiff_test 2>&1 | tee "$RUNNER_TEMP/test.log" || rc=${PIPESTATUS[0]}
          grep -E '^[0-9]+ passed|^FAIL ' "$RUNNER_TEMP/test.log" | sort | uniq -c | sort -rn | head -60
          exit $rc
      - name: Upload the logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: .smith/log
          if-no-files-found: ignore
          retention-days: 3
