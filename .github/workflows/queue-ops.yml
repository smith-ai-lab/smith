# Merge-queue operations the lead starts with `actions_run_trigger` (#2828).
# A Claude Code session cannot reach GitHub's GraphQL API, and jumping or
# dequeuing a queue entry exists only there; a job on a runner can.
name: queue-ops
# the run list shows what the run did: ops (a list) or op and pr
run-name: "queue-ops: ${{ inputs.ops != '' && inputs.ops || format('{0} {1}', inputs.op, inputs.pr) }}"

on:
  workflow_dispatch:
    inputs:
      ops:
        description: "Several ops in order, one per line (or separated by ;): '<op> <pr>', e.g. 'jump 2864' / 'dequeue 2784'. Replaces op and pr when set (#2872)"
        required: false
        type: string
      op:
        description: "What to do (ignored when ops is set)"
        required: false
        type: choice
        options:
          - jump
          - dequeue
          - enqueue
          - enqueue-many
          - cancel-pr-runs
          - rerun-failed
          - set-build-entries
          - delete-branch
      pr:
        description: "Pull request number (jump, dequeue, enqueue, rerun-failed); enqueue-many: numbers separated by spaces"
        required: false
        type: string
      value:
        description: "set-build-entries: max_entries_to_build, 1 to 10; delete-branch: the branch's name"
        required: false
        type: string
      dry_run:
        description: "Run every read, skip every write and print 'dry-run: would <op> <args>' instead (#2934); test a PR that changes this file by dispatching it on the PR's branch"
        required: false
        type: boolean
        default: false

permissions:
  # write: delete-branch deletes a ref; every other op only reads the contents
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: queue-ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPS: ${{ inputs.ops }}
      OP: ${{ inputs.op }}
      PR: ${{ inputs.pr }}
      VALUE: ${{ inputs.value }}
      # only a workflow_dispatch has the input; the string is empty on every other event
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      BASE_TOKEN: ${{ github.token }}
      OWNER_TOKEN: ${{ secrets.QUEUE_OPS_TOKEN }}
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the op
        shell: bash
        run: |
          set -u
          # a dry run (#2934) skips every write and prints what it would do; reads run as usual
          dry() { [ "$DRY_RUN" = true ]; }
          summary() { echo "queue-ops: op=$OP pr=${PR:-none} result=$1 actor=$ACTOR" | tee -a "$GITHUB_STEP_SUMMARY"; }

          needs_pr() {
            case "$PR" in
              ''|*[!0-9]*) summary "refused: op $OP needs pr, a number"; exit 1 ;;
            esac
          }

          pr_id() { gh api "repos/$REPO/pulls/$PR" --jq .node_id; }

          # takes the PR out of the queue; nothing to do when it is not in it. The entry lookup is only the
          # in-queue test: dequeuePullRequest takes the PULL REQUEST's node id, not the entry's (2026-11-08)
          dequeue_pr() {
            local entry
            entry=$(gh api graphql -f query='
              query($id: ID!) { node(id: $id) { ... on PullRequest { mergeQueueEntry { id } } } }' \
              -f id="$(pr_id)" --jq '.data.node.mergeQueueEntry.id // empty') || return 1
            [ -z "$entry" ] && return 0
            if dry; then echo "dry-run: would dequeue #$PR"; return 0; fi
            gh api graphql -f query='
              mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' \
              -f id="$(pr_id)" --silent
          }

          # `dequeued` marks a PR taken out of the queue on purpose, so queue-heal (#2900) does not queue it again: an
          # API dequeue leaves no `removed_from_merge_queue` on the timeline. `dequeue` sets it; enqueue and jump clear it.
          mark_dequeued() { if dry; then echo "dry-run: would label #$PR dequeued"; return 0; fi; gh api -X POST "repos/$REPO/issues/$PR/labels" -f 'labels[]=dequeued' --silent || echo "label dequeued: not set"; }
          clear_dequeued() { if dry; then echo "dry-run: would unlabel #$PR dequeued"; return 0; fi; gh api -X DELETE "repos/$REPO/issues/$PR/labels/dequeued" --silent 2>/dev/null || true; }

          # the queue's PR numbers, front first
          queue_order() {
            gh api graphql -f owner="${REPO%/*}" -f name="${REPO#*/}" -f query='
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  mergeQueue(branch: "main") { entries(first: 30) { nodes { position pullRequest { number } } } }
                }
              }' --jq '[.data.repository.mergeQueue.entries.nodes | sort_by(.position)[] | "#\(.pullRequest.number)"] | join(" ")'
          }

          do_op() {
            case "$OP" in
              jump|enqueue)
                needs_pr
                local jump=false
                [ "$OP" = jump ] && jump=true
                # a PR already in the queue cannot be enqueued again: take it out first (jump, 2026-11-08)
                [ "$jump" = true ] && { dequeue_pr || return 1; }
                clear_dequeued
                # print what GitHub says about the entry (position, jump) and the queue now and 10 s later: the
                # mutation's position alone was not reliable (jump put a PR third, 2026-11-08)
                if dry; then echo "dry-run: would $OP #$PR (jump=$jump)"; echo "queue: $(queue_order)"; return 0; fi
                gh api graphql -f query='
                  mutation($id: ID!, $jump: Boolean) {
                    enqueuePullRequest(input: {pullRequestId: $id, jump: $jump}) {
                      mergeQueueEntry { id position jump state }
                    }
                  }' -f id="$(pr_id)" -F jump="$jump" \
                  --jq '.data.enqueuePullRequest.mergeQueueEntry | "entry: position=\(.position) jump=\(.jump) state=\(.state)"' \
                  || return 1
                echo "queue: $(queue_order)"
                sleep 10
                echo "queue after 10 s: $(queue_order)" ;;
              enqueue-many)
                # a burst in one job (#2851): the queue's batching window (60 s, scripts/batch_wait.c) gathers the
                # groups of entries enqueued a few seconds apart; one op per PR took a run of about a minute each, and
                # a pending op was dropped when a newer one arrived (2026-11-09 00:53). A PR already in the queue is
                # skipped, so the retry with the owner's token enqueues only the ones that failed.
                local list="$PR" n failed=0 queued=0 entry
                [ -n "$list" ] || { echo "enqueue-many needs pr: numbers separated by spaces"; return 2; }
                for n in $list; do
                  case "$n" in ''|*[!0-9]*) echo "not a number: $n"; return 2 ;; esac
                done
                for n in $list; do
                  PR=$n
                  entry=$(gh api graphql -f query='
                    query($id: ID!) { node(id: $id) { ... on PullRequest { mergeQueueEntry { id } } } }' \
                    -f id="$(pr_id)" --jq '.data.node.mergeQueueEntry.id // empty') || { failed=$((failed + 1)); continue; }
                  [ -n "$entry" ] && { echo "#$n already queued"; continue; }
                  clear_dequeued
                  if dry; then echo "dry-run: would enqueue #$n"; queued=$((queued + 1)); continue; fi
                  if gh api graphql -f query='
                    mutation($id: ID!) { enqueuePullRequest(input: {pullRequestId: $id}) { mergeQueueEntry { id } } }' \
                    -f id="$(pr_id)" --silent; then
                    echo "#$n enqueued"; queued=$((queued + 1))
                  else
                    echo "#$n failed"; failed=$((failed + 1))
                  fi
                  sleep 3
                done
                PR=$list
                echo "enqueued $queued, failed $failed; queue: $(queue_order)"
                [ "$failed" = 0 ] ;;
              dequeue)
                needs_pr
                dequeue_pr || return 1
                mark_dequeued
                echo "queue: $(queue_order)" ;;
              cancel-pr-runs)
                local n=0 run pr files
                # a PR check is a workflow_dispatch run (#2856), whose run carries no PR number:
                # the PR is found by the run's branch. A force-cancelled check leaves no `ci`, so ci-dispatch starts it
                # again when there is room
                for run in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=workflow_dispatch&status=queued&per_page=100" --paginate --jq '.workflow_runs[] | "\(.id):\(.head_branch)"'); do
                  pr=$(gh api "repos/$REPO/pulls?head=${REPO%/*}:${run#*:}&state=open" --jq '.[0].number // 0')
                  if [ "$pr" != 0 ] && gh api "repos/$REPO/pulls/$pr/files" --paginate --jq '.[].filename' | grep -q '^\.github/'; then
                    continue
                  fi
                  if dry; then echo "dry-run: would force-cancel run ${run%%:*} (${run#*:})"; n=$((n + 1)); continue; fi
                  gh api -X POST "repos/$REPO/actions/runs/${run%%:*}/force-cancel" --silent && n=$((n + 1))
                done
                echo "cancelled $n" ;;
              rerun-failed)
                needs_pr
                local sha run_id
                sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha) || return 1
                run_id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=workflow_dispatch&head_sha=$sha&per_page=1" --jq '.workflow_runs[0].id // empty') || return 1
                if [ -z "$run_id" ]; then echo "no-run"; return 1; fi
                if dry; then echo "dry-run: would rerun failed jobs of run $run_id"; return 0; fi
                gh api -X POST "repos/$REPO/actions/runs/$run_id/rerun-failed-jobs" --silent && echo "rerun $run_id" ;;
              set-build-entries)
                case "$VALUE" in [1-9]|10) ;; *) echo "value must be 1 to 10"; return 2 ;; esac
                local id rules
                id=$(gh api "repos/$REPO/rulesets" --jq '.[] | select(.name == "main") | .id') || return 1
                [ -n "$id" ] || { echo "no ruleset main"; return 1; }
                gh api "repos/$REPO/rulesets/$id" \
                  | jq --argjson n "$VALUE" '{name, target, enforcement, bypass_actors, conditions,
                      rules: (.rules | map(if .type == "merge_queue" then .parameters.max_entries_to_build = $n else . end))}' \
                  > /tmp/ruleset.json
                if dry; then echo "dry-run: would set max_entries_to_build=$VALUE"; return 0; fi
                gh api -X PUT "repos/$REPO/rulesets/$id" --input /tmp/ruleset.json --silent && echo "max_entries_to_build=$VALUE" ;;
              delete-branch)
                # a stray branch (no open pull request) the lead cannot delete from a session: a session's git
                # pushes reach only its own branch. Refused: the default branch, the queue's branches, a branch
                # with an open pull request (close the pull request first; GitHub then offers the delete).
                local b="$VALUE" default open
                case "$b" in
                  ''|*[!A-Za-z0-9._/-]*|*..*|/*|*/) echo "value must be a branch name"; return 2 ;;
                  gh-readonly-queue/*) echo "refused: a merge queue branch"; return 2 ;;
                esac
                default=$(gh api "repos/$REPO" --jq .default_branch) || return 1
                [ "$b" != "$default" ] || { echo "refused: the default branch"; return 2; }
                open=$(gh api "repos/$REPO/pulls?head=${REPO%/*}:$b&state=open" --jq 'length') || return 1
                [ "$open" = 0 ] || { echo "refused: $b has an open pull request"; return 2; }
                gh api "repos/$REPO/git/ref/heads/$b" --jq '"branch \(.ref) at \(.object.sha)"' || return 1
                if dry; then echo "dry-run: would delete branch $b"; return 0; fi
                gh api -X DELETE "repos/$REPO/git/refs/heads/$b" --silent && echo "deleted $b" ;;
              *) echo "unknown op"; return 2 ;;
            esac
          }

          # GITHUB_TOKEN first; the owner's secret only when GitHub refuses. One op, with OP, PR and VALUE set.
          run_one() {
            export GH_TOKEN="$BASE_TOKEN"
            if out=$(do_op 2>&1); then
              summary "ok ($out) token=GITHUB_TOKEN"
              return 0
            fi
            echo "GITHUB_TOKEN: $out"
            if [ -n "$OWNER_TOKEN" ]; then
              export GH_TOKEN="$OWNER_TOKEN"
              if out=$(do_op 2>&1); then
                summary "ok ($out) token=QUEUE_OPS_TOKEN"
                return 0
              fi
              echo "QUEUE_OPS_TOKEN: $out"
            fi
            summary "failed ($(echo "$out" | tail -n 1 | cut -c1-200))"
            return 1
          }

          # the ops as lines '<op> <rest>': OPS (lines or ';') when set, else the op and pr inputs as a list of one
          op_lines() {
            if [ -n "${OPS//[[:space:]]/}" ]; then
              printf '%s\n' "$OPS" | tr ';' '\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d'
            else
              echo "$OP $PR"
            fi
          }

          failed=0 total=0
          lines=$(op_lines)
          while IFS= read -r line; do
            total=$((total + 1))
            OP=${line%% *}
            PR=""
            [ "$OP" != "$line" ] && PR=${line#* }
            VALUE=${VALUE:-}
            [ -n "$OPS" ] && VALUE=$PR
            run_one || failed=$((failed + 1))
          done <<< "$lines"
          echo "queue-ops: $total op(s), $failed failed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" = 0 ]
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
