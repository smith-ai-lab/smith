# One-off, on this branch only, never merged: deletes the old runs of workflows whose files are gone from main (and of
# mac-fetch-check, deleted by #3290), so GitHub stops listing them. Owner, 2026-11-12: "yeah ghosts gone please".
name: queue-ops
run-name: "one-off: delete the runs of removed workflows"

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete the runs
        run: |
          for wf in 401411438 411469165 411335445 401193576 401758681; do
            for run in $(gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=100" --jq '.workflow_runs[].id'); do
              gh api -X DELETE "repos/$REPO/actions/runs/$run" --silent && echo "deleted run $run of workflow $wf"
            done
            echo "workflow $wf: $(gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=1" --jq .total_count) runs left"
          done
