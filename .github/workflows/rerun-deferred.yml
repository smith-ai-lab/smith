name: rerun-deferred

# The merge queue comes first (#2822). A pull request's `ci` run that found a merge-queue run queued or in progress
# was deferred (its job `queue-first` has a passing step `Deferred`, and `ci` failed with `deferred:`). When a
# merge-queue run of `ci` ends, this workflow checks that none is still queued or in progress and then starts the
# deferred runs again, oldest first, for open pull requests whose run is on the current head. Event-driven: no
# schedule, no polling. It runs the default branch's copy of this file, with `GITHUB_TOKEN` (`actions: write`).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write
  pull-requests: read
  contents: read

jobs:
  rerun:
    if: github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start the deferred pull request runs again
        run: |
          for status in queued in_progress; do
            n=$(gh api -X GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" -f event=merge_group -f status="$status" \
              -f per_page=1 --jq .total_count)
            if [ "$n" != 0 ]; then
              echo "a merge queue run is still $status: nothing to start yet" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          # failed pull request runs of the last day, oldest first, one per head commit
          runs=$(gh api -X GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" -f event=pull_request -f status=failure \
            -f per_page=100 --jq '[.workflow_runs[] | select(.pull_requests | length > 0)] | sort_by(.created_at)
              | .[] | "\(.id) \(.head_sha) \(.pull_requests[0].number)"')
          started=0
          while read -r id sha pr; do
            [ -n "$id" ] || continue
            # only a run on the PR's current head, and only while the PR is open
            head=$(gh api "repos/$GH_REPO/pulls/$pr" --jq 'select(.state == "open") | .head.sha') || continue
            [ "$head" = "$sha" ] || continue
            deferred=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq \
              '[.jobs[] | select(.name == "queue-first") | .steps[] | select(.name == "Deferred" and .conclusion == "success")] | length')
            [ "${deferred:-0}" != 0 ] || continue
            gh api -X POST "repos/$GH_REPO/actions/runs/$id/rerun" >/dev/null || continue
            echo "started run $id of #$pr again" | tee -a "$GITHUB_STEP_SUMMARY"
            started=$((started + 1))
          done <<<"$runs"
          echo "deferred runs started again: $started" | tee -a "$GITHUB_STEP_SUMMARY"
