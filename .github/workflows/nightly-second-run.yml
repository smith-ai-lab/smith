# The nightly assertion of #3178: the whole check, run twice on smith itself with one store, does no work the second time.
# Not part of ci.yml: that file has no `schedule` trigger, and adding one would start all of it (macOS, the 8 test parts,
# the release jobs) every night. This is the one job, on its own, and it gates nothing: the failure message is the list
# of the steps that ran the second time, one for each line, and a failure opens nothing but this run's red mark.
name: nightly-second-run

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: nightly-second-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  second-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
      SMITH_OUTPUT: full
      SMITH_RESULT_CACHE: "on"
      SMITH_FMT_CACHE: why
      SMITH_LINT_CACHE: why
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-smith
        with:
          tests: "true"
      - name: Neovim 0.11+ for the editor tests
        run: |
          bin=$("$SMITH" build nvim | tail -n 1)
          echo "$bin" >>"$GITHUB_PATH"
      - name: The check, twice, on one store
        run: |
          # the awk program of tests/check_second_run_test.smith: `ran: <step>` for each step that did work
          cat >"$RUNNER_TEMP/ran.awk" <<'AWK'
          /^smith fmt: [0-9]+ files:/ { n = $0; sub(/.* files: /, "", n); if (n + 0 > 0) print "ran: fmt " n + 0 " run" }
          /^smith lint: linted / { n = $0; sub(/.*files \(/, "", n); if (n + 0 > 0) print "ran: lint " n + 0 " run" }
          /^\[[0-9]+\/[0-9]+\] / { if ($0 !~ /\(cached\)/ && $0 !~ /[.]smith[/]program --run/) { s = $0; sub(/^\[[0-9]+\/[0-9]+\] /, "", s); print "ran: " s } }
          /^[0-9]+ passed, [0-9]+ failed/ { passed = $1 + 0 }
          /^[0-9]+ cached: / { cached = $1 + 0 }
          /^[0-9]+ proved, [0-9]+ failed/ { n = $1 + 0; k = 0; if (match($0, /, [0-9]+ cached/)) k = substr($0, RSTART + 2, RLENGTH - 2) + 0; if (n > k) print "ran: prove " n - k " run" }
          END { if (passed > cached) print "ran: tests " passed - cached " run" }
          AWK
          rc1=0
          "$SMITH" check 2>&1 | tee "$RUNNER_TEMP/first.log" || rc1=${PIPESTATUS[0]}
          rc2=0
          "$SMITH" check 2>&1 | tee "$RUNNER_TEMP/second.log" || rc2=${PIPESTATUS[0]}
          awk -f "$RUNNER_TEMP/ran.awk" "$RUNNER_TEMP/second.log" | sort >"$RUNNER_TEMP/ran.txt"
          {
            echo "first run: exit $rc1; second run: exit $rc2"
            echo "steps that ran the second time: $(wc -l <"$RUNNER_TEMP/ran.txt")"
            sed 's/^ran: /  /' "$RUNNER_TEMP/ran.txt"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc1" != 0 ] || [ "$rc2" != 0 ] || [ -s "$RUNNER_TEMP/ran.txt" ]; then
            echo "::error::the second check was not free: $(wc -l <"$RUNNER_TEMP/ran.txt") steps ran (first exit $rc1, second exit $rc2); the list is in the run's summary"
            exit 1
          fi

  records:
    # #3434: the execution records of #456/#3387, which key a test that runs smith by the smith functions it executed.
    # Only a coverage run writes them (`COVERAGE=1 smith build test-units`, about 10 minutes of test stage, an
    # instrumented build of about 6.8 GB), so this job does, on main, once a night (they go stale about 2.8% in 10
    # merges, #3387). They are published as the prerelease `test-records-<sha7>` with one asset,
    # `smith-test-records.tar.gz` (`records/*.rec`), which `./.github/actions/test-cache` and `smith build stage0` unpack
    # into `.smith/records`. Releases are immutable, so a new tag a night; the 3 newest are kept. It gates nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # `gh release create` of the records
    env:
      GH_TOKEN: ${{ github.token }}
      SMITH_CORES: "4"
      SMITH_OUTPUT: full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-smith
        with:
          tests: "true"
      - name: Free disk for the instrumented build
        run: |
          free=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          echo "disk: ${free} GB free before the coverage run" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$free" -lt 10 ]; then
            echo "::error::only ${free} GB free; the coverage run needs more than 5 GB (the instrumented units runner and front-project are about 6.8 GB)"
            exit 1
          fi
      - name: The coverage run
        run: |
          start=$SECONDS
          COVERAGE=1 "$SMITH" build test-units 2>&1 | tail -n 40
          n=$(find .smith/records -name '*.rec' 2>/dev/null | wc -l)
          echo "records: $n written, $((SECONDS - start)) s" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -lt 1000 ]; then echo "::error::the coverage run wrote only $n records"; exit 1; fi
      - name: Publish the records
        run: |
          set -eu
          tag="test-records-${GITHUB_SHA:0:7}"
          out="$RUNNER_TEMP/records"; mkdir -p "$out"
          tar -C .smith -c records | gzip -6 >"$out/smith-test-records.tar.gz"
          echo "$GITHUB_SHA" >"$out/smith-test-records.sha"
          if gh release view "$tag" >/dev/null 2>&1; then gh release delete "$tag" --cleanup-tag --yes; fi
          gh release create "$tag" "$out/smith-test-records.tar.gz" "$out/smith-test-records.sha" --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "test records $tag" \
            --notes "The execution records (.smith/records/*.rec) of a COVERAGE=1 run at $GITHUB_SHA (#3434). Not a release of smith."
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[]|select(.tagName|test("^test-records-[0-9a-f]{7}$"))]|sort_by(.createdAt)|reverse|.[3:]|.[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes >/dev/null 2>&1 || echo "::warning::could not delete release $old"; done
          echo "records: published $tag, $(find .smith/records -name '*.rec' | wc -l) files, $(du -h "$out/smith-test-records.tar.gz" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
