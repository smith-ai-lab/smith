name: release

# Runs after a merge, never for a pull request or the merge queue, so it
# cannot hold one up. It publishes a release when the merge changed what the
# compiler does, and never deletes or replaces one.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the version and the notes
        id: plan
        run: |
          set -eu
          echo 'targets=[{"target":"linux_x64","os":"ubuntu-latest"},{"target":"macos_arm64","os":"macos-latest"},{"target":"linux_arm64","os":"ubuntu-24.04-arm"},{"target":"macos_x64","os":"macos-15-intel"},{"target":"windows_x64","os":"windows-latest"},{"target":"windows_arm64","os":"windows-11-arm"}]' >> "$GITHUB_OUTPUT"
          # A commit already inside a release makes no second one, so a
          # rerun for the same merge changes nothing.
          if [ -n "$(git tag --list 'v[0-9]*' --contains "$GITHUB_SHA")" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*' --merged "$GITHUB_SHA" --sort=-v:refname | head -n 1)
          if [ -n "$last" ]; then
            range="$last..$GITHUB_SHA"
            previous=${last#v}
          else
            range="$GITHUB_SHA"
            previous=none
          fi
          git log --format=%s "$range" > "$RUNNER_TEMP/subjects"
          version=$(sh .github/next-version.sh "$previous" < "$RUNNER_TEMP/subjects")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sed 's/^/- /' "$RUNNER_TEMP/subjects" > notes.md
      - name: Keep the notes for the job that publishes
        if: steps.plan.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  # GitHub ends a job that waits about fifteen minutes for a machine as
  # `cancelled`, without a step run, and nothing here sets that limit. So a
  # target whose job never started is built again, twice at most, by `build2`
  # and `build3`, and `built` judges each target by its newest job. Which
  # builds never started is read from the list of jobs, never from the result
  # GitHub gives the matrix.
  build:
    name: build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      version: ${{ needs.plan.outputs.version }}

  lost1:
    name: which machines were not found
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      targets: ${{ steps.lost.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: lost
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          set -eu
          sh .github/job-states.sh "build " > states
          os=$(sh .github/never-started.sh retry < states | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "targets=$(echo "$TARGETS" | jq -c --argjson lost "$os" 'map(select(.os as $os | $lost | index($os)))')" >> "$GITHUB_OUTPUT"

  build2:
    name: build ${{ matrix.target }}
    needs: [plan, lost1]
    if: ${{ !cancelled() && needs.lost1.outputs.targets != '' && needs.lost1.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.lost1.outputs.targets) }}
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      version: ${{ needs.plan.outputs.version }}

  lost2:
    name: which machines were still not found
    needs: [plan, lost1, build2]
    if: ${{ !cancelled() && needs.lost1.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      targets: ${{ steps.lost.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: lost
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          set -eu
          sh .github/job-states.sh "build " > states
          os=$(sh .github/never-started.sh retry < states | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "targets=$(echo "$TARGETS" | jq -c --argjson lost "$os" 'map(select(.os as $os | $lost | index($os)))')" >> "$GITHUB_OUTPUT"

  build3:
    name: build ${{ matrix.target }}
    needs: [plan, lost2]
    if: ${{ !cancelled() && needs.lost2.outputs.targets != '' && needs.lost2.outputs.targets != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.lost2.outputs.targets) }}
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      version: ${{ needs.plan.outputs.version }}

  built:
    name: every target is built
    needs: [plan, build, build2, build3]
    if: ${{ !cancelled() && needs.plan.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          set -eu
          wanted=$(echo "$TARGETS" | jq -r '.[].os')
          sh .github/job-states.sh "build " > states
          result=$(sh .github/never-started.sh result $wanted < states)
          echo "the builds gave $result"
          test "$result" = success

  # `build2`, `build3` and the jobs between them are skipped when nothing was
  # lost, and a job without a condition is skipped when any job before it, at
  # any distance, was. So this says when it runs: `built` succeeded, which it
  # does only when the newest build of every target did.
  publish:
    name: publish v${{ needs.plan.outputs.version }}
    needs: [plan, built]
    if: ${{ !cancelled() && needs.built.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # Only this job may write, and only to make a release.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -eu
          mkdir files
          cp parts/smith-*/* files/
          (cd files && sha256sum smith-* > SHA256SUMS)
          # Never replaced: a release that already exists is left alone.
          if gh release view "v$VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "v$VERSION" files/* \
            --repo "$REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file parts/notes/notes.md

  # A run that planned a version and did not publish it is a failed run. This
  # is the only job that says so when no job before it failed.
  verdict:
    name: the version was published
    needs: [plan, built, publish]
    if: ${{ !cancelled() && needs.plan.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
          BUILT: ${{ needs.built.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          echo "v$VERSION: the builds gave $BUILT and publish gave $PUBLISH"
          test "$PUBLISH" = success
