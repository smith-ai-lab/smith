name: llvm

# The LLVM pack (issue #797, knowledge/llvm-build.md): what smith links and embeds of its LLVM, built on GitHub's hosted
# runners and published as the release `llvm-<name>-<os>-<arch>` (llvm-23.1.3-r11-darwin-arm64), so that every other
# hosted job downloads it (`smith build llvm`) instead of building LLVM for hours. When the release of a configuration
# exists, a run does nothing.
#
# Run it by hand (workflow_dispatch) the first time: nothing publishes the packs before that.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "scripts/llvm.sh"
      - "scripts/llvm_linux.c"
      - "scripts/llvm_pack.c"
      - "scripts/sha256.h"
      - ".github/workflows/llvm.yml"

permissions:
  contents: write # gh release create

jobs:
  macos:
    runs-on: macos-26
    # the hosted job limit is 6 hours; a build that would not fit is split into chained jobs that hand the build folder on
    timeout-minutes: 350
    concurrency:
      group: llvm-macos
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      # smith's floor (knowledge/deployment-target.md): LLVM's objects are built for it, not for the runner's macOS
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@v4
        with:
          # the bootstrap finds the stage0 release of the newest ancestor commit
          fetch-depth: 0

      - name: Is there a pack for this configuration
        id: pack
        run: |
          name=$(sed -n 's/.*"SMITH_LLVM_NAME", "\([^"]*\)".*/\1/p' build.c | head -1)
          tag="llvm-$name-darwin-arm64"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag exists: nothing to do"
            echo "build=false" >>"$GITHUB_OUTPUT"
          else
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Machine
        if: steps.pack.outputs.build == 'true'
        run: |
          sysctl -n hw.ncpu hw.memsize
          df -h /
          xcrun --show-sdk-path

      # smith is built by its previous release: the tool downloads the stage0 release of the newest ancestor commit and
      # runs its `smith build` with the arguments given (smith-dev-build). `smith build llvm` needs no LLVM to run.
      - name: Bootstrap smith
        if: steps.pack.outputs.build == 'true'
        run: |
          mkdir -p .smith
          clang -std=c23 -x c scripts/stage0.c -o .smith/stage0-tool

      - name: Build LLVM
        if: steps.pack.outputs.build == 'true'
        run: .smith/stage0-tool llvm -Dfetch=0

      - name: Publish the pack
        if: steps.pack.outputs.build == 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          df -h /
          .smith/stage0-tool llvm-publish

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: llvm-linux
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Is there a pack for this configuration
        id: pack
        run: |
          name=$(sed -n 's/.*"SMITH_LLVM_NAME", "\([^"]*\)".*/\1/p' build.c | head -1)
          tag="llvm-$name-linux-$(uname -m)"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag exists: nothing to do"
            echo "build=false" >>"$GITHUB_OUTPUT"
          else
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Machine
        if: steps.pack.outputs.build == 'true'
        run: |
          nproc
          free -g
          df -h /
          cmake --version | head -1
          ninja --version
          python3 --version

      # Linux has no smith before this runs (its own release chain starts from the seed, scripts/seed_linux.c), so the
      # build is scripts/llvm_linux.c, a plain C23 program, on the pinned sources, as the seed does it (stage 1), and the
      # pack program is plain C too.
      - name: Build LLVM
        if: steps.pack.outputs.build == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/llvm"
          url=https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/llvm-project-23.1.3.src.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/llvm.tar.xz" "$url"
          echo "c44186a7762ed28954be72e5ff6df9808e0779d4f1bf014ecc4e7e211d31ee34  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP/llvm" --strip-components=1
          cc -std=gnu2x -O1 -x c scripts/llvm_linux.c -o "$RUNNER_TEMP/llvm_linux"
          SMITH_LLVM_NAME=${{ steps.pack.outputs.name }} "$RUNNER_TEMP/llvm_linux" "$RUNNER_TEMP/llvm" "" "" "$RUNNER_TEMP/llvm.stamp" ""

      - name: Publish the pack
        if: steps.pack.outputs.build == 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          df -h /
          cc -std=gnu2x -O1 scripts/llvm_pack.c -o "$RUNNER_TEMP/llvm_pack"
          "$RUNNER_TEMP/llvm_pack" publish "$HOME/.cache/smith" "${{ steps.pack.outputs.name }}"
