name: machine-test

# The tests that depend on the machine, on one kind of machine. `ci` calls it
# once for each kind, and again for a kind whose job never started.
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        working-directory: bootstrap
    steps:
      - uses: actions/checkout@v6
      # What `decide` built every case to, which this machine must build to as well.
      - uses: actions/download-artifact@v4
        with:
          name: case-hashes
          path: ${{ runner.temp }}/case-hashes
      - name: Test
        env:
          SMITH_HASHES: ${{ runner.temp }}/case-hashes/case-hashes
        run: cargo test --locked -- --group=machine
