name: check

# The merge train: a pull request runs no CI. The lead's lander stacks the pull requests labelled `ready` on main and
# pushes the stack to `train`; one check covers the batch, and main moves only to a tree a green run checked. On
# 2026-10-26 every push to a pull request queued its own full check and main sat still for 2.5 hours.
on:
  push:
    branches: [main, train]

# A new train cancels the older one (the lander replaced it); runs on main never cancel each other.
concurrency:
  group: check-${{ github.ref == 'refs/heads/train' && 'train' || github.sha }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/train' }}

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # the docs gate (check-docs-gate) compares the branch with origin/main, so it needs the history
          fetch-depth: 0

      - name: Environment
        run: |
          # the runner service reads no shell profile
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          name=$(sed -n 's/.*"SMITH_LLVM_NAME", "\([^"]*\)".*/\1/p' build.c | head -1)
          dir="$HOME/.cache/smith/llvm/$name"
          if [ ! -d "$dir" ]; then
            echo "::error::$dir is missing: the lead must run 'smith build llvm' on this Mac; CI never does."
            exit 1
          fi

      - name: Was this tree already checked
        id: tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a push whose tree a green run already checked skips the Full check: main after a train merges is the tree the
          # train's run checked (scripts/ci-tree.sh)
          export PATH="/opt/homebrew/bin:$PATH"
          tree=$(sh scripts/ci-tree.sh tree)
          echo "tree=$tree" >>"$GITHUB_OUTPUT"
          set -- $(sh scripts/ci-tree.sh decide "$GITHUB_EVENT_NAME" "$tree")
          if [ "$1" = skip ]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::the full check is skipped: tree $tree was already checked by run $2"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Debugger permission
        if: steps.tree.outputs.skip != 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          id
          DevToolsSecurity -status || true
          env | sort | grep -vi token || true
          dir=$(mktemp -d)
          printf 'int main(void){return 3;}\n' >"$dir/t.c"
          smith cc -g "$dir/t.c" -o "$dir/t"
          out=$(smith dbg --batch -o 'b main' -o run -o bt -o quit "$dir/t" 2>&1) || true
          echo "$out"
          case $out in
          *"stop reason = breakpoint"*) ;;
          *)
            echo "::error::the runner may not debug: see knowledge/debugger.md"
            exit 1
            ;;
          esac

      - name: Build smith
        if: steps.tree.outputs.skip != 'true'
        env:
          # the checked smith counts the lines it runs, per test (knowledge/coverage-selection.md, #456)
          COVERAGE: "1"
        run: smith build

      - name: Changed tests first
        if: steps.tree.outputs.skip != 'true'
        # The tests this batch's changes select, by the records of main's latest green run (smith-records, fetched by
        # the build file's coverage-fetch task with gh), stopping at the first failure: a broken batch is red in minutes,
        # not after the full check (#506). The Full check below still names every failure. It only reads the records
        # (no COVERAGE: nothing is recorded), skips itself when the selection is wide (a change to the runner or to
        # build.c selects nearly everything, and the Full check runs that anyway) and gives up after 5 minutes without
        # failing: only a failed selected test makes it red.
        timeout-minutes: 8
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMITH_OUTPUT: full
          SMITH_PRIORITY: ci
          LLVM_PROFILE_FILE: /dev/null
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          git fetch -q origin main
          smith=build/Darwin-arm64/smith
          picked=$($smith test --changed --list origin/main 2>"$RUNNER_TEMP/list.err") || { cat "$RUNNER_TEMP/list.err"; echo "the selection failed, skipping"; exit 0; }
          files=$(git ls-files '*_test.smith' '*_test.c' | wc -l | tr -d ' ')
          n=$(printf '%s\n' "$picked" | grep -c . || true)
          echo "selected $n of $files test files"
          if [ "$n" -eq 0 ]; then echo "nothing selected"; exit 0; fi
          if [ "$picked" = '*' ] || [ $((n * 4)) -gt "$files" ]; then
            echo "selection too wide, skipping" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          start=$(date +%s)
          $smith test --changed --base origin/main --fail-fast >"$RUNNER_TEMP/changed.log" 2>&1 &
          pid=$!
          ( sleep 300; kill "$pid" 2>/dev/null ) &
          dog=$!
          rc=0
          wait "$pid" || rc=$?
          kill "$dog" 2>/dev/null || true
          tail -n 60 "$RUNNER_TEMP/changed.log"
          took=$(( $(date +%s) - start ))
          if [ "$rc" -eq 143 ]; then echo "changed tests: gave up after $took s, the Full check decides" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          echo "changed tests ended with status $rc after $took s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Full check
        if: steps.tree.outputs.skip != 'true'
        # 45, not 25: the host runs CI beside the lanes' builds, and under that load checks were cut off at 25 minutes with no test failing (#391, #401, #406, #393 on 2026-10-26). #360 brings it back down.
        # no shared lock: CI runs in its own clone and must not queue behind the agents' local checks.
        # The step ends before the job does, so the log steps below always run.
        timeout-minutes: 45
        shell: bash
        env:
          # the per-task table (wall, cpu, processes) goes to .smith/log/test.log, kept in the artifact
          SMITH_ACCOUNT: all
          # a waiting CI job gets the next host-wide slot before any local job (knowledge/slots.md)
          SMITH_PRIORITY: ci
          COVERAGE: "1"
        run: |
          ci="$RUNNER_TEMP/ci"
          mkdir -p "$ci"
          echo "check started at $(date)" | tee "$ci/time.log"
          rc=0
          # the output is written to the log and to this job's own log as it comes
          build/Darwin-arm64/smith check 2>&1 | tee "$ci/check.log" || rc=${PIPESTATUS[0]}
          echo "check ended with status $rc at $(date)" | tee -a "$ci/time.log"
          # the job log truncates a long failure; the failing tasks and cases, named last, need no artifact
          if [ "$rc" -ne 0 ]; then
            {
              echo '--- what failed ---'
              { cat "$ci/check.log"; find .smith/log -name '*.log' -exec cat {} + 2>/dev/null; } |
                grep -E '^FAILED:|^FAIL ' | sort -u | head -n 60
            } | tee "$ci/failed.log"
          fi
          {
            echo '### smith check'
            cat "$ci/time.log"
            if [ -s "$ci/failed.log" ]; then
              echo '```'
              cat "$ci/failed.log"
              echo '```'
            fi
            echo '```'
            tail -n 40 "$ci/check.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Record the checked tree
        if: success() && steps.tree.outputs.skip != 'true'
        run: sh scripts/ci-tree.sh record "${{ steps.tree.outputs.tree }}" "$RUNNER_TEMP/tree"

      - name: Record the coverage
        id: coverage
        if: success() && steps.tree.outputs.skip != 'true'
        run: |
          # the table of which functions each test ran (.smith/coverage/coverage.tsv) and the report of the lines this batch
          # changed that no test ran; a flag in the job summary, never a failure
          dir="$RUNNER_TEMP/coverage"
          mkdir -p "$dir"
          if [ -s .smith/coverage/coverage.tsv ]; then
            cp .smith/coverage/coverage.tsv "$dir/coverage.tsv"
            git fetch -q origin main || true
            build/Darwin-arm64/smith test --coverage report "$dir/coverage.tsv" origin/main "$dir/coverage-report.txt" || true
            {
              echo '### coverage'
              echo '```'
              grep -E '^(coverage|changed)' "$dir/coverage-report.txt" || true
              grep -c '^uncovered' "$dir/coverage-report.txt" | sed 's/$/ changed lines no test ran/' || true
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            echo "have=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload the records
        if: success() && steps.coverage.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          # shared records (knowledge/coverage-selection.md): any clone brings them in with its coverage-fetch task
          name: smith-records
          path: .smith/records
          retention-days: 7

      - name: Upload the coverage
        if: success() && steps.coverage.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: ${{ runner.temp }}/coverage
          retention-days: 7

      - name: Upload the checked tree
        if: success() && steps.tree.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tree
          retention-days: 7

      - name: Collect the logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          [ -d .smith/log ] && cp -R .smith/log "$RUNNER_TEMP/ci/smith-log" || true
          ps -axo pid,ppid,stat,time,etime,command | tee "$RUNNER_TEMP/ci/processes.log" | grep -E 'actions-runner|smith|slice' | grep -v grep || true

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: ${{ runner.temp }}/ci
          if-no-files-found: warn

  install:
    # after a green check on main only; replaces the lead's manual install
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    # one install or release at a time; a newer pending run replaces an older pending one
    concurrency:
      group: main-install
      cancel-in-progress: false
    env:
      SMITH_PRIORITY: ci # it is CI's work: it gets the next host-wide slot before any local job (knowledge/slots.md)
    steps:
      - uses: actions/checkout@v4
      - name: Is this still the head of main
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # two runners can run two main pushes at once: only the newest commit installs and releases
          export PATH="/opt/homebrew/bin:$PATH"
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$GITHUB_SHA" ]; then echo "current=true" >>"$GITHUB_OUTPUT"
          else echo "current=false" >>"$GITHUB_OUTPUT"; echo "skipped: main is already at $current"; fi
      - name: Install
        if: steps.head.outputs.current == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          smith build
          # the check job already ran the suite on this tree: install without running it again
          build/Darwin-arm64/smith build install -DNOTESTS

  release:
    # a job of its own after install, so a failure here cannot fail the check or the install; only it may write
    needs: install
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: main-install
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Is this still the head of main
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # two runners can run two main pushes at once: only the newest commit installs and releases
          export PATH="/opt/homebrew/bin:$PATH"
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$GITHUB_SHA" ]; then echo "current=true" >>"$GITHUB_OUTPUT"
          else echo "current=false" >>"$GITHUB_OUTPUT"; echo "skipped: main is already at $current"; fi
      - name: Release
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          gh --version
          smith build
          build/Darwin-arm64/smith build release
