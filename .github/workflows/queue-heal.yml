# Finds a pull request the merge queue lost and queues it again (#2900). On 2026-11-09 #2885 got `added_to_merge_queue`
# at 07:04:49Z but never had a queue entry (no `merge_group` run, absent from the queue's list), and sat 75 minutes until
# a runner noticed. Every 10 minutes (and by hand) this job lists the queue's entries on `main`, and re-queues each open
# PR whose last merge-queue event is `added_to_merge_queue`, older than 15 minutes, with no entry in that list, unless
# it carries the label `dequeued` (queue-ops' `dequeue` sets it, enqueue and jump clear it). A second pass (#2902) judges
# the front entry: when the newest `merge_group` run of ci for its branch has failed, its group is main plus that PR
# alone, so the PR fails by itself and is dequeued; that holds because the queue's group size is fixed at 1 (`max_entries_to_merge`
# 1) and nothing writes the ruleset (#3286 deleted the third pass, which rewrote the size by the health of the runs and cancelled
# the group being built each time it wrote). A fourth pass (#2948) dequeues a queued PR that conflicts with main. A fifth pass (#2962) enqueues a green PR labelled `ready`. A sixth pass (#3200) updates the branch of a PR with auto-merge that is behind main, or marks it red with a check `conflict` when it conflicts. When it dequeues the front PR it also sets a failing check `queue` on the PR's head naming the run, the failed jobs and their first FAIL lines (#3243). A first step (#3302) sweeps the roadmap: the sub-issues of the issue labelled `epic` are exactly the open issues (a closed one is removed, an open one missing is added, first when labelled `p0` or `regressed`, else last); its failure fails no other pass. It runs on `workflow_run` of ci (the cron rarely fires), on every push to main, by cron and by hand.
name: queue-heal
run-name: "queue-heal"

on:
  # every push to main is what makes a PR stale (#3200); workflow_run of ci alone also fires for merge_group runs and fires
  # late for a push (the macos jobs), so a merge could go unseen for the length of a ci run
  push:
    branches: [main]
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every read, skip every write and print 'dry-run: would <op> <args>' instead (#2934); test a PR that changes this file by dispatching it on the PR's branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

concurrency:
  # a dry run writes nothing, so it has its own group: it cannot race a live run, and the live runs that
  # every ci completion starts no longer cancel it (#2934)
  group: queue-heal-${{ inputs.dry_run == true && 'dry' || 'live' }}
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPO: ${{ github.repository }}
      BASE_TOKEN: ${{ github.token }}
      OWNER_TOKEN: ${{ secrets.QUEUE_OPS_TOKEN }}
      # a PR is lost only when its `added_to_merge_queue` is older than this many seconds
      GRACE: "900"
      # only a workflow_dispatch has the input; schedule and workflow_run never dry-run (#2934)
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the roadmap's sub-issues equal to the open issues
        # a failure here does not fail the passes below and is not retried: the next run sweeps again (#3302)
        continue-on-error: true
        shell: bash
        env:
          # the roadmap is the one open issue with this label (#3302); its number is read, never repeated here
          ROADMAP_LABEL: epic
        run: |
          set -u
          log() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          dry() { [ "$DRY_RUN" = true ]; }
          export GH_TOKEN="$BASE_TOKEN"
          roadmap=$(gh api -X GET "repos/$REPO/issues" -f labels="$ROADMAP_LABEL" -f state=open -f per_page=100 \
            --jq '[.[] | select(.pull_request | not)] | if length == 1 then .[0].number else empty end') \
            && [ -n "$roadmap" ] || { log "roadmap: cannot find the one open issue labelled $ROADMAP_LABEL, nothing done"; exit 1; }
          # sub-issues in the lead's order: "<number> <id> <state>"
          subs=$(gh api -X GET "repos/$REPO/issues/$roadmap/sub_issues" -f per_page=100 --paginate \
            --jq '.[] | "\(.number) \(.id) \(.state)"') || { log "roadmap: cannot list #$roadmap's sub-issues, nothing done"; exit 1; }
          # open issues, pull requests and the roadmap aside: "<number> <id> <first|last>"
          open=$(gh api -X GET "repos/$REPO/issues" -f state=open -f per_page=100 --paginate --jq \
            ".[] | select((.pull_request | not) and .number != $roadmap) | \"\(.number) \(.id) \(if ([.labels[].name] | (index(\"p0\") or index(\"regressed\"))) then \"first\" else \"last\" end)\"") \
            || { log "roadmap: cannot list the open issues, nothing done"; exit 1; }
          fail=0
          while read -r n id state; do
            [ "$state" = closed ] || continue
            if dry; then log "dry-run: would remove #$n from #$roadmap (closed)"; continue; fi
            if gh api -X DELETE "repos/$REPO/issues/$roadmap/sub_issue" -F sub_issue_id="$id" --silent; then
              log "roadmap: removed #$n (closed)"
            else
              log "roadmap: removing #$n failed"; fail=1
            fi
          done <<< "$subs"
          # the id a ticket added first goes before: the head of the list, then the ticket just added
          head=$(echo "$subs" | head -n 1 | cut -d' ' -f2)
          changes=0
          known=" $(echo "$subs" | cut -d' ' -f1 | tr '\n' ' ')"
          # in number order, the first-tickets before the last-ones; each first-ticket goes before the one added before it
          # (a bare `read` loop over a here-string keeps the variables in this shell)
          while read -r n id where; do
            [ -n "$n" ] || continue
            case "$known" in *" $n "*) continue ;; esac
            changes=$((changes + 1))
            if dry; then log "dry-run: would add #$n to #$roadmap $where"; continue; fi
            if ! gh api -X POST "repos/$REPO/issues/$roadmap/sub_issue" -F sub_issue_id="$id" --silent; then
              log "roadmap: adding #$n failed"; fail=1; continue
            fi
            if [ "$where" = first ] && [ -n "$head" ]; then
              if gh api -X PATCH "repos/$REPO/issues/$roadmap/sub_issues/priority" -F sub_issue_id="$id" -F before_id="$head" --silent; then
                head=$id
              else
                log "roadmap: moving #$n first failed, it stays last"; fail=1; continue
              fi
            fi
            log "roadmap: added #$n $where"
          done <<< "$(echo "$open" | sort -k3,3 -k1,1n)"
          removed=$(echo "$subs" | grep -c ' closed$' || true)
          if [ "$changes" = 0 ] && [ "$removed" = 0 ] && [ "$fail" = 0 ]; then
            log "roadmap: $(echo "$open" | grep -c .) open tickets, in step"
          fi
          exit "$fail"
      - name: Re-queue the PRs the queue lost
        shell: bash
        run: |
          set -u
          log() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          # a dry run skips every write and prints what it would do; reads run as usual
          dry() { [ "$DRY_RUN" = true ]; }
          export GH_TOKEN="${OWNER_TOKEN:-$BASE_TOKEN}"

          # the queue's entries on main: "<pr>" per line, front first
          entries() {
            gh api graphql -f owner="${REPO%/*}" -f name="${REPO#*/}" -f query='
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  mergeQueue(branch: "main") { entries(first: 100) { nodes { position pullRequest { number } } } }
                }
              }' --jq '.data.repository.mergeQueue.entries.nodes | sort_by(.position)[] | .pullRequest.number'
          }

          # takes the PR out of the queue (nothing to do when it has no entry) and queues it again, as queue-ops'
          # dequeue and enqueue do (dequeuePullRequest takes the PULL REQUEST's node id)
          requeue() {
            local id entry
            id=$(gh api "repos/$REPO/pulls/$1" --jq .node_id) || return 1
            entry=$(gh api graphql -f query='
              query($id: ID!) { node(id: $id) { ... on PullRequest { mergeQueueEntry { id } } } }' \
              -f id="$id" --jq '.data.node.mergeQueueEntry.id // empty') || return 1
            if dry; then
              [ -n "$entry" ] && log "dry-run: would dequeue #$1" >&2
              log "dry-run: would enqueue #$1" >&2
              echo dry
              return 0
            fi
            if [ -n "$entry" ]; then
              gh api graphql -f query='
                mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' \
                -f id="$id" --silent || return 1
            fi
            gh api graphql -f query='
              mutation($id: ID!) { enqueuePullRequest(input: {pullRequestId: $id}) { mergeQueueEntry { position state } } }' \
              -f id="$id" --jq '.data.enqueuePullRequest.mergeQueueEntry.position'
          }

          # a failed lookup must stop the job: with no entry list every queued PR would look lost
          list=$(entries) || { log "queue-heal: cannot read the queue's entries, nothing done"; exit 1; }
          queued=" $(echo "$list" | tr '\n' ' ')"
          q=$(echo "$list" | grep -c . || true)
          now=$(date -u +%s)
          lost=0
          # a PR labelled `dequeued` was taken out on purpose by queue-ops: an API dequeue leaves no timeline event
          open=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f base=main -f per_page=100 --paginate \
            --jq '.[] | select([.labels[].name] | index("dequeued") | not) | .number') \
            || { log "queue-heal: cannot list the open PRs, nothing done"; exit 1; }
          for pr in $open; do
            case "$queued" in *" $pr "*) continue ;; esac
            # the last merge-queue event of the PR: "<event> <time>"
            events=$(gh api -X GET "repos/$REPO/issues/$pr/timeline" -f per_page=100 --paginate --jq \
              '.[] | select(.event == "added_to_merge_queue" or .event == "removed_from_merge_queue") | "\(.event) \(.created_at)"') \
              || { log "queue-heal: #$pr timeline unreadable, skipped"; continue; }
            last=$(echo "$events" | tail -n 1)
            case "$last" in added_to_merge_queue*) ;; *) continue ;; esac
            since=${last#* }
            [ $((now - $(date -u -d "$since" +%s))) -gt "$GRACE" ] || continue
            if pos=$(requeue "$pr"); then
              log "queue-heal: #$pr lost since $since, re-queued at position $pos"
            else
              log "queue-heal: #$pr lost since $since, re-queue failed"
            fi
            lost=$((lost + 1))
          done
          [ "$lost" = 0 ] && log "queue-heal: none lost ($q entries)"

          # fifth pass (#2962; a PR a failed group removed is labelled `ready` by its runner or the lead): GitHub won't turn on auto-merge for a PR that is already clean, and a runner can't enqueue,
          # so a runner labels such a PR `ready`. Each open PR with that label, not in the queue, not labelled `dequeued`,
          # mergeable, whose `ci` check on the current head is `success`, is enqueued as queue-ops' enqueue does, and loses
          # `ready`. A PR whose ci is not green yet keeps the label and is tried again on the next pass.
          ready_pass() {
            local pr info mergeable state id sha ci pos n=0
            for pr in $(gh api -X GET "repos/$REPO/pulls" -f state=open -f base=main -f per_page=100 --paginate \
                --jq '.[] | select([.labels[].name] | (index("ready") and (index("dequeued") | not))) | .number'); do
              case "$queued" in *" $pr "*) continue ;; esac
              info=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.mergeable) \(.mergeable_state) \(.node_id) \(.head.sha)"') \
                || { log "queue-heal: #$pr (ready) unreadable, skipped"; continue; }
              set -- $info
              mergeable=$1; state=$2; id=$3; sha=$4
              [ "$mergeable" = true ] && [ "$state" != dirty ] || { log "queue-heal: #$pr (ready) not mergeable yet, kept"; continue; }
              ci=$(gh api -X GET "repos/$REPO/commits/$sha/check-runs" -f check_name=ci -f filter=latest \
                --jq '[.check_runs[] | .conclusion // .status][0] // "none"') || ci=unreadable
              [ "$ci" = success ] || { log "queue-heal: #$pr (ready) ci is $ci, kept"; continue; }
              n=$((n + 1))
              if dry; then
                log "dry-run: would enqueue #$pr (ready)"
                log "dry-run: would unlabel #$pr ready"
                continue
              fi
              if pos=$(gh api graphql -f query='
                  mutation($id: ID!) { enqueuePullRequest(input: {pullRequestId: $id}) { mergeQueueEntry { position state } } }' \
                  -f id="$id" --jq '.data.enqueuePullRequest.mergeQueueEntry.position'); then
                gh api -X DELETE "repos/$REPO/issues/$pr/labels/ready" --silent || true
                log "queue-heal: enqueued #$pr (ready) at position $pos"
              else
                log "queue-heal: #$pr (ready) enqueue refused, kept"
              fi
            done
            [ "$n" = 0 ] && log "queue-heal: none ready"
            return 0
          }
          ready_pass
          # what it enqueued joins the list the later passes read
          dry || { list=$(entries) || true; q=$(echo "$list" | grep -c . || true); }

          # fourth pass (#2948): a queued PR that conflicts with main is dequeued at once, so the `removed_from_merge_queue`
          # event wakes its runner (#2926 sat 90 minutes in the queue while it conflicted, and no event told anyone).
          # `mergeable` is null while GitHub computes it: that PR is skipped this pass, never dequeued. It runs before the
          # second pass and takes the PRs it dequeued out of `list`, so the front entry is judged without them.
          conflicts() {
            local pr info mergeable state id n=0 left=""
            for pr in $list; do
              info=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.mergeable) \(.mergeable_state) \(.node_id)"') \
                || { log "queue-heal: #$pr mergeable unreadable, skipped"; left="$left$pr"$'\n'; continue; }
              set -- $info
              mergeable=$1; state=$2; id=$3
              if [ "$mergeable" = null ] || { [ "$mergeable" != false ] && [ "$state" != dirty ]; }; then
                left="$left$pr"$'\n'
                continue
              fi
              n=$((n + 1))
              if dry; then
                log "dry-run: would dequeue #$pr (conflicts with main)"
                log "dry-run: would label #$pr dequeued"
                continue
              fi
              if gh api graphql -f query='
                  mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$id" --silent; then
                gh api -X POST "repos/$REPO/issues/$pr/labels" -f "labels[]=dequeued" --silent || true
                log "queue-heal: dequeued #$pr (conflicts with main)"
              else
                log "queue-heal: #$pr conflicts with main, dequeue failed"
                left="$left$pr"$'\n'
              fi
            done
            [ "$n" = 0 ] && log "queue-heal: none conflicting ($q entries)"
            # a dry run dequeues nothing, so its list stays whole
            dry || list=$(printf '%s' "$left")
            return 0
          }
          conflicts

          # sixth pass (#3200): a PR with auto-merge on that is not in the queue and is stale. Behind main without a conflict:
          # main is merged into its branch (the update-branch operation, a merge commit) with the owner's token, because an
          # event caused by GITHUB_TOKEN starts no workflow and the new head would never get its `ci-pr` check; its check
          # then runs again and auto-merge queues it with no agent. Conflicting: automation cannot resolve it, so the head
          # gets a failing check run `conflict` (GITHUB_TOKEN with checks: write; a personal token cannot create check runs),
          # and the red check wakes the worker that follows the PR. A push gives the PR a new head, which has no `conflict`.
          # A PR without auto-merge is left alone. `mergeable` null (GitHub still computing) is skipped until the next pass.
          stale_pass() {
            local pr info mergeable state sha behind has n=0
            for pr in $(gh api -X GET "repos/$REPO/pulls" -f state=open -f base=main -f per_page=100 --paginate \
                --jq '.[] | select(.auto_merge != null) | .number'); do
              case "$queued" in *" $pr "*) continue ;; esac
              info=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.mergeable) \(.mergeable_state) \(.head.sha)"') \
                || { log "queue-heal: #$pr stale check unreadable, skipped"; continue; }
              set -- $info
              mergeable=$1; state=$2; sha=$3
              [ "$mergeable" = null ] && continue
              if [ "$mergeable" = false ] || [ "$state" = dirty ]; then
                has=$(gh api -X GET "repos/$REPO/commits/$sha/check-runs" -f check_name=conflict --jq '.total_count') || has=0
                [ "$has" = 0 ] || continue
                n=$((n + 1))
                if dry; then log "dry-run: would create check conflict on #$pr ($sha)"; continue; fi
                if GH_TOKEN="$BASE_TOKEN" gh api -X POST "repos/$REPO/check-runs" -f name=conflict -f head_sha="$sha" \
                    -f status=completed -f conclusion=failure -f "output[title]=conflict" \
                    -f "output[summary]=This branch conflicts with main. Merge origin/main into it, resolve, push." --silent; then
                  log "queue-heal: #$pr conflicts with main, check conflict set red on $sha"
                else
                  log "queue-heal: #$pr conflicts with main, check conflict refused"
                fi
                continue
              fi
              behind=$(gh api "repos/$REPO/compare/main...$sha" --jq .behind_by) || behind=0
              [ "$behind" -gt 0 ] || continue
              n=$((n + 1))
              if dry; then log "dry-run: would update the branch of #$pr ($behind behind main)"; continue; fi
              if gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" -f expected_head_sha="$sha" --silent; then
                log "queue-heal: #$pr was $behind behind main, branch updated"
              else
                log "queue-heal: #$pr was $behind behind main, branch update refused"
              fi
            done
            [ "$n" = 0 ] && log "queue-heal: none stale"
            return 0
          }
          stale_pass

          # second pass: only the front entry's group is built on main alone, so only its failure is its own
          front=$(echo "$list" | head -n 1)
          [ -n "$front" ] || { log "queue-heal: queue empty, no front entry"; exit 0; }
          # only a run of the CURRENT entry may be judged (#3158 defect, 2026-11-11): a PR that failed in the queue earlier and
          # enters again has an old failed run on a branch with the same `pr-<N>-` prefix, and in the minutes before its new
          # run is listed the newest match was that old run, so the PR was dequeued at once (#3129 at 15:16:33Z, #3056 at
          # 14:51Z). The entry's group is made after it is enqueued, so its run is created at or after `enqueuedAt`; an older
          # run is not the entry's, and with no run yet the front is "no run yet" (the grace logic below), never a failure.
          at=$(gh api graphql -f owner="${REPO%/*}" -f name="${REPO#*/}" -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) { mergeQueue(branch: "main") { entries(first: 1) { nodes { enqueuedAt } } } }
            }' --jq '.data.repository.mergeQueue.entries.nodes[0].enqueuedAt // empty' 2>/dev/null) || at=
          [ -n "$at" ] || { log "queue-heal: front #$front enqueue time unreadable, left alone"; exit 0; }
          run=$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" -f event=merge_group -f per_page=100 \
            | jq -r --arg at "$at" --arg pre "gh-readonly-queue/main/pr-$front-" \
              '[.workflow_runs[] | select((.head_branch | startswith($pre)) and .created_at >= $at)][0] | "\(.id) \(.status) \(.conclusion)"') \
            || { log "queue-heal: front #$front run unreadable, left alone"; exit 0; }
          set -- $run
          # a run that just completed can still read `null` for its conclusion: read it again, up to 6 times 10 s apart,
          # so the eviction does not wait for the next pass (#3051)
          for _ in 1 2 3 4 5 6; do
            [ "${2:-}" = completed ] && [ "${3:-null}" = null ] || break
            sleep 10
            run=$(gh api -X GET "repos/$REPO/actions/runs/$1" --jq '"\(.id) \(.status) \(.conclusion)"') || break
            set -- $run
          done
          # a job that hits its timeout ends the run `cancelled` though the `ci` check fails: GitHub kept such an entry
          # (#3040: shard 5 hung 30 minutes, `ci` failed at 00:21:31Z, the run was `cancelled`, the entry stayed 58 minutes
          # and the group behind it was built on it, #3051). A completed `cancelled` run whose `ci` job failed is a
          # failed run, unless our own guard cancelled it (`queue-guard`: its group left the queue); those entries leave the queue by
          # themselves.
          if [ "${2:-}" = completed ] && [ "${3:-}" = cancelled ]; then
            if gh api -X GET "repos/$REPO/actions/runs/$1/jobs" -f filter=latest -f per_page=100 \
              | jq -e '([.jobs[] | select(.name == "ci" and .conclusion == "failure")] | length > 0)
                and ([.jobs[].steps[]? | select((.name | test("queue-guard")) and (.conclusion == "failure" or .conclusion == "cancelled"))] | length == 0)' >/dev/null; then
              set -- "$1" "$2" failure
            fi
          fi
          # a front entry with no run (#3131): a group made at the front by a GITHUB_TOKEN event gets its branch but no
          # `merge_group` run (2026-11-11: `jump 3130` sat 56 minutes, 20 PRs enqueued into an empty queue sat 8), and the
          # queue stands still. That is a fault, not "ok": say so, and re-queue the front PR with the owner's token (an
          # event that token causes starts the run), once the entry is older than the grace period.
          if [ -z "${1:-}" ] || [ "${1:-}" = null ]; then
            age=0; [ -n "$at" ] && age=$(( now - $(date -u -d "$at" +%s) ))
            if [ "$age" -gt 300 ]; then
              log "queue-heal: FAULT front #$front has no merge_group run after $((age / 60)) min (queue stands still)"
              if requeued=$(requeue "$front"); then
                log "queue-heal: front #$front re-queued with the owner's token at position $requeued"
              else
                log "queue-heal: FAULT front #$front re-queue failed"
              fi
              exit 0
            fi
          fi
          if [ "${3:-}" != failure ]; then
            log "queue-heal: front #$front ok (run ${1:-none} ${2:-none})"
            exit 0
          fi
          job=$(gh api -X GET "repos/$REPO/actions/runs/$1/jobs" -f filter=latest -f per_page=100 \
            --jq '[.jobs[] | select(.conclusion == "failure")][0].name // "unknown"') || job=unknown
          id=$(gh api "repos/$REPO/pulls/$front" --jq .node_id) || { log "queue-heal: front #$front unreadable, left alone"; exit 0; }
          # says why (#3243): a failing check `queue` on the PR's head with the run's URL, each job that failed (not the
          # ones fail-fast cancelled) and the first 20 `^FAIL ` / `##[error]` lines of their logs. The worker that follows
          # the PR reads it instead of asking what "removed from the merge queue by (manual)" meant. GITHUB_TOKEN with
          # checks: write creates it (a personal token cannot, as for `conflict`).
          explain() {
            local sha url jobs ids body
            sha=$(gh api "repos/$REPO/pulls/$front" --jq .head.sha) || return 1
            url="https://github.com/$REPO/actions/runs/$1"
            jobs=$(gh api -X GET "repos/$REPO/actions/runs/$1/jobs" -f filter=latest -f per_page=100 \
              --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"') || jobs=
            body=$(printf '%s\n' "$jobs" | while IFS="$(printf '\t')" read -r jid jname; do
              [ -n "$jid" ] || continue
              echo "### $jname"
              gh api "repos/$REPO/actions/jobs/$jid/logs" 2>/dev/null | grep -E '^([0-9T:.Z-]+ )?(FAIL |##\[error\])' | head -20 || true
            done | head -c 60000)
            [ -n "$jobs" ] || body="no failed job was listed (the run may have timed out)"
            if dry; then log "dry-run: would create check queue on #$front ($sha)"; return 0; fi
            GH_TOKEN="$BASE_TOKEN" gh api -X POST "repos/$REPO/check-runs" -f name=queue -f head_sha="$sha" \
              -f status=completed -f conclusion=failure -f "output[title]=removed from the merge queue: its own group failed" \
              -f "output[summary]=Run: $url"$'\n\n'"Failed jobs and their first FAIL / error lines:"$'\n\n'"$body" --silent
          }
          if explain "$1"; then log "queue-heal: #$front check queue set red"; else log "queue-heal: #$front check queue refused"; fi
          if dry; then
            log "dry-run: would dequeue #$front"
            log "dry-run: would label #$front dequeued"
            log "queue-heal: #$front dequeued, its own group failed (run $1, job $job)"
            exit 0
          fi
          if gh api graphql -f query='
              mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$id" --silent; then
            gh api -X POST "repos/$REPO/issues/$front/labels" -f "labels[]=dequeued" --silent || true
            log "queue-heal: #$front dequeued, its own group failed (run $1, job $job)"
          else
            log "queue-heal: #$front dequeue failed (run $1, job $job)"
          fi
          exit 0
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
