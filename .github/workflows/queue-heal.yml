# Finds a pull request the merge queue lost and queues it again (#2900). On 2026-11-09 #2885 got `added_to_merge_queue`
# at 07:04:49Z but never had a queue entry (no `merge_group` run, absent from the queue's list), and sat 75 minutes until
# a runner noticed. Every 10 minutes (and by hand) this job lists the queue's entries on `main`, and re-queues each open
# PR whose last merge-queue event is `added_to_merge_queue`, older than 15 minutes, with no entry in that list, unless
# it carries the label `dequeued` (queue-ops' `dequeue` sets it, enqueue and jump clear it). A second pass (#2902) judges
# the front entry: when the newest `merge_group` run of ci for its branch has failed, its group is main plus that PR
# alone, so the PR fails by itself and is dequeued. A third pass (#2922) grows and shrinks the queue's build entries by the health of its runs. A sixth pass (#3057) labels a PR that failed behind a failed group, or whose first failed job failed first in another PR's run too (#3051), `ready` (twice per head at most), so the fifth enqueues it again. A fourth pass (#2948) dequeues a queued PR that conflicts with main. A fifth pass (#2962) enqueues a green PR labelled `ready`. It runs on `workflow_run` of ci (the cron rarely fires), by cron and by hand.
name: queue-heal
run-name: "queue-heal"

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every read, skip every write and print 'dry-run: would <op> <args>' instead (#2934); test a PR that changes this file by dispatching it on the PR's branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  # a dry run writes nothing, so it has its own group: it cannot race a live run, and the live runs that
  # every ci completion starts no longer cancel it (#2934)
  group: queue-heal-${{ inputs.dry_run == true && 'dry' || 'live' }}
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPO: ${{ github.repository }}
      BASE_TOKEN: ${{ github.token }}
      OWNER_TOKEN: ${{ secrets.QUEUE_OPS_TOKEN }}
      # a PR is lost only when its `added_to_merge_queue` is older than this many seconds
      GRACE: "900"
      # only a workflow_dispatch has the input; schedule and workflow_run never dry-run (#2934)
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: API budget (first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Re-queue the PRs the queue lost
        shell: bash
        run: |
          set -u
          log() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          # a dry run skips every write and prints what it would do; reads run as usual
          dry() { [ "$DRY_RUN" = true ]; }
          export GH_TOKEN="${OWNER_TOKEN:-$BASE_TOKEN}"

          # an enqueue goes with GITHUB_TOKEN first and the owner's secret only when GitHub refuses, as queue-ops does:
          # the secret is a personal token without the `workflow` scope, so it cannot queue a PR that changes a workflow
          # file (#3070 sat `enqueue refused` on every pass from 02:51Z)
          enqueue_gql() {
            local err="${RUNNER_TEMP:-/tmp}/enqueue.err"
            GH_TOKEN="$BASE_TOKEN" gh api graphql "$@" 2>"$err" \
              || { [ -n "$OWNER_TOKEN" ] && GH_TOKEN="$OWNER_TOKEN" gh api graphql "$@" 2>"$err"; }
          }
          # neither token can queue a PR that changes a workflow file (GITHUB_TOKEN: no `workflows` permission, the secret:
          # no `workflow` scope; queue-ops run 42953053031 on #3070); a session's enable_pr_auto_merge can
          needs_session() { grep -qi 'workflow' "${RUNNER_TEMP:-/tmp}/enqueue.err" 2>/dev/null; }

          # the queue's entries on main: "<pr>" per line, front first
          entries() {
            gh api graphql -f owner="${REPO%/*}" -f name="${REPO#*/}" -f query='
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  mergeQueue(branch: "main") { entries(first: 100) { nodes { position pullRequest { number } } } }
                }
              }' --jq '.data.repository.mergeQueue.entries.nodes | sort_by(.position)[] | .pullRequest.number'
          }

          # takes the PR out of the queue (nothing to do when it has no entry) and queues it again, as queue-ops'
          # dequeue and enqueue do (dequeuePullRequest takes the PULL REQUEST's node id)
          requeue() {
            local id entry
            id=$(gh api "repos/$REPO/pulls/$1" --jq .node_id) || return 1
            entry=$(gh api graphql -f query='
              query($id: ID!) { node(id: $id) { ... on PullRequest { mergeQueueEntry { id } } } }' \
              -f id="$id" --jq '.data.node.mergeQueueEntry.id // empty') || return 1
            if dry; then
              [ -n "$entry" ] && log "dry-run: would dequeue #$1" >&2
              log "dry-run: would enqueue #$1" >&2
              echo dry
              return 0
            fi
            if [ -n "$entry" ]; then
              gh api graphql -f query='
                mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' \
                -f id="$id" --silent || return 1
            fi
            enqueue_gql -f query='
              mutation($id: ID!) { enqueuePullRequest(input: {pullRequestId: $id}) { mergeQueueEntry { position state } } }' \
              -f id="$id" --jq '.data.enqueuePullRequest.mergeQueueEntry.position'
          }

          # a failed lookup must stop the job: with no entry list every queued PR would look lost
          list=$(entries) || { log "queue-heal: cannot read the queue's entries, nothing done"; exit 1; }
          queued=" $(echo "$list" | tr '\n' ' ')"
          q=$(echo "$list" | grep -c . || true)
          now=$(date -u +%s)
          lost=0
          # a PR labelled `dequeued` was taken out on purpose by queue-ops: an API dequeue leaves no timeline event
          open=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f base=main -f per_page=100 --paginate \
            --jq '.[] | select([.labels[].name] | index("dequeued") | not) | .number') \
            || { log "queue-heal: cannot list the open PRs, nothing done"; exit 1; }
          for pr in $open; do
            case "$queued" in *" $pr "*) continue ;; esac
            # the last merge-queue event of the PR: "<event> <time>"
            events=$(gh api -X GET "repos/$REPO/issues/$pr/timeline" -f per_page=100 --paginate --jq \
              '.[] | select(.event == "added_to_merge_queue" or .event == "removed_from_merge_queue") | "\(.event) \(.created_at)"') \
              || { log "queue-heal: #$pr timeline unreadable, skipped"; continue; }
            last=$(echo "$events" | tail -n 1)
            case "$last" in added_to_merge_queue*) ;; *) continue ;; esac
            since=${last#* }
            [ $((now - $(date -u -d "$since" +%s))) -gt "$GRACE" ] || continue
            if pos=$(requeue "$pr"); then
              log "queue-heal: #$pr lost since $since, re-queued at position $pos"
            else
              log "queue-heal: #$pr lost since $since, re-queue failed"
            fi
            lost=$((lost + 1))
          done
          [ "$lost" = 0 ] && log "queue-heal: none lost ($q entries)"

          # fifth pass (#2962): GitHub won't turn on auto-merge for a PR that is already clean, and a runner can't enqueue,
          # so a runner labels such a PR `ready`. Each open PR with that label, not in the queue, not labelled `dequeued`,
          # mergeable, whose `ci` check on the current head is `success`, is enqueued as queue-ops' enqueue does, and loses
          # `ready`. A PR whose ci is not green yet keeps the label and is tried again on the next pass.
          ready_pass() {
            local pr info mergeable state id sha ci pos n=0
            for pr in $(gh api -X GET "repos/$REPO/pulls" -f state=open -f base=main -f per_page=100 --paginate \
                --jq '.[] | select([.labels[].name] | (index("ready") and (index("dequeued") | not))) | .number'); do
              case "$queued" in *" $pr "*) continue ;; esac
              info=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.mergeable) \(.mergeable_state) \(.node_id) \(.head.sha)"') \
                || { log "queue-heal: #$pr (ready) unreadable, skipped"; continue; }
              set -- $info
              mergeable=$1; state=$2; id=$3; sha=$4
              [ "$mergeable" = true ] && [ "$state" != dirty ] || { log "queue-heal: #$pr (ready) not mergeable yet, kept"; continue; }
              ci=$(gh api -X GET "repos/$REPO/commits/$sha/check-runs" -f check_name=ci -f filter=latest \
                --jq '[.check_runs[] | .conclusion // .status][0] // "none"') || ci=unreadable
              [ "$ci" = success ] || { log "queue-heal: #$pr (ready) ci is $ci, kept"; continue; }
              n=$((n + 1))
              if dry; then
                log "dry-run: would enqueue #$pr (ready)"
                log "dry-run: would unlabel #$pr ready"
                continue
              fi
              if pos=$(enqueue_gql -f query='
                  mutation($id: ID!) { enqueuePullRequest(input: {pullRequestId: $id}) { mergeQueueEntry { position state } } }' \
                  -f id="$id" --jq '.data.enqueuePullRequest.mergeQueueEntry.position'); then
                gh api -X DELETE "repos/$REPO/issues/$pr/labels/ready" --silent || true
                log "queue-heal: enqueued #$pr (ready) at position $pos"
              elif needs_session; then
                # retrying every pass cannot change that: the label goes, the runner turns auto-merge on by MCP
                gh api -X DELETE "repos/$REPO/issues/$pr/labels/ready" --silent || true
                log "queue-heal: #$pr (ready) changes a workflow file, which no token here can queue: a session turns auto-merge on for it (enable_pr_auto_merge), label ready removed"
              else
                log "queue-heal: #$pr (ready) enqueue refused, kept"
              fi
            done
            [ "$n" = 0 ] && log "queue-heal: none ready"
            return 0
          }
          # sixth pass (#3057): an entry that failed behind a failed group goes back in. One full run holds a whole batch
          # (batch-wait), so when a bad entry fails it the groups ahead build their own trees (the split) and GitHub
          # removes, with the bad entry, the good entries queued behind it. A removed PR is one of those when the newest
          # merge_group run of ci for it failed in the last hour and the group it was built on (the sha that ends its
          # branch `pr-<N>-<sha>`) is the head of a merge_group run that failed too: the failure was in its tree before
          # it. It gets the label `ready`, and the fifth pass enqueues it. An entry whose base passed, or was main,
          # failed by itself and is left to its runner. It runs before the fifth pass.
          inherited() {
            local runs cutoff pr run concl base bconcl n=0
            runs=$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" -f event=merge_group -f per_page=100 \
              --jq '.workflow_runs[] | "\(.head_branch) \(.head_sha) \(.conclusion // .status) \(.id) \(.updated_at)"') \
              || { log "queue-heal: merge_group runs unreadable, none re-queued behind a failed group"; return 0; }
            cutoff=$(date -u -d '-60 minutes' +%Y-%m-%dT%H:%M:%SZ)
            # a run failed when it concluded `failure`, or `cancelled` with a failed job that is not `ci` or `changes`:
            # a run whose job timed out, or that the verdict cut short, ends `cancelled` (#3051), and so does a run
            # that batch-wait or queue-guard cancelled, which has no such job
            failed_run() {
              [ "$2" = failure ] && return 0
              [ "$2" = cancelled ] || return 1
              [ "$(gh api -X GET "repos/$REPO/actions/runs/$1/jobs" -f filter=latest -f per_page=100 --jq \
                '[.jobs[] | select(.name != "ci" and .name != "changes" and (.conclusion == "failure" or any(.steps[]?; .conclusion == "failure")))] | length' 2>/dev/null)" -gt 0 ] 2>/dev/null
            }
            # the job a run failed in first: a job that failed, or one that fail-fast cancelled after a step of it failed
            first_failed() {
              gh api -X GET "repos/$REPO/actions/runs/$1/jobs" -f filter=latest -f per_page=100 --jq \
                '[.jobs[] | select(.name != "ci" and (.conclusion == "failure" or any(.steps[]?; .conclusion == "failure")))]
                 | sort_by(.completed_at) | .[0].name // empty' 2>/dev/null
            }
            # how often this head was labelled `ready` again by this pass: the `ready` labels after the PR's newest
            # commit or force push (a push is a new head and starts the count again)
            tries() {
              local ev since
              ev=$(gh api -X GET "repos/$REPO/issues/$1/timeline" -f per_page=100 --paginate --jq \
                '.[] | if .event == "committed" then "push \(.committer.date)" elif .event == "head_ref_force_pushed" then "push \(.created_at)"
                 elif .event == "labeled" and .label.name == "ready" then "ready \(.created_at)" else empty end') || { echo 9; return; }
              since=$(echo "$ev" | awk '$1 == "push" { print $2 }' | sort | tail -n 1)
              echo "$ev" | awk -v since="${since:-0}" '$1 == "ready" && $2 > since' | grep -c . || true
            }
            # newest first, so the first line of a PR is its newest run; ISO times in UTC compare as text. The rows are
            # read first: a run is judged against the other PRs' failed runs of the last hour (#3051)
            local rows="" r_pr r_run r_concl r_base r_bconcl r_job other reason oj tried
            declare -A job
            while read -r r_pr r_run r_concl r_base r_bconcl; do
              [ -n "$r_pr" ] || continue
              case "$queued" in *" $r_pr "*) continue ;; esac
              # `open` holds the open PRs without the label `dequeued`
              case " $(echo $open) " in *" $r_pr "*) ;; *) continue ;; esac
              rows="$rows$r_pr $r_run $r_concl $r_base $r_bconcl"$'\n'
              job[$r_pr]=$(first_failed "$r_run")
            done < <(echo "$runs" | awk -v cutoff="$cutoff" '
              { k = split($1, part, "/"); split(part[k], name, "-"); pr[NR] = name[2]; base[NR] = name[3]
                concl[NR] = $3; id[NR] = $4; at[NR] = $5; if (!($2 in of)) { of[$2] = $4; was[$2] = $3 } }
              END { for (i = 1; i <= NR; i++) { if (pr[i] in seen) continue; seen[pr[i]] = 1
                      if ((concl[i] == "failure" || concl[i] == "cancelled") && at[i] >= cutoff)
                        print pr[i], id[i], concl[i], (base[i] in of) ? of[base[i]] : "-", (base[i] in of) ? was[base[i]] : "-" } }')
            while read -r r_pr r_run r_concl r_base r_bconcl; do
              [ -n "$r_pr" ] || continue
              reason=""
              if failed_run "$r_run" "$r_concl" && failed_run "$r_base" "$r_bconcl"; then
                reason="its group's base run $r_base failed too"
              elif [ -n "${job[$r_pr]}" ] && failed_run "$r_run" "$r_concl"; then
                # the same job failed first in another PR's run of the last hour: not this PR's alone
                other=""
                for oj in $(echo "$rows" | awk -v me="$r_pr" '$1 != me { print $1 }'); do
                  [ "${job[$oj]}" = "${job[$r_pr]}" ] && { other=$oj; break; }
                done
                [ -n "$other" ] && reason="job ${job[$r_pr]} failed first in #$other's run too"
              fi
              [ -n "$reason" ] || continue
              tried=$(tries "$r_pr")
              if [ "$tried" -ge 2 ]; then
                log "queue-heal: #$r_pr not re-enqueued again (removed with $reason; labelled ready $tried times for this head)"
                continue
              fi
              n=$((n + 1))
              if dry; then
                log "dry-run: would label #$r_pr ready (removed with $reason; run $r_run)"
                continue
              fi
              gh api -X POST "repos/$REPO/issues/$r_pr/labels" -f "labels[]=ready" --silent \
                && log "queue-heal: #$r_pr labelled ready, re-enqueued by the next pass (removed with $reason; run $r_run)" \
                || log "queue-heal: #$r_pr removed with $reason, label refused"
            done <<<"$rows"
            [ "$n" = 0 ] && log "queue-heal: none failed behind a failed group"
            return 0
          }
          inherited
          ready_pass
          # what it enqueued joins the list the later passes read
          dry || { list=$(entries) || true; q=$(echo "$list" | grep -c . || true); }

          # fourth pass (#2948): a queued PR that conflicts with main is dequeued at once, so the `removed_from_merge_queue`
          # event wakes its runner (#2926 sat 90 minutes in the queue while it conflicted, and no event told anyone).
          # `mergeable` is null while GitHub computes it: that PR is skipped this pass, never dequeued. It runs before the
          # second pass and takes the PRs it dequeued out of `list`, so the front entry is judged without them.
          conflicts() {
            local pr info mergeable state id n=0 left=""
            for pr in $list; do
              info=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.mergeable) \(.mergeable_state) \(.node_id)"') \
                || { log "queue-heal: #$pr mergeable unreadable, skipped"; left="$left$pr"$'\n'; continue; }
              set -- $info
              mergeable=$1; state=$2; id=$3
              if [ "$mergeable" = null ] || { [ "$mergeable" != false ] && [ "$state" != dirty ]; }; then
                left="$left$pr"$'\n'
                continue
              fi
              n=$((n + 1))
              if dry; then
                log "dry-run: would dequeue #$pr (conflicts with main)"
                log "dry-run: would label #$pr dequeued"
                continue
              fi
              if gh api graphql -f query='
                  mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$id" --silent; then
                gh api -X POST "repos/$REPO/issues/$pr/labels" -f "labels[]=dequeued" --silent || true
                log "queue-heal: dequeued #$pr (conflicts with main)"
              else
                log "queue-heal: #$pr conflicts with main, dequeue failed"
                left="$left$pr"$'\n'
              fi
            done
            [ "$n" = 0 ] && log "queue-heal: none conflicting ($q entries)"
            # a dry run dequeues nothing, so its list stays whole
            dry || list=$(printf '%s' "$left")
            return 0
          }
          conflicts

          # third pass (#2922): grows and shrinks the queue's build entries (1, 2, 4) by the health of the merge_group
          # runs of ci since the ruleset's last change (its `updated_at`, which a change of B sets again). A failure halves B,
          # three passes double it (cap 4); cancelled runs count for neither. At 1 a failure cannot halve, so there three
          # passes after the newest failure double it (#3057). The cap is what the 20 hosted job slots carry (#3057): one
          # full run peaks at 13 Linux jobs and each of the B - 1 waiting groups holds one, so 4 leaves the 4 slots
          # ci-dispatch reserves for pull request checks and 8 would leave none. Same PUT and token fallback as queue-ops'
          # set-build-entries. It runs from an EXIT trap, after the second pass.
          tune() {
            local id rs b t runs n m nb last
            id=$(gh api "repos/$REPO/rulesets" --jq '.[] | select(.name == "main") | .id') && [ -n "$id" ]               || { log "queue-heal: build entries unreadable (no ruleset main), kept"; return 0; }
            rs=$(gh api "repos/$REPO/rulesets/$id") || { log "queue-heal: build entries unreadable, kept"; return 0; }
            b=$(echo "$rs" | jq -r '[.rules[] | select(.type == "merge_queue") | .parameters.max_entries_to_build][0] // empty')
            t=$(echo "$rs" | jq -r '.updated_at // empty')
            [ -n "$b" ] && [ -n "$t" ] || { log "queue-heal: build entries unreadable, kept"; return 0; }
            runs=$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" -f event=merge_group -f status=completed \
              -f per_page=100 --paginate --jq '.workflow_runs[] | "\(.created_at) \(.conclusion)"') \
              || { log "queue-heal: build entries $b kept (merge_group runs unreadable)"; return 0; }
            # ISO times in UTC compare as text
            n=$(echo "$runs" | awk -v t="$t" '$1 > t && $2 == "success"' | grep -c . || true)
            m=$(echo "$runs" | awk -v t="$t" '$1 > t && $2 == "failure"' | grep -c . || true)
            # at 1 there is nothing to halve, so no change is written, T stays and a failure would count for ever
            # (#3057: `1 kept (11 passed, 1 failed)` for 7 hours on 2026-11-10, one pull request per run). There only
            # the passes created after the newest failure count, and that failure is behind them.
            if [ "$b" = 1 ] && [ "$m" -gt 0 ]; then
              last=$(echo "$runs" | awk -v t="$t" '$1 > t && $2 == "failure" { print $1 }' | sort | tail -n 1)
              n=$(echo "$runs" | awk -v t="$last" '$1 > t && $2 == "success"' | grep -c . || true)
              m=0
            fi
            nb=$b
            if [ "$m" -gt 0 ]; then
              nb=$((b / 2)); [ "$nb" -ge 1 ] || nb=1
            elif [ "$n" -ge 3 ] && [ "$b" -lt 4 ]; then
              nb=$((b * 2)); [ "$nb" -le 4 ] || nb=4
            fi
            if [ "$nb" = "$b" ]; then
              log "queue-heal: build entries $b kept ($n passed, $m failed since $t)"
              return 0
            fi
            if dry; then
              log "queue-heal: build entries $b -> $nb ($n passed, $m failed since $t)"
              log "dry-run: would set max_entries_to_build=$nb"
              return 0
            fi
            echo "$rs" | jq --argjson n "$nb" '{name, target, enforcement, bypass_actors, conditions,
                rules: (.rules | map(if .type == "merge_queue" then .parameters.max_entries_to_build = $n else . end))}' \
              > "${RUNNER_TEMP:-/tmp}/ruleset.json"
            # GITHUB_TOKEN first; the owner's secret only when GitHub refuses
            if GH_TOKEN="$BASE_TOKEN" gh api -X PUT "repos/$REPO/rulesets/$id" --input "${RUNNER_TEMP:-/tmp}/ruleset.json" --silent 2>/dev/null \
              || { [ -n "$OWNER_TOKEN" ] && GH_TOKEN="$OWNER_TOKEN" gh api -X PUT "repos/$REPO/rulesets/$id" --input "${RUNNER_TEMP:-/tmp}/ruleset.json" --silent; }; then
              log "queue-heal: build entries $b -> $nb ($n passed, $m failed since $t)"
            else
              log "queue-heal: build entries $b kept, change to $nb refused ($n passed, $m failed since $t)"
            fi
          }

          # the third pass runs when the job ends, after whichever exit the second pass takes
          trap tune EXIT

          # second pass: only the front entry's group is built on main alone, so only its failure is its own
          front=$(echo "$list" | head -n 1)
          [ -n "$front" ] || { log "queue-heal: queue empty, no front entry"; exit 0; }
          run=$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" -f event=merge_group -f per_page=100 \
            --jq "[.workflow_runs[] | select(.head_branch | startswith(\"gh-readonly-queue/main/pr-$front-\"))][0] | \"\(.id) \(.status) \(.conclusion)\"") \
            || { log "queue-heal: front #$front run unreadable, left alone"; exit 0; }
          set -- $run
          # a run that just completed can still read `null` for its conclusion: read it again, up to 6 times 10 s apart,
          # so the eviction does not wait for the next pass (#3051)
          for _ in 1 2 3 4 5 6; do
            [ "${2:-}" = completed ] && [ "${3:-null}" = null ] || break
            sleep 10
            run=$(gh api -X GET "repos/$REPO/actions/runs/$1" --jq '"\(.id) \(.status) \(.conclusion)"') || break
            set -- $run
          done
          # a job that hits its timeout ends the run `cancelled` though the `ci` check fails: GitHub kept such an entry
          # (#3040: shard 5 hung 30 minutes, `ci` failed at 00:21:31Z, the run was `cancelled`, the entry stayed 58 minutes
          # and the group behind it was built on it, #3051). A completed `cancelled` run whose `ci` job failed is a
          # failed run, unless one of our own guards cancelled it (`batch-wait`: its group merged with a later one,
          # `queue-guard`: its group left the queue); those entries leave the queue by themselves.
          if [ "${2:-}" = completed ] && [ "${3:-}" = cancelled ]; then
            if gh api -X GET "repos/$REPO/actions/runs/$1/jobs" -f filter=latest -f per_page=100 \
              | jq -e '([.jobs[] | select(.name == "ci" and .conclusion == "failure")] | length > 0)
                and ([.jobs[].steps[]? | select((.name | test("Wait while a later queue|queue-guard")) and (.conclusion == "failure" or .conclusion == "cancelled"))] | length == 0)' >/dev/null; then
              set -- "$1" "$2" failure
            fi
          fi
          if [ "${3:-}" != failure ]; then
            log "queue-heal: front #$front ok (run ${1:-none} ${2:-none})"
            exit 0
          fi
          job=$(gh api -X GET "repos/$REPO/actions/runs/$1/jobs" -f filter=latest -f per_page=100 \
            --jq '[.jobs[] | select(.conclusion == "failure")][0].name // "unknown"') || job=unknown
          id=$(gh api "repos/$REPO/pulls/$front" --jq .node_id) || { log "queue-heal: front #$front unreadable, left alone"; exit 0; }
          if dry; then
            log "dry-run: would dequeue #$front"
            log "dry-run: would label #$front dequeued"
            log "queue-heal: #$front dequeued, its own group failed (run $1, job $job)"
            exit 0
          fi
          if gh api graphql -f query='
              mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$id" --silent; then
            gh api -X POST "repos/$REPO/issues/$front/labels" -f "labels[]=dequeued" --silent || true
            log "queue-heal: #$front dequeued, its own group failed (run $1, job $job)"
          else
            log "queue-heal: #$front dequeue failed (run $1, job $job)"
          fi
          exit 0
      - name: API budget (last)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(gh api rate_limit --jq '.resources.core | "\(.remaining) of \(.limit), resets in \(.reset - now | floor) s"' 2>/dev/null) || line=
          [ -n "$line" ] || line=unknown
          echo "api budget: ${{ github.workflow }}/${{ github.job }} $line" | tee -a "$GITHUB_STEP_SUMMARY"
